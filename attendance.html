<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>נוכחות חניכים · מרכז דניאל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{ --bg:#0b1422; --surface:#132134; --ink:#e7eef8; --muted:#94a6bd; --line:#24374f;
  --navy:#6ea6e8; --flag:#f19a45; --ok:#4cc39a; --stop:#ff6b55; --chip:#1b2c44; --head:#163a66; }
@media (prefers-color-scheme: light){ :root{ --bg:#f4f7fb; --surface:#fff; --ink:#132640; --muted:#56677d; --line:#d8e1ec; --navy:#2161ad; --flag:#ec8f33; --ok:#1d7f62; --stop:#c63a28; --chip:#e7eef8; --head:#2161ad; } }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;border-bottom:4px solid var(--flag);padding:13px 16px 10px;display:flex;align-items:center;gap:10px}
header .lg{width:32px;height:32px;border-radius:8px;background:rgba(0,0,0,.2);display:grid;place-items:center;font-size:17px;flex:none}
header h1{font:400 1.18rem 'Secular One'}
header .s{font-size:.72rem;opacity:.85}
.bd{padding:14px}
button{font-family:inherit;cursor:pointer}
.rem{display:flex;align-items:center;gap:9px;background:#2a2113;border:1px solid #5a4620;color:#f3c98a;border-radius:12px;padding:10px 12px;font-size:.86rem;font-weight:700;margin-bottom:14px}
.reasonbox{background:#2a1a1a;border:1px solid var(--stop);border-radius:12px;padding:10px;margin:-4px 2px 10px}
.actrow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.actsub{flex:0 0 auto;background:transparent;border:1px solid var(--flag);color:var(--flag);border-radius:12px;font:800 .8rem 'Assistant';padding:8px 12px;white-space:nowrap}
.actsub.pend{border-color:var(--line);color:var(--muted)}
.actname{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:700 .92rem 'Assistant';padding:10px 14px;text-align:right}
.actname.sc-req{border-color:#a85a1e;background:#2a1e12}
.actname.sc-open{border-color:#8a7a1e;background:#2a2712}
.actname.sc-done{border-color:#2e6b45;background:#13261c}
.actname.sc-cancel{border-color:#8a2e2e;background:#2a1414}
.scchip{display:inline-block;margin-inline-start:8px;font:800 .7rem 'Assistant';padding:1px 7px;border-radius:999px;vertical-align:middle}
.scchip.sc-req{background:#a85a1e;color:#fff}.scchip.sc-open{background:#8a7a1e;color:#fff}.scchip.sc-done{background:#2e6b45;color:#fff}.scchip.sc-cancel{background:#8a2e2e;color:#fff}
.gsel .daygroups button.sc-req{border-color:#a85a1e;color:#f0b98a}.gsel .daygroups button.sc-open{border-color:#8a7a1e;color:#f0dd8a}.gsel .daygroups button.sc-done{border-color:#2e6b45;color:#8fe3b0}.gsel .daygroups button.sc-cancel{border-color:#8a2e2e;color:#f08a8a}
.who{font-size:.85rem;color:var(--muted);margin:2px 2px 12px}
.who b{color:var(--ink)}
.who a{color:var(--navy);cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:14px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.datebar b{font:800 1.05rem 'Assistant'}
.datebar .nav{background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:1.1rem;padding:5px 13px}
.datebar .dctr{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.dstat{font:800 .66rem 'Assistant';letter-spacing:.03em;border-radius:999px;padding:2px 9px}
.dstat.now{background:#163a66;color:#cfe4ff;border:1px solid #2a5a93}
.dstat.past{background:#0f2e24;color:#7fd8ba;border:1px solid #1f6e4e}
.dstat.future{background:#2a2113;color:#f3c98a;border:1px solid #5a4620}
.todayrow{display:flex;justify-content:center;margin:-4px 0 12px}
.todaybtn{background:var(--chip);border:1px solid var(--line);border-radius:999px;color:var(--navy);font:700 .8rem 'Assistant';padding:6px 15px}
.asin{background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:600 .95rem 'Assistant';padding:11px 12px;width:100%}
.asin::placeholder{color:var(--muted)}
.rem.tap{cursor:pointer}
.gsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.gsel button{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:600 .82rem 'Assistant';color:var(--muted)}
.gsel button.on{background:#214a7d;border-color:#3e6fa8;color:#fff}
.gsel .gbr{flex-basis:100%;font:800 .72rem 'Assistant';letter-spacing:.04em;color:var(--flag);margin:10px 2px 0}
.gsel .gbr:first-child{margin-top:0}
.gsel .gday{flex-basis:100%;font:700 .74rem 'Assistant';color:var(--ink);margin:4px 2px -2px;padding-inline-start:4px;opacity:.85}
.gsel.acc{flex-direction:column;gap:4px}
.gsel.acc .gbr{margin:10px 2px 2px}
.gsel .dayhdr{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:700 .92rem 'Assistant';color:var(--ink)}
.gsel .dayhdr.open{background:#1b2740;border-color:#3e6fa8}
.gsel .dayhdr .cnt{display:inline-block;min-width:18px;text-align:center;background:var(--line);border-radius:999px;font:700 .72rem 'Assistant';padding:1px 7px;margin-inline-start:6px;color:var(--muted)}
.gsel .dayhdr.sel .cnt{background:var(--flag);color:#2b1400}
.gsel .dayhdr .chev{color:var(--muted);font-size:.85rem}
.gsel .daygroups{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 8px}
.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchip{background:var(--chip);border:1px solid var(--line);border-radius:999px;color:var(--ink);font:700 .85rem 'Assistant';padding:7px 12px;cursor:pointer}
.hchip.on{border-color:var(--flag);color:var(--flag);background:rgba(240,138,40,.1)}
.hflbl{font-size:.78rem;color:var(--muted);margin-bottom:-2px}
.ghostbtn{background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:700 .86rem 'Assistant';padding:9px 14px;display:inline-flex;align-items:center;gap:6px}
.ssearch{width:100%;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:600 .92rem 'Assistant'}
.sres .sr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.sres .sr:first-child{border-top:0}
.sres .sr b{font-weight:700}.sres .sr span{font-size:.75rem;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid var(--line);font-size:.9rem}
.sumrow:first-of-type{border-top:0}
.sumrow .c{font:700 .82rem 'IBM Plex Mono'}
.sumh{font:800 .74rem 'Assistant';letter-spacing:.03em;color:var(--muted);margin:12px 2px 4px}
.sumh:first-child{margin-top:0}
.badge-x{background:#311416;color:var(--stop);border-radius:7px;padding:2px 8px;font:700 .8rem 'IBM Plex Mono'}
.gttl{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}
.gttl .t{font-weight:800}
.pill{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font:600 .8rem 'Assistant'}
.pill b{color:var(--ok)}
.st{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .nm{flex:1;font-weight:700;font-size:.95rem;min-width:0;text-align:right;background:none;border:0;color:var(--ink);padding:0}
.st .nm small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);flex:none}
.seg button{background:none;border:0;color:var(--muted);font:700 .82rem 'Assistant';padding:7px 11px}
.seg button+button{border-inline-start:1.5px solid var(--line)}
.seg .ok{background:var(--ok);color:#06231a}
.seg .no{background:var(--stop);color:#2a0b07}
.msg{text-align:center;color:var(--muted);padding:30px 10px;font-size:.92rem}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* name gate */
.gate{position:fixed;inset:0;background:rgba(5,10,20,.75);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.gate .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%}
.gate h2{font:800 1.15rem 'Assistant';margin-bottom:6px}
.gate p{font-size:.85rem;color:var(--muted);margin-bottom:14px}
.gate input{width:100%;font:600 1.05rem 'Assistant';background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:6px}
.gate .err{color:var(--stop);font-size:.8rem;font-weight:700;min-height:1.1em;margin-bottom:8px}
.gate button.go{width:100%;background:var(--flag);color:#2b1400;border:0;border-radius:10px;padding:12px;font:800 1rem 'Assistant'}
/* student card overlay */
.ov{position:fixed;inset:0;background:rgba(5,10,20,.72);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.ov .box{background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
/* חלון השעות — מסך מלא, עם מרווח תחתון שלא נחתך ע"י סרגל הניווט של הטלפון */
#hov .box{max-width:560px;height:100vh;height:100dvh;max-height:100dvh;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top))}
/* מצב "שעות בלבד" (טאב נפרד): רק מסך השעות */
body.hoursonly #main{display:none}
body.hoursonly #hov{background:var(--bg)}
.ov .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ov .av{width:50px;height:50px;border-radius:13px;background:#214a7d;color:#fff;display:grid;place-items:center;font:800 1.2rem 'Assistant';flex:none}
.ov .av.f{background:#7a3a63}
.ov .top .nm{font:800 1.2rem 'Assistant';line-height:1.15}
.ov .top .sub{font-size:.8rem;color:var(--muted)}
.ov .x{margin-inline-start:auto;background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:700;padding:6px 11px}
.hsumc{display:flex;gap:10px;margin:4px 0 12px}
.hsug{border:1px dashed var(--flag);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.hsug .q{font-weight:800;font-size:.88rem;margin-bottom:6px}
.hsumc .c{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.hsumc .c .v{font:800 1.6rem 'Assistant';line-height:1.1}
.hsumc .c .v small{font-size:.8rem;font-weight:700;color:var(--muted);margin-inline-start:3px}
.hsumc .c .k{font-size:.78rem;color:var(--muted);font-weight:700}
.hsec{font:800 .8rem 'Assistant';color:var(--muted);margin:12px 2px 6px}
.hcard{display:flex;align-items:center;gap:12px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.hcard.plan{opacity:.6;border-style:dashed}
.hcard .dt{min-width:42px;text-align:center;line-height:1.1}
.hcard .dt b{display:block;font-size:1.15rem}
.hcard .dt span{font-size:.72rem;color:var(--muted);font-weight:700}
.hcard .mid{flex:1;min-width:0}
.hcard .mid .a{font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcard .mid .t{font-size:.78rem;color:var(--muted)}
.hcard .hrs{font:800 1rem 'Assistant';color:var(--flag);white-space:nowrap}
.hcard .hrs small{font-size:.7rem;color:var(--muted);margin-inline-start:2px}
.hrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.hrow .hd{font-weight:700;font-size:.85rem;min-width:54px}
.hrow .ha{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .ht{font-size:.78rem;color:var(--muted)}
.hrow .hh{font-weight:800;color:var(--flag)}
.call{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#14402e,#0f3326);border:1px solid #1f6e4e;border-radius:16px;padding:13px 15px;margin-bottom:12px;text-decoration:none}
.call .ic{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#06231a;display:grid;place-items:center;font-size:21px;flex:none}
.call .lab{font-size:.74rem;color:#8fd9bf}
.call .ph{font:600 1.3rem 'IBM Plex Mono';color:#eafff5}
.addcontact{display:block;width:100%;background:var(--chip);border:1px solid var(--line);border-radius:12px;color:var(--navy);font:700 .9rem 'Assistant';padding:11px;margin-bottom:12px}
.rmst{display:block;width:100%;background:transparent;border:1px solid var(--stop);border-radius:12px;color:var(--stop);font:700 .9rem 'Assistant';padding:11px;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cell .k{font-size:.72rem;color:var(--muted)}
.cell .v{font:800 1.1rem 'Assistant';margin-top:2px}
.cell .v.big{color:var(--flag)}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.notes .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.notes .h .k{font-size:.72rem;color:var(--muted)}
.note{display:flex;gap:8px;font-size:.9rem;padding:9px 0;border-top:1px solid var(--line);line-height:1.4}
.note:first-of-type{border-top:0}
.note .meta{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.naddrow{display:flex;gap:8px;margin-top:10px}
.naddrow input{flex:1;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:600 .9rem 'Assistant'}
.naddrow button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:0 15px;font:700 .9rem 'Assistant'}
[hidden]{display:none!important}
.embed header{display:none}
.embed .bd{padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="lg">⛵</div><div><h1>לוח פעילות</h1><div class="s" id="hsub">מרכז דניאל</div></div></header>
  <div class="bd" id="main"><div class="msg"><span class="spin"></span><div style="margin-top:10px">טוען…</div></div></div>
</div>

<div class="gate" id="gate" hidden>
  <div class="box">
    <h2>מה השם המלא שלך?</h2>
    <p>כדי שנראה לך את החניכים של הקבוצה שלך. צריך שם פרטי ושם משפחה.</p>
    <input id="gfirst" placeholder="שם פרטי" autocomplete="given-name">
    <input id="glast" placeholder="שם משפחה" autocomplete="family-name">
    <div class="err" id="gerr"></div>
    <button class="go" id="gsave">המשך</button>
  </div>
</div>

<div class="ov" id="ov" hidden><div class="box" id="ovbox"></div></div>
<div class="ov" id="hov" hidden><div class="box" id="hovbox"></div></div>

<script>
// כתובת המחבר אינה בקוד — היא מגיעה פעם אחת דרך הקישור הפרטי (#api=...) ונשמרת במכשיר.
var API = "";
try{ API = localStorage.getItem("att_api") || ""; }catch(e){}
(function(){
  var m = /[#&?]api=([^&]+)/.exec(location.hash + "&" + location.search);
  if(m){ API = decodeURIComponent(m[1]); try{ localStorage.setItem("att_api", API); }catch(e){} try{ history.replaceState(null,"",location.pathname); }catch(e){} }
})();
try{ if(/[?&]embed=/.test(location.search)) document.documentElement.classList.add("embed"); }catch(e){}
var HOURS_MODE=false; try{ HOURS_MODE=/[?&]hours=1/.test(location.search); }catch(e){}   // טאב "שעות" נפרד
var BRANCH = "jaffa";
try{ var mb=/[#&?]branch=([^&]+)/.exec(location.search); if(mb) BRANCH=decodeURIComponent(mb[1]); }catch(e){}
var COORDS = ["טל הררי","ירדן סדן","עידו חן"];   // רכזים (שם מלא)
function nameWords(s){ return norm(s).split(/\s+/).filter(Boolean); }
// התאמה מחמירה: כל מילות השם המוקלד נמצאות אצל המדריך, או להפך. דורש שם מלא.
function matchName(instructor, who){
  var iw = nameWords(instructor), ww = nameWords(who);
  if(!iw.length || ww.length < 2) return false;
  if(iw.indexOf(ww[0]) > -1) return true;   // השם הפרטי של המדריך מופיע בשם הקבוצה (גם בשמות מבולגנים)
  var allWin = ww.every(function(w){ return iw.indexOf(w) > -1; });
  var allIin = iw.every(function(w){ return ww.indexOf(w) > -1; });
  return allWin || allIin;
}
function isCoordName(who){
  var ww = nameWords(who); if(ww.length < 2) return false;
  return COORDS.some(function(c){ return nameWords(c).every(function(w){ return ww.indexOf(w) > -1; }); });
}
// שם קבוצה לתצוגה — בלי עוזרי מדריך ובלי "הקבוצה של"
function cleanInst(s){
  var t = norm(String(s||""))
    .replace(/עוזר[ת]?\s*מדריכ[ה]?/g,"")
    .replace(/^\s*עוזר[ת]?\s*/,"")
    .replace(/^הקבוצ[הת]\s*(של\s*)?/,"")
    .replace(/^קבוצה\s*של\s*/,"");
  if(t.indexOf("+")>-1){ var p=t.split("+"); t = norm(p[0]) || norm(p.slice(1).join("+")); }   // עוזר אחרי + — שומר את המדריך הראשי
  var vi=norm(t).search(/\sו/); if(vi>0) t=norm(t).slice(0,vi);   // "רון כפרי וטים" → מוריד עוזר שמחובר ב-ו׳
  t = norm(t) || "קבוצה";
  // שמות תצוגה מועדפים (לא משנה את הטבלה)
  var k = t.replace(/['’`׳"]/g,"");
  if(k==="יונתן גולן" || k==="גוני" || k==="גוני גולן") return "ג׳וני גולן";
  if(k.indexOf("ארז איתן")===0) return "ארז איתן";   // "אייל"/"אליה" הם עוזרים — לא חלק מהשם
  // שמות משפחה (מטל) — השלמה למדריכים שרשומים בשם פרטי בלבד
  var LN = {"מעין":"מעין גלעד","מעיין":"מעין גלעד","גלי":"גלי מלכא","מיה":"מיה סניפר","יסמין":"יסמין קרסנובסקי","איתמר":"איתמר ברייר","גאיה":"גאיה בן סימון","גיאה":"גאיה בן סימון","מירב":"מירב לבנוני","עידו":"עידו חן","עידן":"עידו חן"};
  if(LN[k]) return LN[k];
  return t;
}
var DAYS = {0:"ראשון",1:"שני",2:"שלישי",3:"רביעי",4:"חמישי",5:"שישי",6:"שבת"};
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); };
var norm = function(s){ return String(s==null?"":s).trim().replace(/\s+/g," "); };

var state = { who:"", data:null, day:"", dates:[], di:0, groups:[], gi:0, isCoord:false, reqs:[] };

try{ state.who = localStorage.getItem("who") || localStorage.getItem("att_who") || ""; }catch(e){}

function fmtToday(d){ return d.getDate()+"/"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2); }

function boot(){
  if(!API){ $("main").innerHTML = '<div class="msg">כדי להשתמש במסך הנוכחות צריך לפתוח אותו דרך הקישור שקיבלת מהרכז.</div>'; return; }
  if(!state.who || nameWords(state.who).length < 2){ openGate(); return; }   // שם מלא חובה
  if(HOURS_MODE){ startHoursOnly(); return; }
  load();
}
function startHoursOnly(){
  state.isCoord = isCoordName(state.who);
  if(!hoursOK()){ $("main").innerHTML = '<div class="msg">אין לך הרשאה למסך השעות.</div>'; return; }
  document.body.classList.add("hoursonly");
  // הקבוצות נחוצות למסך ההחלפות (הפעילויות שלי) — מהמטמון מיד, ומהגיליון ברקע
  try{ var c=JSON.parse(localStorage.getItem("att_cache")||"null"); if(c&&c.groups) state.all=c.groups; }catch(e){}
  openHours();
  api({action:"rosterAll"}).then(function(j){ if(j&&j.ok){ state.all=j.groups||[]; renderSubUI(); } }).catch(function(){});
  loadReqs();
}
function openGate(){ $("gate").hidden=false; var p=nameWords(state.who||""); $("gfirst").value=p[0]||""; $("glast").value=p.slice(1).join(" "); setTimeout(function(){$("gfirst").focus();},100); }
$("gsave").addEventListener("click", saveName);
["gfirst","glast"].forEach(function(id){ $(id).addEventListener("keydown", function(e){ if(e.key==="Enter") saveName(); }); });
function saveName(){
  var f = norm($("gfirst").value), l = norm($("glast").value);
  if(!f || !l){ $("gerr").textContent = "צריך שם פרטי וגם שם משפחה"; return; }
  var v = f + " " + l;
  state.who = v; try{ localStorage.setItem("who", v); localStorage.setItem("att_who", v); }catch(e){}
  $("gate").hidden = true; if(HOURS_MODE) startHoursOnly(); else load();
}

function api(params){
  var u = API + "?" + Object.keys(params).map(function(k){ return k+"="+encodeURIComponent(params[k]); }).join("&");
  return fetch(u).then(function(r){ return r.json(); });
}
function post(body){ return fetch(API, {method:"POST", body:JSON.stringify(body)}).then(function(r){ return r.json(); }); }

function load(){
  // מציג מיד את הנתונים האחרונים מהמטמון (טעינה מיידית), ומרענן ברקע מול הגיליון
  var cached=null;
  try{ var c=JSON.parse(localStorage.getItem("att_cache")||"null"); if(c&&c.groups&&c.groups.length) cached=c.groups; }catch(e){}
  state.touched = false;
  if(cached){ state.all=cached; render(); }
  else $("main").innerHTML = '<div class="msg"><span class="spin"></span><div style="margin-top:10px">טוען נוכחות…</div></div>';
  api({action:"rosterAll"}).then(function(j){
    if(!j.ok){ if(!cached) $("main").innerHTML = '<div class="msg">שגיאה: '+esc(j.error||"")+'</div>'; return; }
    try{ localStorage.setItem("att_cache", JSON.stringify({t:Date.now(), groups:j.groups||[]})); }catch(e){}
    if(cached && state.touched) return;   // המשתמש כבר סימן — לא לדרוס את המסך הפעיל
    state.all = j.groups || [];
    render();
  }).catch(function(){ if(!cached) $("main").innerHTML = '<div class="msg">אין חיבור. נסו שוב.</div>'; });
  if(hoursOK()) loadReqs();   // צבעי החלפות בלוח — רק למי שמסך השעות פתוח לו
}
function loadReqs(){
  api({action:"subReqList", pending:1}).then(function(q){
    state.reqs=(q&&q.rows)?q.rows:[];
    renderSubUI();
    if(!HOURS_MODE && state.groups && state.groups.length && $("stlist")) render();   // לרענן צבעים בלוח
  }).catch(function(){});
}

function myGroups(){
  // כל הקבוצות משני הסניפים, מסוננות למדריך לפי שם מלא (אלא אם רכז רואה הכול)
  state.isCoord = isCoordName(state.who);
  var all = state.all || [];
  if(state.isCoord) return all.slice();
  return all.filter(function(g){ return matchName(g.instructor, state.who) || matchName(cleanInst(g.instructor), state.who); });
}

function render(){
  var groups = myGroups();
  state.groups = groups;
  // דגל "מדריך מוכר" — לפיו האפליקציה הראשית מחליטה אם להציג את תאב הנוכחות
  try{ if(state.isCoord || groups.length) localStorage.setItem("att_ok", norm(state.who)); else localStorage.removeItem("att_ok"); }catch(e){}
  $("hsub").textContent = "מרכז דניאל · יפו" + (state.isCoord ? " · כל הקבוצות" : "");
  if(!groups.length){
    $("main").innerHTML = '<div class="who">שלום <b>'+esc(state.who)+'</b></div>'+
      '<div class="msg">לא מצאנו קבוצה למדריך הזה.<br>בדקו שהשם זהה למה שכתוב בטבלה (אפשר לשנות שם בלחצן ✎ למעלה).</div>';
    return;
  }
  if(state.gi >= groups.length) state.gi = 0;
  var cur = groups[state.gi];
  // תאריכים של הקבוצה הנוכחית + בחירת ברירת מחדל (הקרוב להיום)
  state.dates = cur.dateCols.map(function(d){ return d.date; });
  state.di = nearestDate(state.dates);

  var h = '<div class="who">שלום <b>'+esc(state.who)+'</b></div>';
  // תזכורת: פעילויות שהתקיימו בשבועיים האחרונים ולא מולאו כלל
  var unfilled = unfilledRecent(cur);
  if(unfilled.length){
    h += '<div class="rem tap" id="rembanner">⏰ '+(unfilled.length===1
      ? 'פעילות '+esc(unfilled[0])+' התקיימה ועדיין לא מולאה'
      : unfilled.length+' פעילויות מהשבועיים האחרונים לא מולאו')+' — לחצו למעבר</div>';
  }
  // בוחר קבוצה (לרכזים / כמה קבוצות)
  if(groups.length > 1){
    var DORDER = ["ראשון","שני","שלישי","רביעי","חמישי","שישי"];
    var BR = { jaffa:"יפו", ta:"תל אביב" };
    var order = groups.map(function(g,i){ return i; }).sort(function(a,b){
      var ga=groups[a], gb=groups[b];
      if(ga.branch!==gb.branch) return (ga.branch==="jaffa"?0:1)-(gb.branch==="jaffa"?0:1);
      var d=DORDER.indexOf(ga.day)-DORDER.indexOf(gb.day); if(d) return d;
      return norm(ga.instructor).localeCompare(norm(gb.instructor),"he");
    });
    if(state.isCoord){
      // אקורדיון: ענף → יום (נפתח בלחיצה) → קבוצות
      var tree={}, brOrder=[];
      order.forEach(function(i){ var g=groups[i], br=BR[g.branch]||g.branch;
        if(!tree[br]){ tree[br]={}; brOrder.push(br); }
        (tree[br][g.day]=tree[br][g.day]||[]).push(i);
      });
      var curG=groups[state.gi]||groups[order[0]];
      var curKey=(BR[curG.branch]||curG.branch)+"|"+curG.day;
      if(state.openDay==null) state.openDay = curKey;
      var gh='<div class="gsel acc">';
      brOrder.forEach(function(br){
        gh += '<div class="gbr">'+esc(br)+'</div>';
        Object.keys(tree[br]).sort(function(a,b){ return DORDER.indexOf(a)-DORDER.indexOf(b); }).forEach(function(day){
          var key=br+"|"+day, open=(state.openDay===key), idxs=tree[br][day];
          var hasSel=idxs.indexOf(state.gi)>-1;
          gh += '<button class="dayhdr'+(open?" open":"")+(hasSel?" sel":"")+'" data-day="'+esc(key)+'"><span>'+esc(day)+' <span class="cnt">'+idxs.length+'</span></span><span class="chev">'+(open?"▾":"▸")+'</span></button>';
          if(open) gh += '<div class="daygroups">'+idxs.map(function(i){ var cs=groupSubStatus(groups[i]); return '<button data-gi="'+i+'" class="'+(i===state.gi?"on":"")+(cs?' sc-'+cs:'')+'">'+esc(cleanInst(groups[i].instructor))+(cs?' '+SUBLBL[cs].slice(0,2):'')+'</button>'; }).join('')+'</div>';
        });
      });
      h += gh + '</div>';
    } else {
      var gh2='<div class="gsel">';
      order.forEach(function(i){ var g=groups[i]; gh2 += '<button data-gi="'+i+'" class="'+(i===state.gi?"on":"")+'">'+esc(cleanInst(g.instructor))+' · '+esc(g.day)+'</button>'; });
      h += gh2 + '</div>';
    }
  }
  h += '<div class="card">';
  h += '<div class="datebar"><button class="nav" data-dd="-1">‹</button><div class="dctr"><b id="dlabel"></b><span id="dstat" class="dstat"></span></div><button class="nav" data-dd="1">›</button></div>';
  h += '<div class="todayrow"><button id="todaybtn" class="todaybtn">📍 לפעילות הקרובה</button></div>';
  h += '<div class="gttl"><span class="t">'+esc(cleanInst(cur.instructor))+' · '+esc(cur.day)+'</span><span class="pill" id="cnt"></span></div>';
  h += '<div id="submark"></div>';
  if(state.isCoord) h += '<div style="margin:0 2px 10px"><button id="assignbtn" class="ghostbtn">🔗 שייך שעות קבועות למדריך</button></div><div id="asgpanel"></div>';
  h += '<div style="margin:0 2px 10px"><button id="allp" class="ghostbtn">✓ סמן את כולם נוכחים</button></div>';
  h += '<div id="stlist"></div>';
  if(state.isCoord){   // הוספת חניך — רכזים בלבד
    h += '<div style="margin:12px 2px 0"><button id="addst" class="ghostbtn">➕ הוסף חניך</button></div>'+
      '<div id="addform" hidden style="margin-top:10px;display:flex;flex-direction:column;gap:8px">'+
        '<input id="as_name" class="asin" placeholder="שם החניך (חובה)">'+
        '<input id="as_parent" class="asin" placeholder="שם הורה">'+
        '<input id="as_phone" class="asin" type="tel" placeholder="טלפון הורה">'+
        '<div style="display:flex;gap:8px"><input id="as_shirt" class="asin" placeholder="מידת חולצה"><input id="as_age" class="asin" placeholder="גיל"></div>'+
        '<div id="as_err" style="color:var(--stop);font-size:.8rem;font-weight:700;min-height:1em"></div>'+
        '<div style="display:flex;gap:8px"><button id="as_save" class="asin" style="background:var(--flag);color:#2b1400;border:0;font-weight:800">שמור חניך</button><button id="as_cancel" class="asin" style="flex:0 0 90px">ביטול</button></div>'+
      '</div>';
  }
  h += '</div>';
  if(state.isCoord) h += '<div class="card" id="sumcard" style="margin-top:14px"></div>';   // הסיכום בסוף הגלילה
  $("main").innerHTML = h;
  if($("hoursbtn")) $("hoursbtn").onclick = openHours;
  if($("allp")) $("allp").onclick = markAllPresent;
  if($("assignbtn")) $("assignbtn").onclick = function(){ openAssign(state.groups[state.gi]); };
  if($("addst")) $("addst").onclick = function(){ var f=$("addform"); f.hidden=!f.hidden; if(!f.hidden) $("as_name").focus(); };
  if($("as_cancel")) $("as_cancel").onclick = function(){ $("addform").hidden=true; };
  if($("as_save")) $("as_save").onclick = addStudent;
  if($("ssearch")) $("ssearch").oninput = function(){ doSearch(this.value); };
  if($("sumcard")) renderSummary();
  document.querySelectorAll("[data-gi]").forEach(function(b){ b.onclick=function(){ state.gi=+b.dataset.gi; render(); }; });
  document.querySelectorAll("[data-day]").forEach(function(b){ b.onclick=function(){ state.openDay = (state.openDay===b.dataset.day) ? "" : b.dataset.day; render(); }; });
  document.querySelectorAll("[data-dd]").forEach(function(b){ b.onclick=function(){ changeDate(+b.dataset.dd); }; });
  if($("todaybtn")) $("todaybtn").onclick = function(){ jumpTo(nearestDate(state.dates)); };
  if($("rembanner")) $("rembanner").onclick = function(){ var di=state.dates.indexOf(unfilled[0]); if(di>-1) jumpTo(di); };
  updateDateUI();
  renderStudents();
}
function jumpTo(di){ state.di=di; updateDateUI(); renderStudents(); }
// עבר / היום / עתיד ביחס לתאריך (ללא שעות)
function daysAgo_(ds){ var t=new Date(); t.setHours(0,0,0,0); return Math.round((t - toDate_(ds))/864e5); }
function dateStatus(ds){ var d=daysAgo_(ds); return d===0?{t:"היום",c:"now"}:d>0?{t:"✓ התקיימה",c:"past"}:{t:"עתידית",c:"future"}; }
function updateDateUI(){
  var ds=state.dates[state.di]||"";
  if($("dlabel")) $("dlabel").textContent=ds;
  var st=$("dstat"); if(st){ var s=dateStatus(ds); st.textContent=s.t; st.className="dstat "+s.c; }
}
// פעילויות שהתקיימו בשבועיים האחרונים (0–14 יום) ואף חניך לא סומן בהן
function unfilledRecent(g){
  var out=[];
  g.dateCols.forEach(function(d){ var a=daysAgo_(d.date);
    if(a>=0 && a<=14 && !g.students.some(function(s){ return s.attendance[d.date]; })) out.push(d.date);
  });
  return out;
}

function nearestDate(dates){
  var today = new Date(); var best=0, bestdiff=1e15;
  dates.forEach(function(ds,i){ var p=ds.split("/"); var dt=new Date(2000+ +p[2], p[1]-1, +p[0]); var diff=Math.abs(dt-today); if(diff<bestdiff){bestdiff=diff;best=i;} });
  return best;
}
function changeDate(dd){ state.di=Math.max(0,Math.min(state.dates.length-1,state.di+dd)); updateDateUI(); renderStudents(); }

function renderStudents(){
  var cur = state.groups[state.gi]; var date = state.dates[state.di];
  var present = 0;
  var html = cur.students.map(function(s, idx){
    var v = s.attendance[date]||"";
    if(v==="v") present++;
    var ask = state.askReason && state.askReason.row===s.row && state.askReason.date===date;
    return '<div class="st">'+
      '<button class="nm" data-card="'+idx+'">'+esc(s.name)+(s.notes&&s.notes.length?' ⚠️':'')+'<small>'+esc(s.parent||"")+(s.shirt?' · חולצה '+esc(s.shirt):'')+'</small></button>'+
      '<div class="seg">'+
        '<button data-mark="v" data-row="'+s.row+'" class="'+(v==="v"?"ok":"")+'">✓</button>'+
        '<button data-mark="x" data-row="'+s.row+'" class="'+(v==="x"?"no":"")+'">✗</button>'+
      '</div></div>'+
      (ask ? '<div class="reasonbox"><input id="reason_in" class="asin" placeholder="סיבה להיעדרות (למשל: חולה / הודיעו מראש)"><div style="display:flex;gap:8px;margin-top:6px"><button id="reason_save" class="asin" style="background:var(--flag);color:#2b1400;border:0;font-weight:800">שמור סיבה</button><button id="reason_skip" class="asin" style="flex:0 0 76px">דלג</button></div></div>' : '');
  }).join("");
  $("stlist").innerHTML = html;
  if($("reason_in")){
    var asR=state.askReason, aS=cur.students.filter(function(x){return x.row===asR.row;})[0];
    $("reason_in").focus();
    $("reason_skip").onclick=function(){ state.askReason=null; renderStudents(); };
    $("reason_save").onclick=function(){ var t=norm($("reason_in").value); state.askReason=null; if(t&&aS) saveReason(aS, cur, asR.date, t); else renderStudents(); };
    $("reason_in").onkeydown=function(e){ if(e.key==="Enter") $("reason_save").click(); };
  }
  if($("submark")){
    var act=subAct(cur), rs=(state.reqs||[]).filter(function(r){ return r.act===act && r.date===date; });
    var pick=function(s){ return rs.filter(function(r){return r.status===s;})[0]; };
    var x, mk='';
    if((x=pick("בוטל"))) mk='<div class="rem" style="background:#2a1414;border-color:#8a2e2e;color:#f08a8a">🔴 הפעילות בוטלה (ביקש: '+esc(cleanInst(x.requester))+')</div>';
    else if((x=pick("ביטול ממתין"))) mk='<div class="rem" style="background:#2a1414;border-color:#8a2e2e;color:#f08a8a">🔴 '+esc(cleanInst(x.requester))+' ביקש לבטל — ממתין לרכז</div>';
    else if((x=pick("הושלם"))) mk='<div class="rem" style="background:#13301f;border-color:#2e6b45;color:#8fe3b0">🟢 '+esc(cleanInst(x.chosen))+' מחליף את '+esc(cleanInst(x.requester))+'</div>';
    else if((x=pick("פתוח"))) mk='<div class="rem" style="background:#2a2712;border-color:#8a7a1e;color:#f0dd8a">🟡 רכז אישר — ממתין שמחליף ייקח (ביקש: '+esc(cleanInst(x.requester))+')</div>';
    else if((x=pick("ממתין"))) mk='<div class="rem" style="background:#2a1e12;border-color:#a85a1e;color:#f0b98a">🟠 '+esc(cleanInst(x.requester))+' ביקש החלפה — ממתין לרכז</div>';
    $("submark").innerHTML=mk;
  }
  $("cnt").innerHTML = '<b>'+present+'</b> / '+cur.students.length+' נוכחים';
  document.querySelectorAll("#stlist [data-mark]").forEach(function(b){ b.onclick=function(){ mark(cur, date, b); }; });
  document.querySelectorAll("#stlist [data-card]").forEach(function(b){ b.onclick=function(){ openCard(cur.students[+b.dataset.card], cur); }; });
}

function mark(cur, date, btn){
  var row = +btn.dataset.row, val = btn.dataset.mark;
  var s = cur.students.filter(function(x){ return x.row===row; })[0];
  var nv = (s.attendance[date]===val) ? "" : val;   // לחיצה שנייה מבטלת
  s.attendance[date] = nv;                            // אופטימי
  state.touched = true;                               // שהרענון ברקע לא ידרוס סימון טרי
  state.askReason = (nv==="x") ? {row:row, date:date} : null;   // סימון נעדר → תיבת סיבה
  renderStudents();
  post({action:"mark", branch:cur.branch, day:cur.day, row:row, date:date, value:nv}).then(function(j){
    if(!j||!j.ok){ s.attendance[date] = ""; renderStudents(); alert("לא נשמר, נסו שוב"); }
  }).catch(function(){ s.attendance[date]=""; renderStudents(); alert("אין חיבור"); });
}

function markAllPresent(){
  var cur=state.groups[state.gi], date=state.dates[state.di], rows=[];
  cur.students.forEach(function(s){ if(s.attendance[date]!=="v"){ s.attendance[date]="v"; rows.push(s.row); } });
  state.touched = true;
  renderStudents();
  rows.forEach(function(row){ post({action:"mark",branch:cur.branch,day:cur.day,row:row,date:date,value:"v"}).catch(function(){}); });
}
function addStudent(){
  var cur=state.groups[state.gi];
  var name=norm($("as_name").value);
  if(!name){ $("as_err").textContent="צריך שם חניך"; return; }
  var btn=$("as_save"), old=btn.textContent; btn.disabled=true; btn.textContent="שומר…"; $("as_err").textContent="";
  post({action:"addStudent", branch:cur.branch, day:cur.day, group:cur.instructor, name:name,
    parent:norm($("as_parent").value), phone:norm($("as_phone").value), shirt:norm($("as_shirt").value), age:norm($("as_age").value)
  }).then(function(j){
    if(j&&j.ok){ try{localStorage.removeItem("att_cache");}catch(e){} state.touched=false; load(); }
    else { btn.disabled=false; btn.textContent=old; $("as_err").textContent="לא נשמר: "+((j&&j.error)||"נסו שוב"); }
  }).catch(function(){ btn.disabled=false; btn.textContent=old; $("as_err").textContent="אין חיבור"; });
}
function doSearch(q){
  var box=$("sres"); if(!box) return; q=norm(q);
  if(q.length<2){ box.innerHTML=""; return; }
  var pool = state.isCoord ? (state.all||[]) : (state.groups||[]);   // רכז: כל הקבוצות · מדריך: שלו בלבד
  var res=[]; pool.forEach(function(g){ g.students.forEach(function(s){ if(norm(s.name).indexOf(q)>-1) res.push({s:s,g:g}); }); });
  box.innerHTML = res.length ? res.slice(0,15).map(function(r,i){ return '<div class="sr" data-si="'+i+'"><b>'+esc(r.s.name)+'</b><span>'+esc(cleanInst(r.g.instructor))+' · '+esc(r.g.day)+'</span></div>'; }).join("") : '<div style="color:var(--muted);font-size:.85rem;padding:8px 2px">לא נמצא חניך</div>';
  box.querySelectorAll("[data-si]").forEach(function(el){ el.onclick=function(){ var r=res[+el.dataset.si]; openCard(r.s,r.g); }; });
}
function toDate_(ds){ var p=ds.split("/"); return new Date(2000+ +p[2], p[1]-1, +p[0]); }
function latestPastDate_(g){ var best=null; g.dateCols.forEach(function(d){ if(daysAgo_(d.date) >= 0){ var dt=toDate_(d.date); if(!best||dt>best.dt) best={date:d.date,dt:dt}; } }); return best; }   // רק תאריך שכבר קרה (היום או קודם)
function renderSummary(){
  var all=state.all||[], missing=[];
  all.forEach(function(g){ var lp=latestPastDate_(g); if(lp && !g.students.some(function(s){return s.attendance[lp.date];})) missing.push({g:g,date:lp.date}); });
  var h='<div class="sumh">קבוצות שלא מולאו (תאריך אחרון)</div>';
  h += '<div class="sumrow"><span>סה״כ לא מולאו</span><span class="c" style="color:'+(missing.length?'var(--stop)':'var(--ok)')+'">'+missing.length+'</span></div>';

function parentTitle(p){
  var n = norm(p).split(" ")[0] || "";
  if(!n) return "הורה של";

function saveContact(s, cur){

  var br = cur.branch==="jaffa" ? "יפו" : "תל אביב";
  var fn = (s.parent? s.parent+" · " : "") + parentTitle(s.parent)+" "+s.name+" · "+br+" · "+cur.day;
  var vcard = "BEGIN:VCARD\r\nVERSION:3.0\r\n"+
    "FN:"+vesc(fn)+"\r\n"+
    (s.phone? "TEL;TYPE=CELL:"+vesc(s.phone)+"\r\n" : "")+
    "NOTE:"+vesc(s.name+" · "+cleanInst(cur.instructor)+" · "+br+" · "+cur.day)+"\r\n"+
    "END:VCARD";
  var blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = ((s.parent||s.name)+".vcf").replace(/\s+/g,"_");
  document.body.appendChild(a); a.click();

       '<div style="margin-top:10px"><button id="rq_cancel" class="asin" style="flex:0 0 76px">סגור</button></div>';

  H+='<div style="display:flex;gap:8px"><button id="rq_send" class="asin" style="background:var(--flag);color:#2b1400;border:0;font-weight:800">שלח בקשה</button><button id="rq_cancel" class="asin" style="flex:0 0 76px">ביטול</button></div>';

function submitReq(){
  var me=norm(state.who), date=$("rq_date").value;
  var proposed=[].slice.call(document.querySelectorAll(".rq_p:checked")).map(function(c){ return c.value; });
  if(!proposed.length){ $("rq_err").textContent="בחרו לפחות מדריך אחד להציע"; return; }
  var r=findRow_(me, date); if(!r){ $("rq_err").textContent="לא נמצא היום שנבחר"; return; }
  var btn=$("rq_send"); btn.disabled=true; btn.textContent="שולח…";
  post({action:"subReqCreate", requester:me, month:hstate.month, date:date, act:r.act, start:r.start, end:r.end, total:r.total, proposed:proposed}).then(function(j){
    if(j&&j.ok){ $("reqbox").innerHTML='<div style="color:#22c55e;font-weight:800">הבקשה נשלחה ✓ הרכז יקבל אותה לאישור.</div>'; loadHours(); }
    else { btn.disabled=false; btn.textContent="שלח בקשה"; $("rq_err").textContent="לא נשלח: "+((j&&j.error)||"נסו שוב"); }
  }).catch(function(){ btn.disabled=false; btn.textContent="שלח בקשה"; $("rq_err").textContent="אין חיבור"; });
}
// ----- מדריך שהוצע — רואה הצעות ומאשר שהוא מוכן לקחת -----

       '<div><b>'+esc(cleanInst(r.requester))+'</b> צריך החלפה</div>'+
       '<div style="color:var(--muted);font-size:.85rem" dir="rtl">'+esc(r.date)+' · '+esc(r.act||"")+' <span dir="ltr">'+esc(r.start||"")+(r.end?'–'+esc(r.end):'')+'</span></div>'+
       '<button class="asin rq_take" data-id="'+esc(r.id)+'" style="margin-top:8px;background:var(--flag);color:#2b1400;border:0;font-weight:800">אני יכול לקחת</button></div>';

function acceptOffer(id, btn){
  btn.disabled=true; btn.textContent="שולח…";
  post({action:"subReqAccept", id:id, inst:norm(state.who)}).then(function(j){
    if(j&&j.ok){ loadHours(); }
    else { btn.disabled=false; btn.textContent="אני יכול לקחת"; alert("לא בוצע: "+((j&&j.error)||"נסו שוב")); }
  }).catch(function(){ btn.disabled=false; btn.textContent="אני יכול לקחת"; alert("אין חיבור"); });
}
// ----- הרכז — רואה בקשות ממתינות, בוחר מחליף (מעדיף מי שאישר) ומאשר -----

  var box=$("reqbox"); box.hidden=false;

    H+='<div style="border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px">'+
       '<div><b>'+esc(cleanInst(r.requester))+'</b> ביקש החלפה</div>'+
       '<div style="color:var(--muted);font-size:.85rem" dir="rtl">'+esc(r.date)+' · '+esc(r.act||"")+' <span dir="ltr">'+esc(r.start||"")+(r.end?'–'+esc(r.end):'')+'</span></div>'+
       '<div style="color:var(--muted);font-size:.78rem;margin-top:4px">אישרו: '+(r.accepted.length?esc(r.accepted.map(cleanInst).join(", ")):'אף אחד עדיין')+'</div>'+
       '<label style="font-size:.8rem;color:var(--muted);display:block;margin-top:6px">בחר מחליף</label>'+

       '<div style="display:flex;gap:8px;margin-top:8px"><button class="asin ap_ok" data-id="'+esc(r.id)+'" style="background:var(--flag);color:#2b1400;border:0;font-weight:800">אשר החלפה</button>'+
       '<button class="asin ap_no" data-id="'+esc(r.id)+'" style="flex:0 0 76px;border-color:var(--stop);color:var(--stop)">דחה</button></div></div>';
  });
  H+='<button id="rq_cancel" class="asin" style="flex:0 0 76px;margin-top:4px">סגור</button>';

  document.querySelectorAll(".ap_no").forEach(function(b){ b.onclick=function(){ rejectReq(b.dataset.id); }; });

function approveReq(id, chosen, btn){
  if(!chosen){ alert("בחרו מחליף"); return; }
  if(!confirm("לאשר ולהעביר את השעות אל "+cleanInst(chosen)+"?")) return;
  btn.disabled=true; btn.textContent="מאשר…";
  post({action:"subReqApprove", id:id, chosen:chosen}).then(function(j){
    if(j&&j.ok){ loadHours(); }
    else { btn.disabled=false; btn.textContent="אשר החלפה"; alert("לא בוצע: "+((j&&j.error)||"נסו שוב")); }
  }).catch(function(){ btn.disabled=false; btn.textContent="אשר החלפה"; alert("אין חיבור"); });
}
function rejectReq(id){
  if(!confirm("לדחות את הבקשה?")) return;
  post({action:"subReqReject", id:id}).then(function(j){ if(j&&j.ok) loadHours(); });
}
// d/m/yy ↔ yyyy-mm-dd (לשדה תאריך)
function isoOf(dmy){ var p=String(dmy||"").split("/"); if(p.length<3) return ""; return "20"+p[2]+"-"+pad2(+p[1])+"-"+pad2(+p[0]); }
function dmyOf(iso){ var p=String(iso||"").split("-"); if(p.length<3) return ""; return (+p[2])+"/"+(+p[1])+"/"+p[0].slice(2); }
function todayDmy(){ var d=new Date(); return d.getDate()+"/"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2); }
var HACTS=["🔄 החלפה","⛵ יום עבודה על סירות","🧰 ציוד"];
function hActLabel(a){ return String(a).replace(/^[^֐-׿A-Za-z0-9]+\s*/,""); }   // בלי האימוג'י
function openDayForm(date, row){
  // ברירת מחדל: היום (אם מסתכלים על החודש הנוכחי), אחרת ה-1 בחודש המוצג
  if(!date) date = (hstate.month===monthKey(new Date())) ? todayDmy() : monthDays(hstate.month)[0];
  $("hf_date").value = isoOf(date);
  $("hf_date").disabled = !!row;   // עריכת יום קיים — התאריך נעול (כדי לשנות תאריך: מחק והוסף)
  function setVals(act,s,e,tot){ $("hf_act").value=act||""; $("hf_start").value=toHHMM(s); $("hf_end").value=toHHMM(e); $("hf_total").value=tot||""; marks(); }
  // כפתורי "מה עשית": החלפה / סירות / ציוד + הפעילות הקבועה של היום (אם יש)
  function renderActs(){
    var list=HACTS.map(hActLabel), sc=schedFor(dmyOf($("hf_date").value)||date);
    var H=(sc&&sc.act?'<button type="button" class="hchip" data-act="'+esc(sc.act)+'">📅 '+esc(sc.act)+'</button>':'')+
      HACTS.map(function(a,i){ return '<button type="button" class="hchip" data-act="'+esc(list[i])+'">'+esc(a)+'</button>'; }).join('');
    $("hf_acts").innerHTML=H;
    document.querySelectorAll("#hf_acts [data-act]").forEach(function(b){ b.onclick=function(){ $("hf_act").value=b.dataset.act; if(b.dataset.act===(sc&&sc.act) && !$("hf_start").value) setVals(sc.act, sc.start, sc.end, calcTotal(sc.start,sc.end)); marks(); }; });
    marks();
  }
  function marks(){
    var a=norm($("hf_act").value), s=$("hf_start").value, e=$("hf_end").value;
    document.querySelectorAll("#hf_acts [data-act]").forEach(function(b){ b.classList.toggle("on", norm(b.dataset.act)===a); });
    document.querySelectorAll("#hform [data-slot]").forEach(function(b){ var t=b.dataset.slot==="am"?SLOT_AM:SLOT_PM; b.classList.toggle("on", s===t.start && e===t.end); });
  }
  // יום קיים → מילוי מהשורה; יום חדש → מילוי-מראש מהלו"ז הקבוע (אם יש)
  if(row){ setVals(row.act, row.start, row.end, row.total); }
  else { var sc=schedFor(date); if(sc) setVals(sc.act, sc.start, sc.end, calcTotal(sc.start,sc.end)); else setVals("","","",""); }
  renderActs();
  $("hf_err").textContent="";
  $("hf_del").style.display = row ? "" : "none";
  var f=$("hform"); f.hidden=false; f.scrollIntoView({behavior:"smooth",block:"center"});
  function recompute(){ var t=calcTotal($("hf_start").value,$("hf_end").value); if(t) $("hf_total").value=t; marks(); }
  $("hf_start").oninput=recompute; $("hf_end").oninput=recompute; $("hf_act").oninput=marks;
  document.querySelectorAll("#hform [data-slot]").forEach(function(b){ b.onclick=function(){ var t=b.dataset.slot==="am"?SLOT_AM:SLOT_PM; $("hf_start").value=t.start; $("hf_end").value=t.end; $("hf_total").value=t.total; marks(); }; });
  $("hf_date").onchange = row ? null : function(){ var d=dmyOf(this.value); var sc=schedFor(d); if(sc) setVals(sc.act, sc.start, sc.end, calcTotal(sc.start,sc.end)); renderActs(); };
  $("hf_cancel").onclick=function(){ f.hidden=true; };
  $("hf_del").onclick=function(){ delDay(dmyOf($("hf_date").value)); };
  $("hf_save").onclick=saveDay;
}
function saveDay(){
  var date=dmyOf($("hf_date").value), act=norm($("hf_act").value), s=$("hf_start").value, e=$("hf_end").value;
  var tot=norm($("hf_total").value)||calcTotal(s,e);
  if(!date){ $("hf_err").textContent="בחרו תאריך"; return; }
  if(!act && !tot && !s){ $("hf_err").textContent="מלאו פעילות או שעות"; return; }
  if(!act){ $("hf_err").textContent="בחרו מה עשית (או כתבו)"; return; }
  var month=monthOf(date);
  var btn=$("hf_save"); btn.disabled=true; btn.textContent="שומר…";
  post({action:"hoursSet", month:month, inst:hstate.inst, date:date, act:act, start:s, end:e, total:tot}).then(function(j){
    if(j&&j.ok){ hstate.month=month; loadHours(); }
    else { btn.disabled=false; btn.textContent="שמור"; $("hf_err").textContent="לא נשמר: "+((j&&j.error)||"נסו שוב"); }
  }).catch(function(){ btn.disabled=false; btn.textContent="שמור"; $("hf_err").textContent="אין חיבור"; });
}
function delDay(date){
  if(!confirm("למחוק את השעות של "+date+"?")) return;
  post({action:"hoursSet", month:hstate.month, inst:hstate.inst, date:date}).then(function(j){ if(j&&j.ok) loadHours(); });
}
function shiftMonth(d){ var p=hstate.month.split("-"); hstate.month=monthKey(new Date(+p[0], +p[1]-1+d, 1)); loadHours(); }
// ----- פעילויות קבועות: רשימה + שאלון "הוסף פעילות קבועה" (יום → פעילות → שעות) -----
var HDOW = [0,1,2,3,4,5];   // ראשון..שישי
function schedAct(g){ return g.day+" · "+(BRN[g.branch]||g.branch); }
function groupsOfInst(inst){ return (state.all||[]).filter(function(g){ return matchName(g.instructor, inst) || matchName(cleanInst(g.instructor), inst); }); }
function mySched(){ return (hstate.sched||[]).filter(function(r){ return norm(r.inst)===norm(hstate.inst); }).sort(function(a,b){ return (+a.dow)-(+b.dow); }); }
// קבוצות של המדריך שעוד אין להן פעילות קבועה → שאלה אחת: בוקר או צהריים (פתוח לכולם — טל)
function schedSuggestions(){
  var taken={}; mySched().forEach(function(r){ taken[String(r.dow)]=1; });
  return groupsOfInst(hstate.inst).filter(function(g){ var d=dowOf(g.day); if(d<0 || taken[String(d)]) return false; taken[String(d)]=1; return true; });
}
function sugHTML(sug){
  return sug.map(function(g,k){
    return '<div class="hsug"><div class="q">⛵ הקבוצה שלך ביום '+esc(g.day)+' · '+esc(BRN[g.branch]||g.branch)+' — מתי?</div><div class="hchips">'+
      '<button type="button" class="hchip" data-sgk="'+k+'" data-sgs="am">☀️ בוקר 10–14</button>'+
      '<button type="button" class="hchip" data-sgk="'+k+'" data-sgs="pm">🌤 צהריים 14–18</button></div></div>';
  }).join('');
}
function bindSug(root, sug){
  root.querySelectorAll("[data-sgk]").forEach(function(b){ b.onclick=function(){
    var g=sug[+b.dataset.sgk], t=b.dataset.sgs==="am"?SLOT_AM:SLOT_PM;
    root.querySelectorAll("[data-sgk]").forEach(function(x){ x.disabled=true; }); b.textContent="שומר…";
    schedSave({dow:dowOf(g.day), act:schedAct(g), start:t.start, end:t.end}, "נוסף ✓ — השעות של הקבוצה ייכנסו לבד כל חודש", true);
  }; });
}
function openSched(){
  var box=$("schedbox"); box.hidden=false;

  box.scrollIntoView({behavior:"smooth",block:"center"});

function renderSched(msg){

      '<div style="flex:1"><b>יום '+esc(DAYS[+r.dow]||r.dow)+'</b> · '+esc(r.act||"")+' <span dir="ltr" style="color:var(--muted);font-size:.85rem">'+esc(toHHMM(r.start))+(r.end?'–'+esc(toHHMM(r.end)):'')+'</span></div>'+
      '<button class="hchip" data-scdel="'+esc(r.dow)+'" style="color:var(--stop);border-color:var(--stop)">הסר</button></div>';

  H+='<div style="margin-top:10px"><button id="sc_cancel" class="asin" style="flex:0 0 76px">סגור</button></div>';
  box.innerHTML=H;
  $("sc_cancel").onclick=function(){ box.hidden=true; hstate.schedOpen=false; };
  $("sc_add").onclick=openSchedQ;
  document.querySelectorAll("[data-scdel]").forEach(function(b){ b.onclick=function(){
    if(!confirm("להסיר את הפעילות הקבועה של יום "+(DAYS[+b.dataset.scdel]||"")+"?\n(שעות שכבר נרשמו נשארות)")) return;
    b.disabled=true; schedSave({dow:b.dataset.scdel, act:"", start:"", end:""}, "הוסר ✓", false);
  }; });

// השאלון: יום → מה → שעות
function openSchedQ(){
  var p=$("sc_q"), q={dow:null, act:"", g:null};
  var taken={}; mySched().forEach(function(r){ taken[String(r.dow)]=r; });
  function draw(){
    var H='<div class="card" style="padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px">';
    H+='<div class="hflbl">1. באיזה יום?</div><div class="hchips">'+HDOW.map(function(d){ return '<button type="button" class="hchip'+(q.dow===d?' on':'')+'" data-qd="'+d+'">'+DAYS[d]+'</button>'; }).join('')+'</div>';
    if(q.dow!==null){
      if(taken[String(q.dow)]) H+='<div style="color:var(--flag);font-size:.78rem">⚠️ כבר יש פעילות קבועה ביום '+DAYS[q.dow]+' ('+esc(taken[String(q.dow)].act)+') — היא תוחלף.</div>';
      var dayName=DAYS[q.dow], myG=groupsOfInst(hstate.inst).filter(function(g){ return g.day===dayName; });
      var others=(state.all||[]).filter(function(g){ return g.day===dayName && myG.indexOf(g)<0; });
      var fixed=["ריכוז","יום עבודה על סירות","ציוד"];
      H+='<div class="hflbl">2. מה הפעילות?</div><div class="hchips">'+

function schedSave(row, okMsg, fill){

  }).then(function(){
    hstate.schedMsg=okMsg; if(!hstate.schedOpen) hstate.flash=okMsg; loadHours();   // טוען מחדש שעות + קבועות; חלון הקבועות נשאר פתוח

// פעילויות קבועות מתוך הקבוצות (בלי כפתור): לכל קבוצה שידוע מי המדריך ומתי היא (GROUP_SLOTS / חנ"ב / רון)
// ולמדריך אין עדיין פעילות קבועה באותו יום — מחזיר מה להוסיף. only = רק למדריך הזה.
function groupFixedTodo(only){
  var taken={}; (hstate.sched||[]).forEach(function(r){ taken[norm(r.inst)+"|"+r.dow]=1; });
  var todo=[];
  (state.all||[]).forEach(function(g){
    var t=defaultTimes(g), d=dowOf(g.day); if(!t||d<0) return;
    var inst=HSTAFF.filter(function(n){ return matchName(g.instructor,n) || matchName(cleanInst(g.instructor),n); })[0]; if(!inst) return;
    if(only && norm(inst)!==norm(only)) return;
    var k=norm(inst)+"|"+d; if(taken[k]) return; taken[k]=1;
    todo.push({inst:inst, dow:d, act:schedAct(g), start:t.start, end:t.end});
  });
  return todo;
}
// אוטומטי, בלי כפתורים (מחודש העלייה לכולם), פעם אחת לחודש כשנכנסים למסך:
// 1. פעילויות קבועות נוצרות לבד מהקבוצות (מי מדריך + מתי הקבוצה).
// 2. החודש מתמלא לבד מהפעילויות הקבועות — רק למי שעדיין אין לו החודש אף שורה שלהן (כך יום שנמחק/בוטל לא חוזר).
// רכז/מנהל שנכנס — מטפל בכל המדריכים; מדריך — רק בעצמו.
var AUTO_FILL_FROM="2026-12";
var _autoFilled={};
function autoFillMonth(){
  var cur=monthKey(new Date()); if(hstate.month!==cur || cur<AUTO_FILL_FROM || _autoFilled[cur]) return;
  _autoFilled[cur]=1;
  var me=hoursAdmin()?null:norm(state.who);
  var seq=function(list,fn){ return list.reduce(function(pr,x){ return pr.then(function(){ return fn(x).catch(function(){}); }); }, Promise.resolve()); };
  var newFixed=groupFixedTodo(me);
  seq(newFixed, function(x){ return post({action:"schedSet", inst:x.inst, dow:x.dow, act:x.act, start:x.start, end:x.end}); })
  .then(function(){ return newFixed.length ? api({action:"schedRead"}).then(function(j){ hstate.sched=(j&&j.rows)||hstate.sched; }) : null; })
  .then(function(){
    var fixed={}; (hstate.sched||[]).forEach(function(r){ var n=norm(r.inst); (fixed[n]=fixed[n]||{})[norm(r.act)]=1; });
    var filled={}; hstate.rows.forEach(function(r){ var n=norm(r.inst); if(fixed[n] && fixed[n][norm(r.act)]) filled[n]=1; });
    var todo=Object.keys(fixed).filter(function(n){ return !filled[n] && (!me || n===me); });
    if(!todo.length && !newFixed.length) return false;
    return seq(todo, function(inst){ return post({action:"schedFill", inst:inst, month:cur}); }).then(function(){ return true; });
  })
  .then(function(changed){ if(changed && hstate.month===cur) loadHours(); });
}

  var month=monthOf(date);
  api({action:"hoursRead", month:month}).then(function(j){
    var hr=((j&&j.rows)||[]).filter(function(r){ return norm(r.inst)===norm(state.who) && r.date===date; })[0] || defaultTimes(g) || {};
    return post({action:"subReqCancel", requester:norm(state.who), month:month, date:date, act:subAct(g), start:hr.start||"", end:hr.end||"", total:hr.total||""});
  }).then(function(res){
    if(res&&res.ok){ $("subpanel").innerHTML='<div class="card" style="padding:12px;color:#f08a8a;font-weight:800">בקשת הביטול נשלחה לרכז ✓</div>'; loadReqs(); }
    else if($("ar_kill")){ btn.disabled=false; btn.textContent="🔴 בקש לבטל"; alert("לא נשלח: "+((res&&res.error)||"")); }
  }).catch(function(){ if($("ar_kill")){ btn.disabled=false; btn.textContent="🔴 בקש לבטל"; } alert("אין חיבור"); });
}
// מדריך שהוצע — בקשות פתוחות שהרכז אישר, שהוא יכול להירשם אליהן
function attOffers(){
  var p=$("subpanel"); if(!p) return;
  var mine=myOpenOffers();
  var H='<div class="card" style="padding:12px;margin-bottom:12px"><div class="sumh" style="margin:0 0 8px">🔔 הצעות החלפה פתוחות עבורך</div>';
  if(!mine.length) H+='<div style="color:var(--muted);font-size:.85rem">אין הצעות פתוחות כרגע.</div>';
  mine.forEach(function(r){
    H+='<div style="border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px"><div><b>'+esc(cleanInst(r.requester))+'</b> צריך החלפה</div><div style="color:var(--muted);font-size:.85rem">'+esc(r.date)+' · '+esc(r.act||"")+'</div><button class="asin ar_take" data-id="'+esc(r.id)+'" style="margin-top:8px;background:var(--flag);color:#2b1400;border:0;font-weight:800">אני לוקח את זה</button></div>';
  });
  H+='<button class="asin" id="ar_close">סגור</button></div>';
  p.innerHTML=H; p.scrollIntoView({behavior:"smooth",block:"center"});
  $("ar_close").onclick=function(){ p.innerHTML=""; };
  document.querySelectorAll(".ar_take").forEach(function(b){ b.onclick=function(){ attTake(b.dataset.id, b); }; });
}
function attTake(id, btn){
  if(!confirm("להחליף בפעילות הזו? השעות יירשמו לך.")) return;
  btn.disabled=true; btn.textContent="נרשם…";
  post({action:"subReqTake", id:id, inst:norm(state.who)}).then(function(j){ if(j&&j.ok){ loadReqs(); } else { btn.disabled=false; btn.textContent="אני לוקח את זה"; alert("לא בוצע: "+((j&&j.error)||"")); } }).catch(function(){ btn.disabled=false; btn.textContent="אני לוקח את זה"; alert("אין חיבור"); });
}
// רכז — בקשות ממתינות. "אשר" פותח אותן למחליפים שהוצעו.
function attApprovals(){
  var p=$("subpanel"); if(!p) return;
  var pend=coordPending();
  var H='<div class="card" style="padding:12px;margin-bottom:12px"><div class="sumh" style="margin:0 0 8px">📥 בקשות החלפה לאישור</div>';
  if(!pend.length) H+='<div style="color:var(--muted);font-size:.85rem">אין בקשות ממתינות.</div>';
  pend.forEach(function(r){
    if(r.status==="ביטול ממתין"){
      H+='<div style="border:1px solid #8a2e2e;background:#2a1414;border-radius:12px;padding:10px;margin-bottom:8px"><div>🔴 <b>'+esc(cleanInst(r.requester))+'</b> מבקש לבטל פעילות</div><div style="color:var(--muted);font-size:.85rem">'+esc(r.date)+' · '+esc(r.act||"")+'</div><div style="display:flex;gap:8px;margin-top:8px"><button class="asin apx_cok" data-id="'+esc(r.id)+'" style="background:#8a2e2e;color:#fff;border:0;font-weight:800">אשר ביטול</button><button class="asin apx_no" data-id="'+esc(r.id)+'" style="flex:0 0 76px">דחה</button></div></div>';
      return;
    }
    var opts=r.proposed.map(function(n){ return '<label style="display:flex;gap:8px;align-items:center;padding:4px 2px"><input type="checkbox" class="apx_p" data-id="'+esc(r.id)+'" value="'+esc(n)+'" checked>'+esc(cleanInst(n))+'</label>'; }).join('');
    H+='<div style="border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px"><div><b>'+esc(cleanInst(r.requester))+'</b> ביקש החלפה</div><div style="color:var(--muted);font-size:.85rem">'+esc(r.date)+' · '+esc(r.act||"")+'</div><div style="font-size:.8rem;color:var(--muted);margin-top:6px">אשרו אילו מהמוצעים יכולים להחליף:</div><div style="margin:4px 0 6px">'+opts+'</div><div style="display:flex;gap:8px;margin-top:4px"><button class="asin apx_ok" data-id="'+esc(r.id)+'" style="background:var(--flag);color:#2b1400;border:0;font-weight:800">אשר ופתח</button><button class="asin apx_no" data-id="'+esc(r.id)+'" style="flex:0 0 76px;border-color:var(--stop);color:var(--stop)">דחה</button></div></div>';
  });
  H+='<button class="asin" id="ar_close2">סגור</button></div>';
  p.innerHTML=H; p.scrollIntoView({behavior:"smooth",block:"center"});
  $("ar_close2").onclick=function(){ p.innerHTML=""; };
  document.querySelectorAll(".apx_ok").forEach(function(b){ b.onclick=function(){
    var approved=[].slice.call(document.querySelectorAll('.apx_p[data-id="'+b.dataset.id+'"]:checked')).map(function(c){return c.value;});
    attApprove(b.dataset.id, approved, b);
  }; });
  document.querySelectorAll(".apx_no").forEach(function(b){ b.onclick=function(){ attReject(b.dataset.id); }; });
  document.querySelectorAll(".apx_cok").forEach(function(b){ b.onclick=function(){
    if(!confirm("לאשר את ביטול הפעילות? השעות של המדריך לתאריך הזה יירדו.")) return;
    b.disabled=true; b.textContent="מבטל…";
    post({action:"subReqCancelApprove", id:b.dataset.id}).then(function(j){ if(j&&j.ok) loadReqs(); else { b.disabled=false; b.textContent="אשר ביטול"; alert("לא בוצע: "+((j&&j.error)||"")); } }).catch(function(){ b.disabled=false; b.textContent="אשר ביטול"; alert("אין חיבור"); });
  }; });
}
function attApprove(id, approved, btn){
  if(!approved.length){ alert("בחרו לפחות מדריך אחד לאשר"); return; }
  btn.disabled=true; btn.textContent="מאשר…";
  post({action:"subReqApprove", id:id, approved:approved}).then(function(j){ if(j&&j.ok){ loadReqs(); } else { btn.disabled=false; btn.textContent="אשר ופתח"; alert("לא בוצע: "+((j&&j.error)||"")); } }).catch(function(){ btn.disabled=false; btn.textContent="אשר ופתח"; alert("אין חיבור"); });
}
function attReject(id){ if(!confirm("לדחות את הבקשה?")) return; post({action:"subReqReject", id:id}).then(function(j){ if(j&&j.ok) loadReqs(); }); }
// ----- שיוך שעות קבועות לקבוצה (רכז) → יום-קבוע + מילוי אוטומטי חודשי -----
function dowOf(name){ for(var k in DAYS){ if(DAYS[k]===name) return +k; } return -1; }
// כל פעילות = 4 שעות: בוקר 10:00–14:00, צהריים 14:00–18:00. חנ"ב תמיד בוקר; הקבוצות של רון — צהריים.
var SLOT_AM={start:"10:00", end:"14:00", total:"4"}, SLOT_PM={start:"14:00", end:"18:00", total:"4"};
var PM_INST=["רון כפרי"];
function isChanav(g){ return /חנ["״'׳]?ב/.test(String((g&&g.instructor)||"")); }
function plus4(t){ var m=parseT(t); if(m==null) return ""; m=(m+240)%1440; return pad2(Math.floor(m/60))+":"+pad2(m%60); }
// הכנה עתידית: שעות לכל קבוצה. כשנדע מתי כל קבוצה — מוסיפים כאן שורה, ואז ההצעות + "פעילויות קבועות לכולם" + המילוי החודשי עובדים לבד.
// day: יום הקבוצה · branch: "jaffa"/"ta" · name: (לא חובה) חלק משם הקבוצה · slot: "am"/"pm"
var GROUP_SLOTS = [
  // {day:"רביעי", branch:"ta", name:"מיה", slot:"pm"},
];
function defaultTimes(g){
  var gs=GROUP_SLOTS.filter(function(x){ return g && x.day===g.day && x.branch===g.branch && (!x.name || String(g.instructor||"").indexOf(x.name)>-1); })[0];
  if(gs) return gs.slot==="am" ? SLOT_AM : SLOT_PM;
  if(isChanav(g)) return SLOT_AM;
  if(PM_INST.indexOf(norm(cleanInst((g&&g.instructor)||"")))>-1) return SLOT_PM;
  return null;
}
function openAssign(g){
  var p=$("asgpanel"); if(!p) return;
  var opts=HSTAFF.slice().sort(function(a,b){ return a.localeCompare(b,"he"); });
  var def=cleanInst(g.instructor);
  var hit=HSTAFF.filter(function(n){ return String(g.instructor||"").indexOf(n)>-1; })[0];
  if(!hit){ var toks=String(g.instructor||"").split(/[\s+\-,·]+/);
    var fm=HSTAFF.filter(function(n){ return toks.indexOf(n.split(" ")[0])>-1; }); if(fm.length===1) hit=fm[0]; }
  if(hit) def=hit;
  if(opts.map(norm).indexOf(norm(def))<0) opts.unshift("");
  var H='<div class="card" style="padding:12px;margin-bottom:12px"><div class="sumh" style="margin:0 0 8px">🔗 שיוך שעות קבועות — '+esc(g.day)+' · '+esc(BRN[g.branch]||g.branch)+'</div>';
  H+='<label style="font-size:.8rem;color:var(--muted)">מדריך</label><select id="asg_inst" class="asin" style="margin-bottom:10px">'+opts.map(function(n){ return n ? '<option'+(norm(n)===norm(def)?' selected':'')+'>'+esc(n)+'</option>' : '<option value="" selected>— בחרו מדריך —</option>'; }).join('')+'</select>';
  H+='<label style="font-size:.8rem;color:var(--muted)">שעות הפעילות</label><div style="display:flex;gap:8px;margin:4px 0 6px"><button type="button" id="asg_am" class="asin">☀️ בוקר 10–14</button><button type="button" id="asg_pm" class="asin">🌤 צהריים 14–18</button></div><div style="display:flex;gap:8px;margin:0 0 8px"><input id="asg_s" type="time" step="300" class="asin"><input id="asg_e" type="time" step="300" class="asin"></div>';
  H+='<div style="color:var(--muted);font-size:.78rem">כל פעילות 4 שעות — מספיק לבחור שעת התחלה. כל יום '+esc(g.day)+' ימולא אוטומטית בשעות העבודה של המדריך, כל חודש.</div>';
  H+='<div id="asg_err" style="color:var(--stop);font-size:.8rem;font-weight:700;min-height:1em;margin-top:4px"></div>';
  H+='<div style="display:flex;gap:8px;margin-top:6px"><button id="asg_save" class="asin" style="background:var(--flag);color:#2b1400;border:0;font-weight:800">שמור ומלא החודש</button><button id="asg_cancel" class="asin" style="flex:0 0 76px">ביטול</button></div></div>';
  p.innerHTML=H; p.scrollIntoView({behavior:"smooth",block:"center"});
  function setSlot(t){ $("asg_s").value=t.start; $("asg_e").value=t.end;
    $("asg_am").style.borderColor = t===SLOT_AM ? "var(--flag)" : ""; $("asg_pm").style.borderColor = t===SLOT_PM ? "var(--flag)" : ""; }
  var dt=defaultTimes(g); if(dt) setSlot(dt);
  $("asg_am").onclick=function(){ setSlot(SLOT_AM); };
  $("asg_pm").onclick=function(){ setSlot(SLOT_PM); };
  $("asg_s").oninput=function(){ var e=plus4(this.value); if(e) $("asg_e").value=e; $("asg_am").style.borderColor=$("asg_pm").style.borderColor=""; };
  $("asg_cancel").onclick=function(){ p.innerHTML=""; };
  $("asg_save").onclick=function(){ saveAssign(g); };
}
function saveAssign(g){
  var inst=$("asg_inst").value, s=$("asg_s").value, e=$("asg_e").value, dow=dowOf(g.day);
  if(!inst){ $("asg_err").textContent="בחרו מדריך"; return; }
  if(dow<0){ $("asg_err").textContent="לא זוהה יום הקבוצה"; return; }
  if(!s||!e){ $("asg_err").textContent="מלאו שעת התחלה וסיום"; return; }
  var act=g.day+" · "+(BRN[g.branch]||g.branch);
  var btn=$("asg_save"); btn.disabled=true; btn.textContent="שומר…";
  var month=monthKey(new Date());
  post({action:"schedSet", inst:inst, dow:dow, act:act, start:s, end:e}).then(function(j){
    if(!j||!j.ok) throw new Error((j&&j.error)||"");
    return post({action:"schedFill", inst:inst, month:month});
  }).then(function(j2){
    if($("asgpanel")) $("asgpanel").innerHTML="";
    alert("שויך ✓ נוספו "+((j2&&j2.added)||0)+" ימים לשעות של "+cleanInst(inst)+" החודש (וימשיך אוטומטית כל חודש).");
  }).catch(function(err){ if($("asg_save")){ btn.disabled=false; btn.textContent="שמור ומלא החודש"; } if($("asg_err")) $("asg_err").textContent="לא בוצע: "+((err&&err.message)||"נסו שוב"); });
}

$("ov").addEventListener("click", function(e){ if(e.target.id==="ov") closeCard(); });

boot();
</script>
