<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>נוכחות חניכים · מרכז דניאל</title>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="icons.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{ --bg:#0b1422; --surface:#132134; --ink:#e7eef8; --muted:#94a6bd; --line:#24374f;
  --navy:#6ea6e8; --flag:#f19a45; --ok:#4cc39a; --stop:#ff6b55; --chip:#1b2c44; --head:#163a66; --plan:#a78bfa; }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#f4f7fb; --surface:#fff; --ink:#132640; --muted:#56677d; --line:#d8e1ec; --navy:#2161ad; --flag:#ec8f33; --ok:#1d7f62; --stop:#c63a28; --chip:#e7eef8; --head:#2161ad; --plan:#7c4dde; } }
:root[data-theme="light"]{ --bg:#f4f7fb; --surface:#fff; --ink:#132640; --muted:#56677d; --line:#d8e1ec; --navy:#2161ad; --flag:#ec8f33; --ok:#1d7f62; --stop:#c63a28; --chip:#e7eef8; --head:#2161ad; --plan:#7c4dde; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;border-bottom:4px solid var(--flag);padding:13px 16px 10px;display:flex;align-items:center;gap:10px}
header .lg{width:32px;height:32px;border-radius:8px;background:rgba(0,0,0,.2);display:grid;place-items:center;font-size:17px;flex:none}
header h1{font:400 1.18rem 'Secular One'}
header .s{font-size:.72rem;opacity:.85}
.bd{padding:14px}
button{font-family:inherit;cursor:pointer}
.savest{font:800 .74rem 'Assistant',sans-serif;white-space:nowrap;margin-inline-start:auto;margin-inline-end:6px}
.savest.busy{color:var(--muted)} .savest.ok{color:var(--ok)} .savest.bad{color:var(--stop)}
.addf{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.02)}
.addh{display:flex;justify-content:space-between;align-items:center}
.addstep{font:800 .86rem 'Assistant',sans-serif;color:var(--ink);margin-top:4px}
.addtimes{display:flex;gap:8px;align-items:center}.addtimes span{color:var(--muted);font-weight:700;font-size:.85rem}
.addsum{background:#13301f;border:1px solid #2e6b45;color:#8fe3b0;border-radius:10px;padding:9px 11px;font-weight:800;font-size:.88rem;margin-top:4px}
.addwarn{color:#f3c98a;font-size:.8rem;font-weight:700}
.adderr{color:var(--stop);font-size:.8rem;font-weight:700;min-height:1em}
.addsave{border:0;border-radius:10px;padding:12px;font:800 1rem 'Assistant',sans-serif;background:var(--flag);color:#2b1400;cursor:pointer}
.addsave:disabled{background:var(--chip);color:var(--muted);cursor:default}
.addok{color:#22c55e;font-weight:800;font-size:.88rem;margin-bottom:8px}
/* (רון) כרטיסים אפורים בזמן טעינה */
.sk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sk i{display:block;height:11px;border-radius:6px;margin:9px 0;background:linear-gradient(90deg,var(--chip) 30%,var(--line) 50%,var(--chip) 70%);background-size:300% 100%;animation:skw 1.4s ease-in-out infinite}
.sk i.h{height:16px;width:42%;margin-top:4px}
@keyframes skw{from{background-position:100% 0}to{background-position:0 0}}
/* (רון) הודעה קופצת */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;width:max-content;max-width:calc(100% - 32px);background:#0f1a2b;color:#f1f5fb;border:1px solid rgba(255,255,255,.12);border-inline-start:4px solid var(--ok);border-radius:14px;padding:11px 16px;font:800 .9rem 'Assistant',sans-serif;line-height:1.35;box-shadow:0 10px 28px rgba(0,0,0,.35);transition:opacity .2s ease,transform .2s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-inline-start-color:var(--stop)}
/* (רון) מעברים חלקים */
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ovin{from{opacity:0}to{opacity:1}}
@keyframes boxup{from{opacity:.5;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes boxin{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.vin{animation:vin .22s ease-out}
.ov:not([hidden]){animation:ovin .18s ease-out}
.ov:not([hidden]) .box{animation:boxup .26s cubic-bezier(.2,.8,.2,1)}
#hov:not([hidden]) .box,#wpov:not([hidden]) .box{animation:boxin .26s cubic-bezier(.2,.8,.2,1)}
/* (רון) כפתורים אחידים: פינות, גובה, משקל, לחיצה */
button{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,opacity .15s ease;-webkit-user-select:none;user-select:none}
button:not(:disabled):active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.ab,.ghostbtn,.ov .x,.addcontact,.rmst,button.asin,.tdatt,.undobtn{border-radius:12px}
.ab{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 11px;font-size:.82rem}
.ghostbtn{min-height:42px;font-weight:800}
button.asin{min-height:44px;font-weight:800;text-align:center}
button.asin.pri{background:var(--flag);color:#2b1400;border-color:var(--flag)}
a.wabtn{display:block;box-sizing:border-box;min-height:44px;margin-top:6px;text-align:center;text-decoration:none;font-weight:800;background:#25D366;border-color:#25D366;color:#062b14}
.wax{background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:2px 8px}
button.asin.dng{background:var(--stop);color:#fff;border-color:var(--stop)}
.ov .x{min-height:36px;padding:6px 13px;font-weight:800}
.hchip{min-height:34px;font-weight:800}
.todaybtn{min-height:34px;font-weight:800}
.addcontact,.rmst{font-weight:800}
.addsave{border-radius:12px;min-height:44px}.addsave:disabled{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.todaycard{background:var(--surface);border:2px solid var(--flag);border-radius:14px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.tdrow.tdoff .tdnm b{text-decoration:line-through;opacity:.7}
.todaycard .tdh{font:800 .95rem 'Assistant',sans-serif;color:var(--flag)}
.tdrow{display:flex;align-items:center;gap:10px}
.tdnm{flex:1;min-width:0;display:flex;flex-direction:column}
.tdnm b{font-size:1rem}.tdnm span{color:var(--muted);font-size:.85rem;font-weight:600}
.bday{display:inline-block;margin-inline-start:6px;font:800 .72rem 'Assistant',sans-serif;color:#f472b6;border:1px solid #f472b6;border-radius:999px;padding:0 7px;vertical-align:middle}
.bdline{color:#f472b6;font-size:.8rem;font-weight:800}
.bdask{background:var(--surface);border:1px dashed #f472b6;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.bdask span{color:var(--muted);font-size:.85rem}
.bdrow{display:flex;gap:6px;min-width:0}
.bdrow select{flex:1 1 0;width:auto;min-width:0}
.bdrow .bdsave{width:auto;flex:0 0 auto;padding:0 16px}
.bdsave{background:#f472b6;color:#2b0a1c;border:0;font-weight:800;flex:0 0 auto}
.bdi{display:flex;flex-direction:column}
.bdi span{color:var(--muted);font-size:.8rem}
.bdi em{font-style:normal;color:#f472b6;font-weight:800;font-size:.82rem}
.dobf{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dobf label{font-size:.82rem;color:var(--muted);font-weight:700}
.clubwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.clubbar{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--ink);padding:10px 12px;cursor:pointer;text-align:start;font:inherit}
.clubbar .cbl{font:800 .86rem 'Assistant',sans-serif;color:var(--flag);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clubbar .cbs{margin-inline-start:auto;color:var(--muted);font:700 .78rem 'Assistant',sans-serif;white-space:nowrap}
.clubbar .cbs b{color:var(--flag)}
.clubbar .cbc{color:var(--muted);font-size:.8rem}
.clubbody{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.tdsum{color:var(--muted);font-size:.82rem;font-weight:700;margin-top:-6px}
.cchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cchip{font:800 .72rem 'Assistant',sans-serif;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.cchip.ok{color:var(--ok);border-color:var(--ok)} .cchip.warn{color:var(--flag);border-color:var(--flag)} .cchip.bad{color:var(--stop);border-color:var(--stop)}
.tdatt.sm{font-size:.86rem;padding:10px 12px}
.pen{background:none;border:0;color:var(--navy);font:700 .78rem 'Assistant',sans-serif;cursor:pointer;padding:2px 4px;margin-inline-start:4px}
/* (טל) 🗓 סידור עבודה */
.wpsec{font:800 .84rem 'Assistant',sans-serif;color:var(--ink);margin-top:2px}
.wprow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.wpm{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.wpm b{font-size:.98rem}
.wpm .wps{flex-basis:100%;color:var(--muted);font-size:.82rem;font-weight:600}
.wpbr{background:#facc15;color:#3a2a00;border-radius:999px;padding:0 7px;font:800 .7rem 'Assistant',sans-serif}
.wpn{flex:none;display:flex;flex-direction:column;align-items:center;min-width:44px}
.wpn b{font-size:1.1rem;line-height:1.1}.wpn span{color:var(--muted);font-size:.7rem;font-weight:700}
.wpsum{color:var(--muted);font-size:.82rem;font-weight:700;text-align:center}
.wpsum b{color:var(--ink)}
.wpdays{display:flex;gap:4px}
.wpd{flex:1 1 0;min-width:0;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 2px;font:800 .78rem 'Assistant',sans-serif;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wpd.on{background:var(--flag);border-color:var(--flag);color:#2b1400}
.wpmode{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.wpmode button{flex:1;background:none;border:0;border-radius:999px;color:var(--muted);font:800 .84rem 'Assistant',sans-serif;padding:7px 4px;cursor:pointer}
.wpmode button.on{background:var(--navy);color:var(--surface)}
.wprow.off{opacity:.55}
.wprow:last-child{border-bottom:0;padding-bottom:0}
.wpopen{display:flex;align-items:center;gap:10px;width:100%;margin-top:18px;background:var(--surface);border:1.5px solid var(--navy);border-radius:14px;padding:13px 14px;color:var(--ink);text-align:start;cursor:pointer}
.wpopen .wpot{flex:1;font:800 1rem 'Assistant',sans-serif}
.wpopen small{display:block;color:var(--muted);font-size:.78rem;font-weight:600}
.wpopen .chev{color:var(--navy);font-size:1.4rem;font-weight:800}
.arow.wpme{border-inline-start:3px solid var(--flag)}
.wpday{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-margin-top:8px}
.wpdh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--navy);color:var(--surface);font:800 1.05rem 'Assistant',sans-serif}
.wpdh .wptoday{background:var(--flag);color:#2b1400;border-radius:999px;padding:1px 8px;font-size:.72rem}
.wpdh .wptn{margin-inline-start:auto;font-size:.78rem;font-weight:700;opacity:.85}
.wpt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.88rem}
.wpt col.c1{width:40%}.wpt col.c2{width:17%}.wpt col.c3{width:15%}.wpt col.c4{width:28%}
.wpt th{background:var(--chip);color:var(--muted);font:800 .72rem 'Assistant',sans-serif;padding:6px 8px;text-align:start}
.wpt th.c,.wpt td.c{text-align:center}
.wpt td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:middle}
.wpt tr.wps td{color:var(--flag);font:800 .84rem 'Assistant',sans-serif;padding:10px 8px 4px;border-top:0}
.wpt tr.wps td span{color:var(--muted);font-weight:700;margin-inline-start:6px}
.wpt tr.z td{background:rgba(127,127,127,.07)}
.wpt tr.me td{background:rgba(250,204,21,.14)}
.wpt tr.me td:first-child{box-shadow:inset -3px 0 0 var(--flag)}
.wpt td b{display:block;font-weight:800;line-height:1.25}
.wpt td small{display:block;color:var(--muted);font-weight:700;font-size:.74rem;margin-top:1px}
.wpt td.n{font-weight:800;font-size:1rem}
.wpt td.t{font-size:.8rem;line-height:1.25}
.wpt .no{color:var(--muted);opacity:.65;font-weight:700}
.silbl{font-size:.8rem;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.sislot{display:flex;gap:8px;margin-bottom:10px}
.sislot .on{border-color:var(--flag);box-shadow:inset 0 0 0 1px var(--flag);color:var(--flag)}
.tdatt{flex:none;background:var(--flag);color:#2b1400;border:0;border-radius:12px;font:800 1rem 'Assistant',sans-serif;padding:13px 18px;cursor:pointer}
.hsumc.tap .c{cursor:pointer}
.hcalhint{display:block;width:100%;background:none;border:0;color:var(--navy);font:800 .84rem 'Assistant',sans-serif;padding:4px 0 10px;cursor:pointer}
.hcal{border:1px solid var(--line);border-radius:12px;padding:10px 8px;margin-bottom:10px}
.hcalnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hcalnav b{font-size:1.02rem}
.hcalnav .nav{background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:1.1rem;padding:3px 14px}
.hcaltot{text-align:center;font:700 .84rem 'Assistant',sans-serif;color:var(--muted);margin-bottom:8px}
.hcaltot b{color:var(--ink)}
.hcalmsg{text-align:center;padding:26px 0;color:var(--muted);font-weight:700;font-size:.86rem}
.hcalgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hcw{text-align:center;font:800 .74rem 'Assistant',sans-serif;color:var(--muted);padding-bottom:2px}
.hcd{position:relative;height:54px;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--chip);color:var(--ink);overflow:hidden;padding:0;cursor:pointer}
.hcd .n{position:absolute;top:3px;inset-inline-start:6px;font:700 .74rem 'Assistant',sans-serif;color:var(--muted);z-index:2}
.hcd .fill{position:absolute;left:0;right:0;bottom:0;z-index:0}
.hcd .h{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:800 1.05rem 'Assistant',sans-serif;line-height:1;z-index:2}
.hcd.done{border-color:var(--ok)}
.hcd.done .fill{background:var(--ok);opacity:.5}
.hcd.done .n{color:var(--ink)}
.hcd.plan{border-color:var(--plan)}
.hcd.plan .fill{background:var(--plan);opacity:.5}
.hcd.plan .n{color:var(--ink)}
.hcd.today{box-shadow:inset 0 0 0 2px var(--flag)}
.hcd.today .n{color:var(--flag)}
.hcd.sel{outline:2px solid var(--ink);outline-offset:1px}
.hcd.sat{opacity:.5}
.hclg{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font:700 .74rem 'Assistant',sans-serif;color:var(--muted);margin-top:8px}
.hclg span{display:inline-flex;align-items:center;gap:5px}
.hclg i{display:inline-block;width:12px;height:12px;border-radius:3px}
.hclg i.done{background:var(--ok);opacity:.6}
.hclg i.plan{background:var(--plan);opacity:.7}
.hsumc .c.cd{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--chip))}
.hsumc .c.cp{border-color:var(--plan);background:color-mix(in srgb,var(--plan) 16%,var(--chip))}
.hsumc .c.cd .v{color:var(--ok)} .hsumc .c.cp .v{color:var(--plan)}
.hcd .plus{position:absolute;top:2px;inset-inline-end:5px;font:900 .95rem 'Assistant',sans-serif;line-height:1;color:var(--flag);z-index:2}
/* (טל) סימן החלפה / דחייה על היום ביומן */
.hcd .plus{inset-inline-end:auto;inset-inline-start:22px}
.hcd .ric{position:absolute;top:3px;inset-inline-end:3px;font-size:.62rem;line-height:1;z-index:2;display:flex;gap:1px}
.hcd .ric svg{width:11px;height:11px}
/* (טל) סיכום שעות קטן — שורה אחת */
.hcaltot{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.hcaltot span{border-radius:999px;padding:2px 10px;font-size:.78rem}
.hcaltot .pd{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.hcaltot .pp{background:color-mix(in srgb,var(--plan) 18%,transparent);color:var(--plan)}
.hcaltot span b{color:inherit;font-size:.9rem}
.hcalpick{color:var(--muted);font:700 .8rem 'Assistant',sans-serif;text-align:center;padding:9px 8px;border:1px dashed var(--line);border-radius:10px;margin-bottom:10px}
.hcdt{font-size:1rem}
.dwho{display:flex;flex-direction:column;gap:6px}
.dwh{font:800 .84rem 'Assistant',sans-serif;color:var(--flag)}
.dws{font:800 .8rem 'Assistant',sans-serif;color:var(--muted);margin-top:2px}
/* (טל) טבלת סידור עבודה (כמו "שיבוץ שבועי"): עמודה לכל יום, שורות בוקר / צהריים */
.wgbody{border-top:1px solid var(--line)}
.wgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wgt{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:.84rem}
.wgt th,.wgt td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);vertical-align:top;padding:6px}
.wgt thead th{background:var(--navy);color:var(--surface);font:800 .9rem 'Assistant',sans-serif;padding:7px 6px;text-align:center;white-space:nowrap}
.wgt thead th small{display:block;font-size:.66rem;font-weight:700;opacity:.85}
.wgt thead th.tdy{background:var(--flag);color:#2b1400}
.wgt th.wgrh{position:sticky;right:0;z-index:1;background:var(--surface);color:var(--flag);font:800 .8rem 'Assistant',sans-serif;text-align:center;vertical-align:middle;white-space:normal;border-inline-start:0}
.wgt thead th.wgrh{background:var(--navy)}
.wgt th.wgrh small{display:block;color:var(--muted);font-size:.66rem;font-weight:700}
.wgt td.tdy{background:color-mix(in srgb,var(--flag) 6%,transparent)}
.wgc{border-radius:8px;padding:5px 7px;background:var(--chip);margin-bottom:5px}
.wgc:last-child{margin-bottom:0}
.wgc b{display:block;font-weight:800;line-height:1.2}
.wgc span{display:block;color:var(--muted);font-size:.72rem;font-weight:700;line-height:1.3}
.wgc.me{background:rgba(250,204,21,.16);box-shadow:inset -3px 0 0 var(--flag)}
.wgc b .wpbr{display:inline-block;color:#3a2a00;font-size:.66rem;line-height:1.4;vertical-align:middle}
.wgt .no{color:var(--muted);opacity:.6}
.wglg{color:var(--muted);font-size:.72rem;font-weight:700;text-align:center;padding:6px 10px}
/* (טל) בקשות לאישור אצל רכז — למעלה ובאדום */
.rem.urgent{background:color-mix(in srgb,var(--stop) 14%,var(--surface));border:1.5px solid var(--stop);color:var(--stop);font-weight:800}
/* (טל) כפתורים לקבוצה שנבחרה בסידור העבודה */
.dacts{flex-basis:100%;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;padding-top:6px}

.pickl{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 6px}
.pickl label{position:relative;display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:700 .88rem 'Assistant',sans-serif;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .15s,border-color .15s}

<body>
<div class="wrap">
  <header><div class="lg">⛵</div><div><h1>לוח פעילות</h1><div class="s" id="hsub">מרכז דניאל</div></div></header>
  <div class="bd" id="main" aria-busy="true"><div class="sk"><i class="h"></i><i style="width:78%"></i><i style="width:52%"></i></div><div class="sk"><i class="h"></i><i style="width:78%"></i><i style="width:52%"></i></div><div class="sk"><i class="h"></i><i style="width:78%"></i><i style="width:52%"></i></div><div class="sk"><i class="h"></i><i style="width:78%"></i><i style="width:52%"></i></div></div>
</div>

<div class="gate" id="gate" hidden>
  <div class="box">
    <h2>מה השם המלא שלך?</h2>
    <p>כדי שנראה לך את החניכים של הקבוצה שלך. צריך שם פרטי ושם משפחה.</p>
    <input id="gfirst" placeholder="שם פרטי" autocomplete="given-name">
    <input id="glast" placeholder="שם משפחה" autocomplete="family-name">
    <div class="err" id="gerr"></div>

  </div>
</div>

<div class="ov" id="ov" hidden><div class="box" id="ovbox"></div></div>
<div class="ov" id="hov" hidden><div class="box" id="hovbox"></div></div>
<div class="ov" id="wpov" hidden><div class="box" id="wpbox"></div></div>

<script>
// כתובת המחבר אינה בקוד — היא מגיעה פעם אחת דרך הקישור הפרטי (#api=...) ונשמרת במכשיר.
var API = "";
try{ API = localStorage.getItem("att_api") || ""; }catch(e){}
var MQ = { pend:{}, busy:false, timer:null, fails:0, many:true, shown:false, okT:null };   // תור שמירת נוכחות (ראו queueMark)
(function(){
  var m = /[#&?]api=([^&]+)/.exec(location.hash + "&" + location.search);
  if(m){ API = decodeURIComponent(m[1]); try{ localStorage.setItem("att_api", API); }catch(e){} try{ history.replaceState(null,"",location.pathname); }catch(e){} }
})();
try{ if(/[?&]embed=/.test(location.search)) document.documentElement.classList.add("embed"); }catch(e){}
var HOURS_MODE=false; try{ HOURS_MODE=/[?&]hours=1/.test(location.search); }catch(e){}   // טאב "שעות" נפרד
var BRANCH = "jaffa";
try{ var mb=/[#&?]branch=([^&]+)/.exec(location.search); if(mb) BRANCH=decodeURIComponent(mb[1]); }catch(e){}
var COORDS = ["טל הררי","ירדן סדן","עידו חן"];   // רכזים (שם מלא)
// כינויים: אותו אדם בשמות שונים בגיליונות (ג׳וני = יונתן)
var NAME_ALIAS={"יונתן":"ג׳וני","ג'וני":"ג׳וני","גוני":"ג׳וני"};
function canonWord(w){ return NAME_ALIAS[w]||w; }
function nameWords(s){ return norm(s).split(/\s+/).filter(Boolean).map(canonWord); }
// התאמה מחמירה: כל מילות השם המוקלד נמצאות אצל המדריך, או להפך. דורש שם מלא.
function matchName(instructor, who){
  var iw = nameWords(instructor), ww = nameWords(who);
  if(!iw.length || ww.length < 2) return false;
  if(iw.indexOf(ww[0]) > -1) return true;   // השם הפרטי של המדריך מופיע בשם הקבוצה (גם בשמות מבולגנים)
  var allWin = ww.every(function(w){ return iw.indexOf(w) > -1; });
  var allIin = iw.every(function(w){ return ww.indexOf(w) > -1; });
  return allWin || allIin;
}
function isCoordName(who){
  var ww = nameWords(who); if(ww.length < 2) return false;
  return COORDS.some(function(c){ return nameWords(c).every(function(w){ return ww.indexOf(w) > -1; }); });
}
// שם קבוצה לתצוגה — בלי עוזרי מדריך ובלי "הקבוצה של"
function cleanInst(s){
  var t = norm(String(s||""))
    .replace(/עוזר[ת]?\s*מדריכ[ה]?/g,"")
    .replace(/^\s*עוזר[ת]?\s*/,"")
    .replace(/^הקבוצ[הת]\s*(של\s*)?/,"")
    .replace(/^קבוצה\s*של\s*/,"");
  if(t.indexOf("+")>-1){ var p=t.split("+"); t = norm(p[0]) || norm(p.slice(1).join("+")); }   // עוזר אחרי + — שומר את המדריך הראשי
  var vi=norm(t).search(/\sו/); if(vi>0) t=norm(t).slice(0,vi);   // "רון כפרי וטים" → מוריד עוזר שמחובר ב-ו׳
  t = norm(t) || "קבוצה";
  // שמות תצוגה מועדפים (לא משנה את הטבלה)
  var k = t.replace(/['’`׳"]/g,"");
  if(k==="יונתן גולן" || k==="גוני" || k==="גוני גולן") return "ג׳וני גולן";
  if(k.indexOf("ארז איתן")===0) return "ארז איתן";   // "אייל"/"אליה" הם עוזרים — לא חלק מהשם
  // שמות משפחה (מטל) — השלמה למדריכים שרשומים בשם פרטי בלבד
  var LN = {"מעין":"מעין גלעד","מעיין":"מעין גלעד","גלי":"גלי מלכא","מיה":"מיה סניפר","יסמין":"יסמין קרסנובסקי","איתמר":"איתמר ברייר","גאיה":"גאיה בן סימון","גיאה":"גאיה בן סימון","מירב":"מירב לבנוני","עידו":"עידו חן","עידן":"עידו חן"};
  if(LN[k]) return LN[k];
  return t;
}
var DAYS = {0:"ראשון",1:"שני",2:"שלישי",3:"רביעי",4:"חמישי",5:"שישי",6:"שבת"};
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); };
var norm = function(s){ return String(s==null?"":s).trim().replace(/\s+/g," "); };

var state = { who:"", data:null, day:"", dates:[], di:0, groups:[], gi:0, isCoord:false, reqs:[] };

try{ state.who = localStorage.getItem("who") || localStorage.getItem("att_who") || ""; }catch(e){}

function fmtToday(d){ return d.getDate()+"/"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2); }

function boot(){
  if(!API){ $("main").innerHTML = '<div class="msg">כדי להשתמש במסך הנוכחות צריך לפתוח אותו דרך הקישור שקיבלת מהרכז.</div>'; return; }
  if(!state.who || nameWords(state.who).length < 2){ openGate(); return; }   // שם מלא חובה
  try{ if(!stTok_() && localStorage.getItem("att_open")==="0"){ needCode_({ok:false, error:"auth"}); return; } }catch(e){}   // אין קוד — לא מציגים כלום (גם לא מהמטמון)
  if(HOURS_MODE){ startHoursOnly(); return; }
  load();
}
function startHoursOnly(){
  state.isCoord = isCoordName(state.who);
  if(!hoursOK()){ $("main").innerHTML = '<div class="msg">אין לך הרשאה למסך השעות.</div>'; return; }
  // מסך משולב: השעות למעלה + הקבוצות עם נוכחות / החלפה / דחייה (פירוט השעות נפתח מעליו)
  state.view = "home";
  load();
}
function openGate(){ $("gate").hidden=false; var p=nameWords(state.who||""); $("gfirst").value=p[0]||""; $("glast").value=p.slice(1).join(" "); setTimeout(function(){$("gfirst").focus();},100); }
$("gsave").addEventListener("click", saveName);
["gfirst","glast"].forEach(function(id){ $(id).addEventListener("keydown", function(e){ if(e.key==="Enter") saveName(); }); });
function saveName(){
  var f = norm($("gfirst").value), l = norm($("glast").value);
  if(!f || !l){ $("gerr").textContent = "צריך שם פרטי וגם שם משפחה"; return; }
  var v = f + " " + l;
  state.who = v; try{ localStorage.setItem("who", v); localStorage.setItem("att_who", v); }catch(e){}
  $("gate").hidden = true; if(HOURS_MODE) startHoursOnly(); else load();
}

// (רון) קוד מדריכים: כל בקשה נשלחת עם הטוקן. "auth" מהשרת = הקוד הוחלף / לא הוזן → מוחקים את המידע השמור ומבקשים קוד
function stTok_(){ try{ return localStorage.getItem("att_tok")||""; }catch(e){ return ""; } }
function needCode_(j){
  if(!(j && j.ok===false && j.error==="auth")) return j;
  try{ ["att_tok","att_ok","att_cache","att_hcache","att_roster"].forEach(function(k){ localStorage.removeItem(k); }); localStorage.setItem("att_open","0"); }catch(e){}
  var emb = window.parent!==window;
  try{ if(emb) window.parent.postMessage({type:"needCode"}, location.origin); }catch(e){}
  setTimeout(function(){ $("main").innerHTML = '<div class="msg">צריך להזין את קוד המדריכים'+(emb?'.':' — נכנסים דרך האפליקציה.')+'</div>'; }, 0);
  return j;
}
function api(params){
  var p = {}; Object.keys(params).forEach(function(k){ p[k]=params[k]; }); var t=stTok_(); if(t) p.tok=t;
  var u = API + "?" + Object.keys(p).map(function(k){ return k+"="+encodeURIComponent(p[k]); }).join("&");
  return fetch(u).then(function(r){ return r.json(); }).then(needCode_);
}
// השרת מטפל בבקשה אחת בכל פעם (נעילה). אם היה עסוק — שום דבר לא נכתב, אז בטוח לשלוח שוב לבד.
// ניתוק רשת: שולחים שוב רק פעולות שאפשר לחזור עליהן בלי כפילות (קביעת ערך, לא הוספת שורה).
var POST_IDEM = {mark:1, markMany:1, hoursSet:1, schedSet:1, schedSetBulk:1, schedFill:1};
function sleep_(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function srvBusy_(j){ return !!(j && !j.ok && /lock|נעיל|too many|simultaneous|בו-זמני/i.test(String(j.error||""))); }
function post(body, n){
  n = n||0;
  var t=stTok_(); if(t) body.tok=t;
  return fetch(API, {method:"POST", body:JSON.stringify(body)}).then(function(r){ return r.json(); }).then(function(j){
    needCode_(j);
    if(srvBusy_(j) && n<3) return sleep_(1200*(n+1)).then(function(){ return post(body, n+1); });
    return j;
  }, function(err){
    if(POST_IDEM[body.action] && n<2) return sleep_(1500*(n+1)).then(function(){ return post(body, n+1); });
    throw err;
  });
}

// (רון) הודעה קופצת למטה שנעלמת לבד (במקום טקסט ירוק / חלון alert), עם רטט קל בטלפון
function toast(msg, kind){
  kind = kind || (/✓|נשמר|נוסף|נשלח|אושר|שויך/.test(msg) ? "ok" : "bad");
  var t=$("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); t.setAttribute("aria-live","polite"); document.body.appendChild(t); }
  t.textContent=msg; t.className="toast "+kind; void t.offsetWidth; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("on"); }, kind==="bad" ? 5000 : 3000);
  buzz(kind==="bad" ? [30,60,30] : 15);
}
function buzz(p){ try{ var ua=navigator.userActivation; if(navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(p); }catch(e){} }   // רק אחרי שנגעו במסך (אחרת הדפדפן חוסם)
// כרטיסים אפורים בזמן טעינה (במקום "טוען…")
function skel(n){ var h=''; for(var i=0;i<n;i++) h+='<div class="sk"><i class="h"></i><i style="width:'+[78,64,70][i%3]+'%"></i><i style="width:'+[52,58,40][i%3]+'%"></i></div>'; return h; }
function load(){
  // מציג מיד את הנתונים האחרונים מהמטמון (טעינה מיידית), ומרענן ברקע מול הגיליון
  var cached=null;
  try{ var c=JSON.parse(localStorage.getItem("att_cache")||"null"); if(c&&c.groups&&c.groups.length) cached=c.groups; }catch(e){}
  state.touched = false;
  if(cached){ state.all=cached; mqReapply(); render(); }
  else $("main").innerHTML = skel(4);
  api({action:"rosterAll"}).then(function(j){
    if(!j.ok){ if(!cached) $("main").innerHTML = '<div class="msg">שגיאה: '+esc(j.error||"")+'</div>'; return; }
    try{ localStorage.setItem("att_cache", JSON.stringify({t:Date.now(), groups:j.groups||[]})); }catch(e){}
    if(cached && state.touched) return;   // המשתמש כבר סימן — לא לדרוס את המסך הפעיל
    state.all = j.groups || [];
    mqReapply();
    render();
  }).catch(function(){ if(!cached) $("main").innerHTML = '<div class="msg">אין חיבור. נסו שוב.</div>'; });
  if(hoursOK()) loadReqs();   // צבעי החלפות בלוח — רק למי שמסך השעות פתוח לו
}
function loadReqs(){
  api({action:"subReqList", pending:1}).then(function(q){
    state.reqs=(q&&q.rows)?q.rows:[];
    renderSubUI();
    // לרענן צבעים/סטטוסים — אבל לא באמצע טופס החלפה/דחייה פתוח
    if(state.groups && state.groups.length && ($("stlist") || (HOURS_MODE && state.view!=="att" && !($("subpanel") && $("subpanel").innerHTML)))) render();
  }).catch(function(){});
}
// אחרי שליחה/אישור של החלפה או דחייה: סוגר את הטופס, מציג הודעה ומרענן
function afterSub(msg){
  if($("subpanel")) $("subpanel").innerHTML="";
  if(msg){ state.homeMsg=msg; state.homeMsgT=Date.now()+7000; }
  if(HOURS_MODE && state.view!=="att") render();   // ההודעה מופיעה מיד; הסטטוסים מתעדכנים כשהבקשות נטענות
  else if(state.waOffer) render();
  var wo=$("waoffer"); if(wo) wo.scrollIntoView({behavior:"smooth",block:"center"});   // (רון) כרטיס "שלח בוואטסאפ"
  loadReqs();
}
// (טל) נוכחות נפתחת על הפעילות של היום; אם אין היום — על האחרונה שהייתה; אם עוד לא הייתה — על הקרובה
function pickAttDate(dates){
  var today=-1, past=-1, pastAgo=1e9;
  dates.forEach(function(ds,i){ var a=daysAgo_(ds); if(a===0) today=i; else if(a>0 && a<pastAgo){ pastAgo=a; past=i; } });
  return today>-1 ? today : past>-1 ? past : nearestDate(dates);
}
// ----- מסך משולב (טאב "שעות"): השעות שלי + הקבוצות, מסודרות לפי ימים -----
var DORD = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
function nextDateOf(g){
  var t=new Date(), best=null; t.setHours(0,0,0,0);
  (g.dateCols||[]).forEach(function(d){ var dt=toDate_(d.date); if(dt>=t && (!best || dt<best.dt)) best={date:d.date, dt:dt}; });
  return best;
}
function homeRow(g, k, full){
  var gi=giOf(g), t=groupSlot(g), nd=nextDateOf(g), isToday=nd && daysAgo_(nd.date)===0;
  var miss=unfilledRecent(g).length, cs=groupSubStatus(g), bds=groupBdays(g);
  var sub=[BRN[g.branch]||g.branch]; if(t) sub.push("\u2066"+t.start+"–"+t.end+"\u2069");   // ⁦…⁩ = שעות משמאל לימין גם בתוך עברית
  if(nd && !isToday) sub.push("הבא: "+nd.date.replace(/\/\d+$/,""));
  return '<div class="arow"><div class="nm"><b>'+esc(cleanInst(g.instructor))+
      (!full&&state.isCoord&&gi>-1?'<button class="pen" data-cinst="'+gi+'" title="מי המדריך של הקבוצה?">✏️ מדריך</button>':'')+
      (miss?'<span class="tchip miss">⏰ לא מולא</span>':'')+
      (cs?'<span class="scchip sc-'+cs+'">'+esc(SUBLBL[cs])+'</span>'+(function(){ var nx=nextReqOf_(g); return nx ? undoBtn_(nx).replace('data-undo=', 'title="'+esc(nx.date.replace(/\/\d+$/,''))+'" data-undo=') : ''; })():'')+'</b><span>'+esc(sub.join(" · "))+'</span>'+
      '<span class="hinfo">'+esc(groupInfoLine(g))+'</span>'+
      (bds.length?'<span class="bdline">🎂 '+bds.map(function(x){ return esc(norm(x.name).split(" ")[0])+(x.b.age?' ('+x.b.age+')':'')+' '+esc(bdayWhen(x.b)); }).join(' · ')+'</span>':'')+'</div>'+
    '<div class="abtns"><button class="ab att" data-hatt="'+gi+'">📋 נוכחות</button>'+
      // (טל) הכפתורים לא ננעלים אחרי בקשה — התאריך שכבר יש לו בקשה פשוט לא ניתן לבחירה בטופס. רכז רואה אותם גם בקבוצות של אחרים.
      (full?'<button class="ab sub" data-hsub="'+k+'">🔄 החלפה</button><button class="ab post" data-hpost="'+k+'">📅 דחייה</button>'
           :state.isCoord&&gi>-1?'<button class="ab sub" data-csub="'+gi+'">🔄 החלפה</button><button class="ab post" data-cpost="'+gi+'">📅 דחייה</button>':'')+
    '</div></div>';
}
// (רכז) "היום במועדון": כל הקבוצות של היום - נוכחות מולאה? יש החלפה/דחייה? בלי פעילות היום - היום הקרוב שיש בו
function clubToday(groups, todayName){
  var day=todayName, list=groups.filter(function(g){ return g.day===day; }), label="📍 היום במועדון · "+day;
  if(!list.length){
    var i0=DORD.indexOf(todayName);
    for(var k=1;k<7 && !list.length;k++){ day=DORD[(i0+k)%7]; list=groups.filter(function(g){ return g.day===day; }); }
    if(!list.length) return '';
    label="📍 היום אין פעילות · הקרוב: יום "+day;
  }
  var isToday = day===todayName;
  var dateOf=function(g){ var nd=nextDateOf(g); return nd?nd.date:""; };
  var done=0, rows=list.slice().sort(function(a,b){ return (a.branch==="jaffa"?0:1)-(b.branch==="jaffa"?0:1); }).map(function(g){
    var t=groupSlot(g), d=isToday?todayDmy():dateOf(g), act=subAct(g);
    var marked=d ? g.students.filter(function(s){ return s.attendance[d]; }).length : 0, tot=g.students.length;
    var rq=(state.reqs||[]).filter(function(r){ return r.act===act && r.date===d && /^(ממתין|פתוח|אושר|הושלם|ביטול ממתין|בוטל)$/.test(r.status); })[0];
    var chips='';
    if(rq) chips+= reqChip_(rq, true);
    if(isToday && !(rq&&rq.status==="בוטל")){ if(marked){ done++; chips+='<span class="cchip ok">✓ נוכחות '+marked+'/'+tot+'</span>'; } else chips+='<span class="cchip warn">⏰ נוכחות לא מולאה</span>'; }

  var out={};
  (state.reqs||[]).forEach(function(r){
    if(!/^(ממתין|פתוח|אושר|הושלם|ביטול ממתין|בוטל)$/.test(r.status)) return;
    if(!(all && state.isCoord) && !matchName(r.requester||"", state.who) && !(r.chosen && matchName(r.chosen, state.who))) return;
    var o=out[r.date]=out[r.date]||{};
    if(/^(ביטול ממתין|בוטל)$/.test(r.status)) o.post=1; else o.sub=1;
  });
  return out;
}
// (טל) "✕ בטל" על כל החלפה / דחייה — לרכז, ולמדריך שביקש. השרת מחזיר את השעות (subReqUndo)
function canUndo_(rq){ return !!rq && /^(ממתין|פתוח|אושר|הושלם|ביטול ממתין|בוטל)$/.test(rq.status) && (state.isCoord || matchName(rq.requester||"", state.who)); }
function undoBtn_(rq){ return canUndo_(rq) ? '<button class="undobtn sm" data-undo="'+esc(rq.id)+'">✕ בטל</button>' : ''; }
function reqChip_(rq, undo){
  return reqChip0_(rq)+(undo ? undoBtn_(rq) : '');
}
function reqChip0_(rq){
  var why=rq.reason ? ' · '+rq.reason : '';
  return rq.status==="הושלם" ? '<span class="cchip ok">🔄 '+esc(cleanInst(rq.chosen||""))+' מחליף</span>'
       : rq.status==="בוטל" ? '<span class="cchip bad">📅 נדחתה'+esc(why)+'</span>'
       : rq.status==="ביטול ממתין" ? '<span class="cchip warn">📅 בקשת דחייה'+esc(why)+'</span>'
       : rq.status==="אושר" ? '<span class="cchip ok">🔄 החלפה אושרה'+(rq.chosen?' · '+esc(cleanInst(rq.chosen)):'')+'</span>'
       : '<span class="cchip warn">🔄 מחכה למחליף</span>';
}
// (טל) רכז: לחיצה על יום ביומן → מי עובד ביום הזה (כמו בסידור העבודה), עם נוכחות / החלפה / דחייה / ✏️
function calWhoHTML_(ds){
  var dt=toDate_(ds), dn=DAYS[dt.getDay()], today0=new Date(); today0.setHours(0,0,0,0);
  var list=(state.groups||[]).filter(function(g){ return g.day===dn; });
  var H='<div class="dwho"><div class="dwh">מי עובד ביום הזה'+(list.length?' · '+list.length+' קבוצות':'')+'</div>';
  var oth=calOtherReqs_(ds, list);   // (טל) החלפה / דחייה ביום הזה שלא שייכת לאף קבוצה (למשל "ריכוז") — כדי שהסימן ביומן לא יהיה "ריק"
  if(!list.length) return H+'<div style="color:var(--muted)">אין קבוצות ביום '+esc(dn)+'</div>'+oth+'</div>';
  [["am","☀️ בוקר"],["pm","🌤 צהריים"],["","❓ עוד לא נקבע מתי"]].forEach(function(s){
    var rows=list.filter(function(g){ return slotKind(groupSlot(g))===s[0]; }).sort(function(a,b){ return slotMin(a)-slotMin(b) || (a.branch==="jaffa"?1:0)-(b.branch==="jaffa"?1:0) || cleanInst(a.instructor).localeCompare(cleanInst(b.instructor),"he"); });
    if(!rows.length) return;
    H+='<div class="dws">'+s[1]+'</div><div class="abox">'+rows.map(function(g){ return calDayRow_(g, ds, dt<=today0, state.isCoord || dt>=today0); }).join('')+'</div>';
  });
  return H+oth+'</div>';
}
function calOtherReqs_(ds, list){
  var acts=list.map(subAct), all=!!state.isCoord;
  var rs=(state.reqs||[]).filter(function(r){ return r.date===ds && acts.indexOf(r.act)<0 && /^(ממתין|פתוח|אושר|הושלם|ביטול ממתין|בוטל)$/.test(r.status) &&
    (all || matchName(r.requester||"", state.who) || (r.chosen && matchName(r.chosen, state.who))); });
  if(!rs.length) return '';
  return '<div class="dws">🔄 עוד החלפות / דחיות ביום הזה</div><div class="abox">'+rs.map(function(r){
    var who=cleanInst(r.requester||"")+(r.chosen?' ← '+cleanInst(r.chosen):'');
    return '<div class="arow"><div class="nm"><b>'+esc(norm(r.act)||"פעילות")+'</b><span>'+esc(who)+(r.start&&r.end?' · ⁦'+esc(toHHMM(r.start))+'–'+esc(toHHMM(r.end))+'⁩':'')+'</span>'+
      '<div class="cchips">'+reqChip_(r, true)+'</div></div></div>';
  }).join('')+'</div>';
}
function calDayRow_(g, ds, past, canReq){
  var gi=giOf(g), t=groupSlot(g), act=subAct(g), nm=instLabel(g);
  var rq=(state.reqs||[]).filter(function(r){ return r.act===act && r.date===ds && /^(ממתין|פתוח|אושר|הושלם|ביטול ממתין|בוטל)$/.test(r.status); })[0];
  var hasDate=(g.dateCols||[]).some(function(d){ return d.date===ds; });
  var marked=hasDate ? g.students.filter(function(s){ return s.attendance && s.attendance[ds]; }).length : 0;
  var chips=rq ? reqChip_(rq, true) : '';
  if(past && hasDate && !(rq&&rq.status==="בוטל")) chips += marked ? '<span class="cchip ok">✓ נוכחות '+marked+'/'+g.students.length+'</span>' : '<span class="cchip warn">⏰ נוכחות לא מולאה</span>';
  var sub=[]; if(t) sub.push("⁦"+t.start+"–"+t.end+"⁩"); sub.push(groupInfoLine(g));
  return '<div class="arow"><div class="nm"><b>'+(nm==="קבוצה"?'❓ בלי מדריך':esc(nm))+(g.branch==="jaffa"?' <span class="wpbr">יפו</span>':'')+
      (gi>-1?'<button class="pen" data-dinst="'+gi+'" title="פרטי הקבוצה">✏️ מדריך</button>':'')+'</b>'+
      '<span>'+esc(sub.join(" · "))+'</span>'+(chips?'<div class="cchips">'+chips+'</div>':'')+'</div>'+
    '<div class="abtns">'+(gi>-1?'<button class="ab att" data-datt="'+gi+'">📋 נוכחות</button>':'')+
      (canReq&&gi>-1?'<button class="ab sub" data-dsub="'+gi+'">🔄 החלפה</button><button class="ab post" data-dpost="'+gi+'">📅 דחייה</button>':'')+'</div></div>';
}
// טופס החלפה/דחייה/✏️ נפתח מתחת לשורה ביומן; כשהיומן מצטייר מחדש — הטופס חוזר למקומו (ריק) כדי שלא יימחק
function rescueSub_(container){ var sp=$("subpanel"); if(sp && container && container.contains(sp)){ sp.innerHTML=""; var su=$("subui"); if(su && su.parentNode) su.parentNode.insertBefore(sp, su.nextSibling); } }
function subUnder_(b){ var sp=$("subpanel"), row=b.closest(".arow"); if(sp && row) row.parentNode.insertBefore(sp, row.nextSibling); return sp; }
function openAttOn_(gi, ds){
  var g=state.groups[gi]; if(!g) return;
  var i=(g.dateCols||[]).map(function(d){ return d.date; }).indexOf(ds);
  state.gi=gi; if(i>-1){ state.di=i; state.diFor=gi; } else state.diFor=-1;
  state.view="att"; render(); window.scrollTo(0,0);
}
function openReqOn_(kind, gi, ds, b, mine){
  var g=state.groups[gi]; if(!g || !subUnder_(b)) return;
  state.reqWantDs=ds;   // (טל) רכז יכול גם על תאריך שעבר — הטופס יכלול אותו
  if(kind==="sub") attReqOpen(g, !mine); else attPostOpen(g, !mine);   // mine = הקבוצה שלי (מ"השעות שלי") — בלי "של מי הקבוצה"
  var s=$("ar_date"); if(!s) return;
  var o=[].filter.call(s.options, function(x){ return x.value===ds && !x.disabled; })[0];
  if(o){ s.value=ds; if(kind==="sub") arRefresh(g, !mine); }
}
function calBind_(el, mk, by){
  $("hc_prev").onclick=function(){ calGo_(-1); };
  $("hc_next").onclick=function(){ calGo_(1); };
  if($("hc_retry")) $("hc_retry").onclick=function(){ delete hstate.calRows[mk]; renderHoursCal(); };
  el.querySelectorAll("[data-cd]").forEach(function(b){ b.onclick=function(){
    hstate.calSel = hstate.calSel===b.dataset.cd ? "" : b.dataset.cd; renderHoursCal();
    var d=el.querySelector(".hcalR .hcdet"); if(d && window.innerWidth<900) d.scrollIntoView({behavior:"smooth",block:"nearest"});
  }; });
  if($("hc_add")) $("hc_add").onclick=function(){ calAddFor_(hstate.calSel, null); };
  el.querySelectorAll("[data-ce]").forEach(function(b){ b.onclick=function(){ calAddFor_(hstate.calSel, (by[hstate.calSel]||[])[+b.dataset.ce]); }; });
  el.querySelectorAll("[data-datt]").forEach(function(b){ b.onclick=function(){ openAttOn_(+b.dataset.datt, hstate.calSel); }; });
  el.querySelectorAll("[data-dsub]").forEach(function(b){ b.onclick=function(){ openReqOn_("sub", +b.dataset.dsub, hstate.calSel, b); }; });
  el.querySelectorAll("[data-dpost]").forEach(function(b){ b.onclick=function(){ openReqOn_("post", +b.dataset.dpost, hstate.calSel, b); }; });
  el.querySelectorAll("[data-msub]").forEach(function(b){ b.onclick=function(){ openReqOn_("sub", +b.dataset.msub, hstate.calSel, b, true); }; });
  el.querySelectorAll("[data-mpost]").forEach(function(b){ b.onclick=function(){ openReqOn_("post", +b.dataset.mpost, hstate.calSel, b, true); }; });
  el.querySelectorAll("[data-dinst]").forEach(function(b){ b.onclick=function(){ if(subUnder_(b)) setInstOpen(state.groups[+b.dataset.dinst]); }; });
}
// פותח את טופס "הוסף עבודה" על היום שנבחר ביומן (ואם כבר רשום — ממלא את מה שרשום, לשינוי)
function calAddFor_(ds, r){
  var a={date:ds, act:"", start:"", end:"", slot:"", pickDate:(ds!==todayDmy() && ds!==dmyShift(-1))};
  if(r){
    a.orig={act:r.act, start:r.start};   // עורכים את העבודה הזו בדיוק (יכולות להיות כמה ביום)
    a.act=norm(r.act); a.start=toHHMM(r.start); a.end=toHHMM(r.end);
    a.slot = (a.start===SLOT_AM.start&&a.end===SLOT_AM.end)?"am":(a.start===SLOT_PM.start&&a.end===SLOT_PM.end)?"pm":(a.start&&a.end?"other":"");
    var known=schedListFor(ds).map(function(x){ return norm(x.act); }).concat(HACTS.map(function(x){ return norm(hActLabel(x)); }));
    if(a.act && known.indexOf(a.act)<0) a.otherAct=true;
  }
  hstate.add=a; renderHomeHours(); $("hh_form").scrollIntoView({behavior:"smooth",block:"start"});
}
// ----- "➕ הוסף עבודה" (רון): טופס פשוט בשלושה שלבים, בתוך הכרטיס — בלי לקפוץ לחלון אחר -----
function dmyShift(n){ var d=new Date(); d.setDate(d.getDate()+n); return d.getDate()+"/"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2); }
var HDAY=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
function renderAddForm(){
  var el=$("hh_form"), a=hstate.add; if(!el||!a) return;
  var today=todayDmy(), yest=dmyShift(-1);
  if(a.pickDate===undefined) a.pickDate=false;
  var scs = a.date ? schedListFor(a.date) : [];
  var acts = scs.filter(function(x){ return x.act; }).map(function(x){ return {v:x.act, l:"📅 "+x.act}; }).concat(HACTS.map(function(x){ return {v:hActLabel(x), l:x}; }));
  var chip=function(on, attr, label){ return '<button type="button" class="hchip'+(on?' on':'')+'" '+attr+'>'+label+'</button>'; };
  var H='<div class="addf"><div class="addh"><b>'+(a.orig?'✏️ שינוי עבודה':'➕ הוספת עבודה')+'</b><button class="linkbtn" id="af_x">ביטול</button></div>';
  H+='<div class="addstep">1. מתי?</div><div class="hchips">'+
     chip(!a.pickDate && a.date===today, 'data-ad="'+today+'"', 'היום')+
     chip(!a.pickDate && a.date===yest, 'data-ad="'+yest+'"', 'אתמול')+
     chip(a.pickDate, 'data-ad="pick"', '📅 תאריך אחר')+'</div>';
  if(a.pickDate) H+='<input id="af_date" class="asin" type="date" value="'+isoOf(a.date)+'">';
  H+='<div class="addstep">2. מה עשית?</div><div class="hchips">'+
     acts.map(function(x){ return chip(!a.otherAct && norm(a.act)===norm(x.v), 'data-aa="'+esc(x.v)+'"', esc(x.l)); }).join('')+
     chip(a.otherAct, 'data-aa="__other"', '✏️ משהו אחר')+'</div>';
  if(a.otherAct) H+='<input id="af_act" class="asin" placeholder="כתבו מה עשית" value="'+esc(a.act||"")+'">';
  H+='<div class="addstep">3. באילו שעות?</div><div class="hchips">'+
     chip(a.slot==="am", 'data-as="am"', '☀️ בוקר <span dir="ltr">10–14</span>')+
     chip(a.slot==="pm", 'data-as="pm"', '🌤 צהריים <span dir="ltr">14–18</span>')+
     chip(a.slot==="other", 'data-as="other"', '⏱ שעות אחרות')+'</div>';
  if(a.slot==="other") H+='<div class="addtimes"><span>מ־</span><input id="af_s" class="asin" type="time" step="300" value="'+esc(a.start||"")+'"><span>עד</span><input id="af_e" class="asin" type="time" step="300" value="'+esc(a.end||"")+'"></div>';
  H+='<div id="af_bottom"></div></div>';
  el.innerHTML=H;
  $("af_x").onclick=function(){ hstate.add=null; renderHomeHours(); };
  el.querySelectorAll("[data-ad]").forEach(function(b){ b.onclick=function(){
    if(b.dataset.ad==="pick"){ a.pickDate=true; } else { a.pickDate=false; a.date=b.dataset.ad; }
    renderAddForm(); if(a.pickDate && $("af_date")) $("af_date").focus();
  }; });
  if($("af_date")) $("af_date").onchange=function(){ a.date=dmyOf(this.value); renderAddForm(); };
  el.querySelectorAll("[data-aa]").forEach(function(b){ b.onclick=function(){
    if(b.dataset.aa==="__other"){ a.otherAct=true; a.act=""; renderAddForm(); $("af_act").focus(); return; }
    a.otherAct=false; a.act=b.dataset.aa;
    var sc=scs.filter(function(x){ return norm(x.act)===norm(b.dataset.aa); })[0];
    if(sc && !a.slot){   // פעילות קבועה של היום → גם השעות שלה
      var s0=toHHMM(sc.start), e0=toHHMM(sc.end);
      a.start=s0; a.end=e0; a.slot = (s0===SLOT_AM.start&&e0===SLOT_AM.end)?"am":(s0===SLOT_PM.start&&e0===SLOT_PM.end)?"pm":"other";
    }
    renderAddForm();
  }; });
  if($("af_act")) $("af_act").oninput=function(){ a.act=this.value; renderAddBottom(); };
  el.querySelectorAll("[data-as]").forEach(function(b){ b.onclick=function(){
    a.slot=b.dataset.as;
    if(a.slot==="am"){ a.start=SLOT_AM.start; a.end=SLOT_AM.end; }
    else if(a.slot==="pm"){ a.start=SLOT_PM.start; a.end=SLOT_PM.end; }
    renderAddForm(); if(a.slot==="other" && !a.start && $("af_s")) $("af_s").focus();
  }; });
  if($("af_s")) $("af_s").oninput=function(){ a.start=this.value; renderAddBottom(); };
  if($("af_e")) $("af_e").oninput=function(){ a.end=this.value; renderAddBottom(); };
  renderAddBottom();
}
// שורת סיכום + כפתור שמירה (מתעדכנים בלי לבנות מחדש את השדות — כדי לא לאבד פוקוס בהקלדה)
function renderAddBottom(){
  var el=$("af_bottom"), a=hstate.add; if(!el||!a) return;
  var tot=calcTotal(a.start, a.end);
  var miss = !a.date ? "בחרו מתי" : !norm(a.act) ? "בחרו מה עשית" : !tot ? "בחרו שעות" : "";
  var me=norm(state.who), others = a.date ? (hstate.rows||[]).filter(function(r){ return norm(r.inst)===me && r.date===a.date && !(a.orig && sameJob_(r, a.orig.act, a.orig.start)); }) : [];
  var dup = !a.orig && others.filter(function(r){ return sameJob_(r, a.act, a.start); })[0];
  var H='';
  if(!miss) H+='<div class="addsum">יום '+esc(HDAY[toDate_(a.date).getDay()])+' '+esc(a.date)+' · '+esc(norm(a.act))+' · <span dir="ltr" style="white-space:nowrap">'+esc(a.start)+'–'+esc(a.end)+'</span> ('+tot+' שע׳)</div>';
  if(dup) H+='<div class="addwarn">⚠️ העבודה הזו כבר רשומה לך ב־'+esc(a.date)+'. שמירה תעדכן אותה.</div>';
  else if(others.length) H+='<div class="addinfo">כבר רשום לך ביום הזה: '+others.map(function(r){ return esc(norm(r.act))+(r.total?' ('+esc(r.total)+' שע׳)':''); }).join(', ')+(a.orig?'':' — זו תתווסף כעבודה נוספת')+'.</div>';
  H+='<div id="af_err" class="adderr"></div>';
  H+='<button id="af_save" class="addsave"'+(miss?' disabled':'')+'>'+(miss?esc(miss):'שמור')+'</button>';
  if(a.orig) H+='<button id="af_del" class="linkbtn" style="color:var(--stop);align-self:center;padding:6px">🗑 מחק את העבודה הזו</button>';
  el.innerHTML=H;
  $("af_save").onclick=saveAdd;
  if($("af_del")) $("af_del").onclick=delAdd;
}
function saveAdd(){
  var a=hstate.add; if(!a) return;
  var tot=calcTotal(a.start, a.end), act=norm(a.act), btn=$("af_save");
  btn.disabled=true; btn.textContent="שומר…";
  var body={action:"hoursSet", month:monthOf(a.date), inst:norm(state.who), date:a.date, act:act, start:a.start, end:a.end, total:tot};
  if(a.orig) body.orig=a.orig; else body.add=1;   // כמה עבודות ביום: עריכה של עבודה מסוימת / הוספת עבודה נוספת
  post(body).then(function(j){
    if(j&&j.ok){
      var me=norm(state.who);
      if(monthOf(a.date)===hstate.month){   // מעדכן את הכרטיס מיד (והרענון מהשרת מגיע ברקע)
        hstate.rows=(hstate.rows||[]).filter(function(r){ return !(norm(r.inst)===me && r.date===a.date && (a.orig ? sameJob_(r, a.orig.act, a.orig.start) : sameJob_(r, act, a.start))); });
        hstate.rows.push({inst:me, date:a.date, act:act, start:a.start, end:a.end, total:tot});
      }
      if(hstate.calRows) delete hstate.calRows[monthOf(a.date)];   // היומן ייטען מחדש לחודש הזה
      if(hstate.cal){ hstate.calMonth=monthOf(a.date); hstate.calSel=a.date; }
      hstate.add=null; hstate.addMsg="✓ נשמר: "+a.date+" · "+act+" · "+tot+" שע׳"; hstate.addMsgT=Date.now()+6000;
      renderHomeHours(); state.hh=0; loadHomeHours();
    } else { btn.disabled=false; btn.textContent="שמור"; $("af_err").textContent="לא נשמר: "+((j&&j.error)||"נסו שוב"); }
  }).catch(function(){ btn.disabled=false; btn.textContent="שמור"; $("af_err").textContent="אין חיבור — נסו שוב"; });
}
function delAdd(){
  var a=hstate.add; if(!a||!a.orig) return;
  if(!confirm("למחוק את העבודה \""+norm(a.orig.act)+"\" ב־"+a.date+"?")) return;
  var btn=$("af_del"); btn.disabled=true; btn.textContent="מוחק…";
  post({action:"hoursSet", month:monthOf(a.date), inst:norm(state.who), date:a.date, orig:a.orig}).then(function(j){
    if(j&&j.ok){
      var me=norm(state.who);
      if(monthOf(a.date)===hstate.month) hstate.rows=(hstate.rows||[]).filter(function(r){ return !(norm(r.inst)===me && r.date===a.date && sameJob_(r, a.orig.act, a.orig.start)); });
      if(hstate.calRows) delete hstate.calRows[monthOf(a.date)];
      hstate.add=null; hstate.addMsg="🗑 נמחק: "+a.date+" · "+norm(a.orig.act); hstate.addMsgT=Date.now()+6000;
      renderHomeHours(); state.hh=0; loadHomeHours();
    } else { btn.disabled=false; btn.textContent="🗑 מחק את העבודה הזו"; $("af_err").textContent="לא נמחק: "+((j&&j.error)||"נסו שוב"); }
  }).catch(function(){ btn.disabled=false; btn.textContent="🗑 מחק את העבודה הזו"; $("af_err").textContent="אין חיבור — נסו שוב"; });
}
// מרענן את השעות במקום שפתוח עכשיו: הפירוט (אם פתוח) או הכרטיס במסך המשולב
function hoursReload(){ if(!$("hov").hidden) loadHours(); else { state.hh=0; loadHomeHours(); } }

function myGroups(){
  // כל הקבוצות משני הסניפים, מסוננות למדריך לפי שם מלא (אלא אם רכז רואה הכול)
  state.isCoord = isCoordName(state.who);
  var all = state.all || [];
  if(state.isCoord) return all.slice();
  var own=all.filter(function(g){ return matchName(g.instructor, state.who) || matchName(cleanInst(g.instructor), state.who); });
  return own.concat(subTodayGroups().filter(function(g){ return own.indexOf(g)<0; }));   // + קבוצה שאני מחליף בה היום
}

  // תזכורת: פעילויות שהתקיימו בשבועיים האחרונים ולא מולאו כלל
  var unfilled = unfilledRecent(cur);
  if(unfilled.length){
    h += '<div class="rem tap" id="rembanner">⏰ '+(unfilled.length===1
      ? 'פעילות '+esc(unfilled[0])+' התקיימה ועדיין לא מולאה'
      : unfilled.length+' פעילויות מהשבועיים האחרונים לא מולאו')+' — לחצו למעבר</div>';
  }
  // בוחר קבוצה (לרכזים / כמה קבוצות) — בלוח הרגיל בלבד; במסך המשולב חוזרים לרשימה
  if(!HOURS_MODE && groups.length > 1){
    var DORDER = ["ראשון","שני","שלישי","רביעי","חמישי","שישי"];
    var BR = { jaffa:"יפו", ta:"תל אביב" };
    var order = groups.map(function(g,i){ return i; }).sort(function(a,b){
      var ga=groups[a], gb=groups[b];

      var d=DORDER.indexOf(ga.day)-DORDER.indexOf(gb.day); if(d) return d;
      return norm(ga.instructor).localeCompare(norm(gb.instructor),"he");
    });
    if(state.isCoord){
      // אקורדיון: ענף → יום (נפתח בלחיצה) → קבוצות
      var tree={}, brOrder=[];
      order.forEach(function(i){ var g=groups[i], br=BR[g.branch]||g.branch;
        if(!tree[br]){ tree[br]={}; brOrder.push(br); }
        (tree[br][g.day]=tree[br][g.day]||[]).push(i);
      });
      var curG=groups[state.gi]||groups[order[0]];

  if(state.isCoord) h += '<div style="margin:0 2px 10px"><button id="assignbtn" class="ghostbtn">🔗 שייך שעות קבועות למדריך</button></div><div id="asgpanel"></div>';

  }

  $("main").innerHTML = h;

  if($("backhome")) $("backhome").onclick = function(){ state.view="home"; render(); window.scrollTo(0,0); };

  if($("assignbtn")) $("assignbtn").onclick = function(){ openAssign(state.groups[state.gi]); };

  if($("as_cancel")) $("as_cancel").onclick = function(){ $("addform").hidden=true; };

  document.querySelectorAll("[data-day]").forEach(function(b){ b.onclick=function(){ state.openDay = (state.openDay===b.dataset.day) ? "" : b.dataset.day; render(); }; });
  document.querySelectorAll("[data-dd]").forEach(function(b){ b.onclick=function(){ changeDate(+b.dataset.dd); }; });
  if($("todaybtn")) $("todaybtn").onclick = function(){ jumpTo(nearestDate(state.dates)); };

  updateDateUI();
  renderStudents();
}
function jumpTo(di){ state.di=di; updateDateUI(); renderStudents(); }
// עבר / היום / עתיד ביחס לתאריך (ללא שעות)
function daysAgo_(ds){ var t=new Date(); t.setHours(0,0,0,0); return Math.round((t - toDate_(ds))/864e5); }
function dateStatus(ds){ var d=daysAgo_(ds); return d===0?{t:"היום",c:"now"}:d>0?{t:"✓ התקיימה",c:"past"}:{t:"עתידית",c:"future"}; }
function updateDateUI(){
  var ds=state.dates[state.di]||"";
  if($("dlabel")) $("dlabel").textContent=ds;
  var st=$("dstat"); if(st){ var s=dateStatus(ds); st.textContent=s.t; st.className="dstat "+s.c; }
}
// פעילויות שהתקיימו בשבועיים האחרונים (0–14 יום) ואף חניך לא סומן בהן
function unfilledRecent(g){
  var out=[];
  g.dateCols.forEach(function(d){ var a=daysAgo_(d.date);
    if(a>=0 && a<=14 && !g.students.some(function(s){ return s.attendance[d.date]; })) out.push(d.date);
  });
  return out;
}

function nearestDate(dates){
  var today = new Date(); var best=0, bestdiff=1e15;
  dates.forEach(function(ds,i){ var p=ds.split("/"); var dt=new Date(2000+ +p[2], p[1]-1, +p[0]); var diff=Math.abs(dt-today); if(diff<bestdiff){bestdiff=diff;best=i;} });
  return best;
}
function changeDate(dd){ state.di=Math.max(0,Math.min(state.dates.length-1,state.di+dd)); updateDateUI(); renderStudents(); }

// ----- 🎂 ימי הולדת (טל) — מוצג למי שרואה את מרכז המדריכים (רון/טל עכשיו, כולם מ-1/12) -----
function parseDob(v){ var m=String(v||"").trim().match(/^(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?$/); if(!m) return null;
  var d=+m[1], mo=+m[2], y=m[3]?+m[3]:null; if(y!=null && y<100) y+=(y>40?1900:2000);
  if(d<1||d>31||mo<1||mo>12) return null; return {d:d, m:mo, y:y}; }
function bdayInfo(dob){ var p=parseDob(dob); if(!p) return null; var t=new Date(); t.setHours(0,0,0,0);
  var nx=new Date(t.getFullYear(), p.m-1, p.d); if(nx<t) nx=new Date(t.getFullYear()+1, p.m-1, p.d);
  var age=p.y ? nx.getFullYear()-p.y : null; if(age!=null && (age<1||age>99)) age=null;
  return {days:Math.round((nx-t)/864e5), date:nx, age:age}; }
function bdayWhen(b){ return b.days===0 ? 'היום!' : b.days===1 ? 'מחר' : 'ביום '+HDAY[b.date.getDay()]+' '+b.date.getDate()+'/'+(b.date.getMonth()+1); }
function bdayOn(){ return hoursOK(); }
function groupBdays(g){ if(!bdayOn()) return [];
  return (g.students||[]).map(function(st){ var b=bdayInfo(st.dob); return b&&b.days<=7 ? {name:st.name, b:b} : null; }).filter(Boolean).sort(function(a,c){ return a.b.days-c.b.days; }); }
function myStaffDob(){ var me=norm(state.who); var r=(state.staff||[]).filter(function(x){ return norm(x.inst)===me; })[0]; return r&&r.dob ? r.dob : ""; }

// (רכז) מי חוגג השבוע — מדריכים וחניכים

// ימי הולדת בקבוצות של אחרים — רק בפס המקופל של הרכז (צריך לדעת, לא דחוף).

// ----- 🗓 סידור עבודה (טל): לכל יום — מי עובד, בוקר/צהריים, איזו קבוצה, כמה רשומים, גילאים, אפיון. לכולם. -----
// מתי הקבוצה = הפעילות הקבועה של המדריך שלה (אותה אחת שממלאת לו את השעות), אחרת ברירת מחדל (חנ"ב / רון).
function groupSlot(g){
  var own=ownerOf(g), d=dowOf(g.day);
  if(own && d>-1 && (hstate.sched||[]).length){
    var ga=allOf(g), act=norm(schedActFor(ga, own)), base=norm(schedAct(g));
    var mine=(hstate.sched||[]).filter(function(r){ return norm(r.inst)===norm(own) && String(r.dow)===String(d); });
    var r=mine.filter(function(x){ return norm(x.act)===act; })[0] ||
          (mine.length===1 && norm(mine[0].act).indexOf(base)===0 ? mine[0] : null);
    if(r && toHHMM(r.start) && toHHMM(r.end)) return {start:toHHMM(r.start), end:toHHMM(r.end), fixed:r};
  }
  var t=defaultTimes(g); return t ? {start:t.start, end:t.end} : null;
}
function slotKind(t){ var m=t ? parseT(t.start) : null; return m==null ? "" : m < 13*60 ? "am" : "pm"; }
// אותה קבוצה מתוך state.all (כדי ש-schedActFor יזהה אותה)
function allOf(g){ return (state.all||[]).filter(function(x){ return x===g || (x.branch===g.branch && x.day===g.day && x.head!=null && x.head===g.head); })[0] || g; }
function groupAges(g){
  var yr=new Date().getFullYear(), a=[];
  (g.students||[]).forEach(function(s){
    var n=parseFloat(String(s.age||"").replace(",", "."));
    if(!(n>=3 && n<=25)){ var p=parseDob(s.dob); n = p&&p.y ? yr-p.y : NaN; }
    if(n>=3 && n<=25) a.push(Math.floor(n));
  });
  if(!a.length) return "";
  var lo=Math.min.apply(null,a), hi=Math.max.apply(null,a);
  return lo===hi ? String(lo) : lo+"–"+hi;
}
// אפיון הקבוצה — נשמר בגיליון "קבוצות" (רכז עורך)

var WA_ICON='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 8.6c0 3.4 2.9 6.4 6.4 6.4l1.2-1.6-2.2-1-1 .9c-1-.5-1.9-1.4-2.4-2.4l.9-1-1-2.2z"/></svg>';

// ----- שמירת נוכחות בתור: הסימון מופיע מיד, נשלח ברקע בבקשה אחת מרוכזת, ונשלח שוב לבד אם נכשל -----
// (קודם כל לחיצה הייתה בקשה נפרדת → השרת עבד אחת-אחת → בלחיצות מהירות חלק נכשלו אחרי 20 שנ')
function queueMark(cur, date, row, value){
  MQ.pend[cur.branch+"|"+cur.day+"|"+date+"|"+row] = {branch:cur.branch, day:cur.day, date:date, row:row, value:value};
  mqSchedule(350);
}
function mqSchedule(ms){ clearTimeout(MQ.timer); MQ.timer=setTimeout(mqFlush, ms); mqStatus(); }
function mqBatch(){   // כל הסימונים הממתינים של גיליון+תאריך אחד
  var keys=Object.keys(MQ.pend); if(!keys.length) return null;
  var f=MQ.pend[keys[0]];
  var items=keys.filter(function(k){ var p=MQ.pend[k]; return p.branch===f.branch && p.day===f.day && p.date===f.date; }).map(function(k){ return {k:k, p:MQ.pend[k]}; });
  if(!MQ.many) items=items.slice(0,1);   // שרת ישן בלי markMany → אחד-אחד, ברצף
  return {f:f, items:items};
}
function mqBody(bt){
  return MQ.many ? {action:"markMany", branch:bt.f.branch, day:bt.f.day, date:bt.f.date, marks:bt.items.map(function(it){ return {row:it.p.row, value:it.p.value}; })}
                 : {action:"mark", branch:bt.f.branch, day:bt.f.day, row:bt.items[0].p.row, date:bt.f.date, value:bt.items[0].p.value};
}
function mqFlush(){
  if(MQ.busy) return;
  var bt=mqBatch(); if(!bt){ mqStatus(); return; }
  MQ.busy=true; mqStatus();
  post(mqBody(bt)).then(function(j){
    MQ.busy=false;
    if(j && !j.ok && MQ.many && /unknown action/.test(j.error||"")){ MQ.many=false; mqFlush(); return; }
    if(j && j.ok){
      MQ.fails=0;
      bt.items.forEach(function(it){ if(MQ.pend[it.k]===it.p) delete MQ.pend[it.k]; });   // אם סומן שוב בינתיים — נשאר בתור
      if(j.bad && j.bad.length) toast("חלק מהסימונים לא נשמרו (שורה לא תקינה). רעננו את הדף.");
      if(Object.keys(MQ.pend).length) mqFlush(); else mqStatus();
    } else mqRetry(j && j.error);
  }).catch(function(){ MQ.busy=false; mqRetry("אין חיבור"); });
}
function mqRetry(err){
  MQ.fails++;
  if(MQ.fails===6) alert("הנוכחות עוד לא נשמרה ("+(err||"שגיאה")+"). ממשיכים לנסות לבד — אל תסגרו את האפליקציה.");
  mqSchedule(MQ.fails<6 ? 1500*MQ.fails : 15000);
}
function mqStatus(){
  var el=$("savest"); if(!el) return;
  var n=Object.keys(MQ.pend).length;
  if(n){ MQ.shown=true; clearTimeout(MQ.okT); el.className="savest "+(MQ.fails?"bad":"busy"); el.textContent = MQ.fails ? "⚠️ מנסה לשמור שוב…" : "⏳ שומר…"; }
  else if(MQ.shown){ MQ.shown=false; el.className="savest ok"; el.textContent="✓ נשמר";
    clearTimeout(MQ.okT); MQ.okT=setTimeout(function(){ var e=$("savest"); if(e && !Object.keys(MQ.pend).length){ e.className="savest"; e.textContent=""; } }, 2500); }
}
// רענון מהשרת לא ימחק סימון שעוד לא נשמר
function mqReapply(){
  Object.keys(MQ.pend).forEach(function(k){ var p=MQ.pend[k];
    (state.all||[]).forEach(function(g){ if(g.branch===p.branch && g.day===p.day) g.students.forEach(function(s){ if(s.row===p.row) s.attendance[p.date]=p.value; }); });
  });
}
// יוצאים מהאפליקציה באמצע שמירה → שולחים מיד (beacon ממשיך גם כשהמסך נסגר); אם לא עבר — יישלח שוב כשחוזרים
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState!=="hidden" || !MQ.many || !Object.keys(MQ.pend).length) return;
  var seen={}; Object.keys(MQ.pend).forEach(function(k){ var p=MQ.pend[k], g=p.branch+"|"+p.day+"|"+p.date; if(seen[g]) return; seen[g]=1;
    var bt={f:p, items:Object.keys(MQ.pend).filter(function(k2){ var q=MQ.pend[k2]; return q.branch===p.branch&&q.day===p.day&&q.date===p.date; }).map(function(k2){ return {k:k2,p:MQ.pend[k2]}; })};
    try{ navigator.sendBeacon(API, JSON.stringify(mqBody(bt))); }catch(e){}
  });
});

// ניחוש אם לכתוב "אמא של" / "אבא של" / "הורה של" לפי שם ההורה (לא בטוח → הורה)
function _nset(s){ var o={}; s.split(/\s+/).forEach(function(w){ if(w) o[w]=1; }); return o; }
var NAME_U = _nset("טל רוני עדי שחר אור חן מור גל יובל עדן סיון רותם סתיו ליאור דור שי ניצן נוי ים אלמוג עמית נועם ליאל");
var NAME_F = _nset("קארין נועה מיכל שרה רחל לאה תמר יעל דנה מאיה שירה ליאת אורלי גלית ענת אפרת מירב הילה שירן אלינור נטלי שני יערה מוריה איילת אביגיל נגה הגר דקלה רעות עינת קרן לימור סיגל רונית אורית אסנת מרים אביבה יהודית חנה זהבה אילנה סמדר ורד שושנה פנינה גילה יפה תקווה אסתר רבקה אלה הדס תהילה יסמין גאיה אדווה מעין יעלה דליה אורנה כרמית נירית ריקי שולמית ציפי שירלי");
var NAME_M = _nset("דני דוד משה יוסי אבי יעקב יצחק אברהם שלמה יהודה אריה איתי איתמר עומר גיא רון ניר ערן אסף נדב עידו יונתן איל עילי אורי עוז ליעד רועי אלון עידן אמיר גדי רן בועז אבנר מאור אלעד יניב ברק נתנאל אליהו חיים מנחם שמואל בנימין נפתלי זאב אליעזר מרדכי יורם עוזי רפאל גבריאל אורן איתן עמוס יגאל אהרן אפרים ישראל צבי אשר דן גד שלומי טים גולן ארז");
var NAME_MH = _nset("משה יהודה אריה שלמה חנניה עובדיה ירמיה נחמיה זכריה ישעיה נתניה אליה עוזיה");   // שמות זכר שמסתיימים ב-ה
function parentTitle(p){
  var n = norm(p).split(" ")[0] || "";
  if(!n) return "הורה של";
  if(NAME_U[n]) return "הורה של";
  if(NAME_F[n]) return "אמא של";
  if(NAME_M[n]) return "אבא של";
  if(!NAME_MH[n] && /(ה|ת|ית)$/.test(n)) return "אמא של";   // סיומת נשית נפוצה
  return "הורה של";
}
// יוצר קובץ vCard (איש קשר) ומוריד אותו — בטלפון זה נפתח כ"הוסף איש קשר"
function saveContact(s, cur){
  function vesc(x){ return String(x||"").replace(/([\\,;])/g,"\\$1").replace(/\r?\n/g," "); }
  var br = cur.branch==="jaffa" ? "יפו" : "תל אביב";
  var fn = (s.parent? s.parent+" · " : "") + parentTitle(s.parent)+" "+s.name+" · "+br+" · "+cur.day;
  var vcard = "BEGIN:VCARD\r\nVERSION:3.0\r\n"+
    "FN:"+vesc(fn)+"\r\n"+
    (s.phone? "TEL;TYPE=CELL:"+vesc(s.phone)+"\r\n" : "")+
    "NOTE:"+vesc(s.name+" · "+cleanInst(cur.instructor)+" · "+br+" · "+cur.day)+"\r\n"+
    "END:VCARD";
  var blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = ((s.parent||s.name)+".vcf").replace(/\s+/g,"_");
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
}
function cell(k,v,big){ return '<div class="cell"><div class="k">'+esc(k)+'</div><div class="v'+(big?" big":"")+'">'+esc(v)+'</div></div>'; }
function notesHtml(s){
  if(!s.notes||!s.notes.length) return '<div style="color:var(--muted);font-size:.85rem;padding:6px 0">אין הערות עדיין</div>';
  return s.notes.slice().reverse().map(function(n){
    var when = n.at? new Date(n.at).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"}) : "";
    return '<div class="note"><span>📝</span><span>'+esc(n.note)+'<span class="meta">'+esc(n.by||"")+(when?' · '+when:'')+'</span></span></div>';
  }).join("");
}

function monthDays(mk){ var p=mk.split("-"), y=+p[0], m=+p[1], n=new Date(y,m,0).getDate(), out=[]; for(var d=1;d<=n;d++) out.push(d+"/"+m+"/"+String(y).slice(2)); return out; }
function parseT(x){ x=norm(x); if(!x) return null; var m=x.match(/^(\d{1,2}):(\d{2})$/); if(m) return +m[1]*60 + +m[2]; m=x.match(/^(\d{1,2})(\d{2})$/); if(m) return +m[1]*60 + +m[2]; if(/^\d{1,2}$/.test(x)) return +x*60; return null; }
function toHHMM(x){ var m=parseT(x); if(m==null) return ""; return pad2(Math.floor(m/60))+":"+pad2(m%60); }
function calcTotal(s,e){ var a=parseT(s), b=parseT(e); if(a==null||b==null) return ""; var h=(b-a)/60; if(h<0) h+=24; return String(Math.round(h*100)/100); }

  pend.forEach(function(r){
    if(r.status==="ביטול ממתין"){
      H+='<div style="border:1px solid #8a2e2e;background:#2a1414;border-radius:12px;padding:10px;margin-bottom:8px"><div>📅 <b>'+esc(cleanInst(r.requester))+'</b> מבקש לדחות פעילות</div><div style="color:var(--muted);font-size:.85rem">'+esc(r.date)+' · '+esc(r.act||"")+'</div>'+(r.reason?'<div style="font-size:.85rem;margin-top:4px">סיבה: <b>'+esc(r.reason)+'</b></div>':'')+'<div style="display:flex;gap:8px;margin-top:8px"><button class="asin dng apx_cok" data-id="'+esc(r.id)+'">אשר דחייה</button><button class="asin apx_no" data-id="'+esc(r.id)+'" style="flex:0 0 76px">דחה</button></div></div>';
      return;
    }
    var opts=r.proposed.map(function(n){ return '<label style="display:flex;gap:8px;align-items:center;padding:4px 2px"><input type="checkbox" class="apx_p" data-id="'+esc(r.id)+'" value="'+esc(n)+'" checked>'+esc(cleanInst(n))+'</label>'; }).join('');
    H+='<div style="border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px"><div><b>'+esc(cleanInst(r.requester))+'</b> ביקש החלפה</div><div style="color:var(--muted);font-size:.85rem">'+esc(r.date)+' · '+esc(r.act||"")+'</div><div style="font-size:.8rem;color:var(--muted);margin-top:6px">אשרו אילו מהמוצעים יכולים להחליף:</div><div style="margin:4px 0 6px">'+opts+'</div><div style="display:flex;gap:8px;margin-top:4px"><button class="asin pri apx_ok" data-id="'+esc(r.id)+'">אשר ופתח</button><button class="asin apx_no" data-id="'+esc(r.id)+'" style="flex:0 0 76px;border-color:var(--stop);color:var(--stop)">דחה</button></div></div>';
  });
  H+='<button class="asin" id="ar_close2">סגור</button></div>';
  p.innerHTML=H; p.scrollIntoView({behavior:"smooth",block:"center"});
  $("ar_close2").onclick=function(){ p.innerHTML=""; };
  document.querySelectorAll(".apx_ok").forEach(function(b){ b.onclick=function(){
    var approved=[].slice.call(document.querySelectorAll('.apx_p[data-id="'+b.dataset.id+'"]:checked')).map(function(c){return c.value;});
    attApprove(b.dataset.id, approved, b);
  }; });
  document.querySelectorAll(".apx_no").forEach(function(b){ b.onclick=function(){ attReject(b.dataset.id); }; });
  document.querySelectorAll(".apx_cok").forEach(function(b){ b.onclick=function(){
    if(!confirm("לאשר את הדחייה? השעות של המדריך לתאריך הזה יירדו.")) return;
    b.disabled=true; b.textContent="מאשר…";
    post({action:"subReqCancelApprove", id:b.dataset.id}).then(function(j){ if(j&&j.ok){ setReq(b.dataset.id, {status:"בוטל"}); afterSub("הדחייה אושרה ✓"); } else { b.disabled=false; b.textContent="אשר דחייה"; toast("לא בוצע: "+reqErr(j)); } }).catch(function(){ b.disabled=false; b.textContent="אשר דחייה"; toast("אין חיבור"); });
  }; });
}
function attApprove(id, approved, btn){
  if(!approved.length){ toast("בחרו לפחות מדריך אחד לאשר"); return; }
  btn.disabled=true; btn.textContent="מאשר…";
  post({action:"subReqApprove", id:id, approved:approved}).then(function(j){ if(j&&j.ok){ setReq(id, {status:"פתוח", accepted:approved}); var r=reqById(id); if(r) waOffer(approved.map(function(n){ return {to:n, text:waOfferText(n, r)}; })); afterSub("אושר ✓ ההצעה נפתחה למחליפים."); } else { btn.disabled=false; btn.textContent="אשר ופתח"; toast("לא בוצע: "+reqErr(j)); } }).catch(function(){ btn.disabled=false; btn.textContent="אשר ופתח"; toast("אין חיבור"); });
}
document.addEventListener("change", function(e){ var c=e.target; if(c && c.closest && c.closest(".pickl")) c.closest("label").classList.toggle("on", c.checked); });
document.addEventListener("click", function(e){
  var b=e.target.closest && e.target.closest("[data-undo]"); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  var r=reqById(b.dataset.undo); if(r) subUndo(r, b);
}, true);
// רכז (או המדריך שביקש) מבטל החלפה/דחייה בכל שלב — השרת מחזיר את השעות למדריך המקורי
function subUndo(r, btn){
  var q = r.status==="הושלם" ? "לבטל את ההחלפה? "+cleanInst(r.chosen)+" לא יחליף, והשעות יחזרו ל"+cleanInst(r.requester)+"."
        : r.status==="בוטל" ? "לבטל את הדחייה? הפעילות חוזרת, והשעות יחזרו ל"+cleanInst(r.requester)+"."
        : matchName(r.requester||"", state.who) ? "לבטל את הבקשה שלך?" : "לבטל את הבקשה של "+cleanInst(r.requester)+"?";
  if(!confirm(q)) return;
  btn.disabled=true; btn.textContent="מבטל…";
  post({action:"subReqUndo", id:r.id}).then(function(j){
    if(j&&j.ok){ state.reqs=(state.reqs||[]).filter(function(y){ return y.id!==r.id; }); if($("submark")) renderStudents(); afterSub("בוטל ✓"); }
    else { btn.disabled=false; btn.textContent="✕ ביטול"; toast("לא בוצע: "+((j&&j.error)||"")); }
  }).catch(function(){ btn.disabled=false; btn.textContent="✕ ביטול"; toast("אין חיבור"); });
}
function attReject(id){ if(!confirm("לדחות את הבקשה?")) return; post({action:"subReqReject", id:id}).then(function(j){ if(j&&j.ok){ setReq(id, {status:"נדחה"}); afterSub("הבקשה נדחתה."); } else toast("לא בוצע: "+reqErr(j)); }).catch(function(){ toast("אין חיבור"); }); }
// ----- שיוך שעות קבועות לקבוצה (רכז) → יום-קבוע + מילוי אוטומטי חודשי -----
function dowOf(name){ for(var k in DAYS){ if(DAYS[k]===name) return +k; } return -1; }
// כל פעילות = 4 שעות: בוקר 10:00–14:00, צהריים 14:00–18:00. חנ"ב תמיד בוקר; הקבוצות של רון — צהריים.
var SLOT_AM={start:"10:00", end:"14:00", total:"4"}, SLOT_PM={start:"14:00", end:"18:00", total:"4"};
var PM_INST=["רון כפרי"];
function isChanav(g){ return /חנ["״'׳]?ב/.test(String((g&&g.instructor)||"")); }
function plus4(t){ var m=parseT(t); if(m==null) return ""; m=(m+240)%1440; return pad2(Math.floor(m/60))+":"+pad2(m%60); }
// הכנה עתידית: שעות לכל קבוצה. כשנדע מתי כל קבוצה — מוסיפים כאן שורה, ואז ההצעות + "פעילויות קבועות לכולם" + המילוי החודשי עובדים לבד.
// day: יום הקבוצה · branch: "jaffa"/"ta" · name: (לא חובה) חלק משם הקבוצה · slot: "am"/"pm"
var GROUP_SLOTS = [
  // {day:"רביעי", branch:"ta", name:"מיה", slot:"pm"},
];
function defaultTimes(g){
  var gs=GROUP_SLOTS.filter(function(x){ return g && x.day===g.day && x.branch===g.branch && (!x.name || String(g.instructor||"").indexOf(x.name)>-1); })[0];
  if(gs) return gs.slot==="am" ? SLOT_AM : SLOT_PM;
  if(isChanav(g)) return SLOT_AM;
  if(PM_INST.indexOf(norm(cleanInst((g&&g.instructor)||"")))>-1) return SLOT_PM;
  return null;
}
function openAssign(g){
  var p=$("asgpanel"); if(!p) return;
  var opts=HSTAFF.slice().sort(function(a,b){ return a.localeCompare(b,"he"); });
  var def=cleanInst(g.instructor);
  var hit=HSTAFF.filter(function(n){ return String(g.instructor||"").indexOf(n)>-1; })[0];
  if(!hit){ var toks=String(g.instructor||"").split(/[\s+\-,·]+/).map(canonWord);
    var fm=HSTAFF.filter(function(n){ return toks.indexOf(n.split(" ")[0])>-1; }); if(fm.length===1) hit=fm[0]; }
  if(hit) def=hit;
  if(opts.map(norm).indexOf(norm(def))<0) opts.unshift("");
  var H='<div class="card" style="padding:12px;margin-bottom:12px"><div class="sumh" style="margin:0 0 8px">🔗 שיוך שעות קבועות — '+esc(g.day)+' · '+esc(BRN[g.branch]||g.branch)+'</div>';
  H+='<label style="font-size:.8rem;color:var(--muted)">מדריך</label><select id="asg_inst" class="asin" style="margin-bottom:10px">'+opts.map(function(n){ return n ? '<option'+(norm(n)===norm(def)?' selected':'')+'>'+esc(n)+'</option>' : '<option value="" selected>— בחרו מדריך —</option>'; }).join('')+'</select>';
  H+='<label style="font-size:.8rem;color:var(--muted)">שעות הפעילות</label><div style="display:flex;gap:8px;margin:4px 0 6px"><button type="button" id="asg_am" class="asin">☀️ בוקר <span dir="ltr">10–14</span></button><button type="button" id="asg_pm" class="asin">🌤 צהריים <span dir="ltr">14–18</span></button></div><div style="display:flex;gap:8px;margin:0 0 8px"><input id="asg_s" type="time" step="300" class="asin"><input id="asg_e" type="time" step="300" class="asin"></div>';
  H+='<div style="color:var(--muted);font-size:.78rem">כל פעילות 4 שעות — מספיק לבחור שעת התחלה. כל יום '+esc(g.day)+' ימולא אוטומטית בשעות העבודה של המדריך, כל חודש.</div>';
  H+='<div id="asg_err" style="color:var(--stop);font-size:.8rem;font-weight:700;min-height:1em;margin-top:4px"></div>';
  H+='<div style="display:flex;gap:8px;margin-top:6px"><button id="asg_save" class="asin pri">שמור ומלא החודש</button><button id="asg_cancel" class="asin" style="flex:0 0 76px">ביטול</button></div></div>';
  p.innerHTML=H; p.scrollIntoView({behavior:"smooth",block:"center"});
  function setSlot(t){ $("asg_s").value=t.start; $("asg_e").value=t.end;
    $("asg_am").style.borderColor = t===SLOT_AM ? "var(--flag)" : ""; $("asg_pm").style.borderColor = t===SLOT_PM ? "var(--flag)" : ""; }
  var dt=defaultTimes(g); if(dt) setSlot(dt);
  $("asg_am").onclick=function(){ setSlot(SLOT_AM); };
  $("asg_pm").onclick=function(){ setSlot(SLOT_PM); };
  $("asg_s").oninput=function(){ var e=plus4(this.value); if(e) $("asg_e").value=e; $("asg_am").style.borderColor=$("asg_pm").style.borderColor=""; };
  $("asg_cancel").onclick=function(){ p.innerHTML=""; };
  $("asg_save").onclick=function(){ saveAssign(g); };
}
function saveAssign(g){
  var inst=$("asg_inst").value, s=$("asg_s").value, e=$("asg_e").value, dow=dowOf(g.day);
  if(!inst){ $("asg_err").textContent="בחרו מדריך"; return; }
  if(dow<0){ $("asg_err").textContent="לא זוהה יום הקבוצה"; return; }
  if(!s||!e){ $("asg_err").textContent="מלאו שעת התחלה וסיום"; return; }
  var act=schedActFor(g, inst);
  var btn=$("asg_save"); btn.disabled=true; btn.textContent="שומר…";
  var month=monthKey(new Date());
  post({action:"schedSet", inst:inst, dow:dow, act:act, start:s, end:e, multi:1}).then(function(j){
    if(!j||!j.ok) throw new Error((j&&j.error)||"");
    return post({action:"schedFill", inst:inst, month:month});
  }).then(function(j2){
    if($("asgpanel")) $("asgpanel").innerHTML="";
    toast("שויך ✓ נוספו "+((j2&&j2.added)||0)+" ימים לשעות של "+cleanInst(inst)+" החודש (וימשיך אוטומטית כל חודש).");
  }).catch(function(err){ if($("asg_save")){ btn.disabled=false; btn.textContent="שמור ומלא החודש"; } if($("asg_err")) $("asg_err").textContent="לא בוצע: "+((err&&err.message)||"נסו שוב"); });
}

$("ov").addEventListener("click", function(e){ if(e.target.id==="ov") closeCard(); });

boot();
</script>
