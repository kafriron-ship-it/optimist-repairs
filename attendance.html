<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>נוכחות חניכים · מרכז דניאל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{ --bg:#0b1422; --surface:#132134; --ink:#e7eef8; --muted:#94a6bd; --line:#24374f;
  --navy:#6ea6e8; --flag:#f19a45; --ok:#4cc39a; --stop:#ff6b55; --chip:#1b2c44; --head:#163a66; }
@media (prefers-color-scheme: light){ :root{ --bg:#f4f7fb; --surface:#fff; --ink:#132640; --muted:#56677d; --line:#d8e1ec; --navy:#2161ad; --flag:#ec8f33; --ok:#1d7f62; --stop:#c63a28; --chip:#e7eef8; --head:#2161ad; } }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;border-bottom:4px solid var(--flag);padding:13px 16px 10px;display:flex;align-items:center;gap:10px}
header .lg{width:32px;height:32px;border-radius:8px;background:rgba(0,0,0,.2);display:grid;place-items:center;font-size:17px;flex:none}
header h1{font:400 1.18rem 'Secular One'}
header .s{font-size:.72rem;opacity:.85}
.bd{padding:14px}
button{font-family:inherit;cursor:pointer}
.rem{display:flex;align-items:center;gap:9px;background:#2a2113;border:1px solid #5a4620;color:#f3c98a;border-radius:12px;padding:10px 12px;font-size:.86rem;font-weight:700;margin-bottom:14px}
.who{font-size:.85rem;color:var(--muted);margin:2px 2px 12px}
.who b{color:var(--ink)}
.who a{color:var(--navy);cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:14px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.datebar b{font:800 1.05rem 'Assistant'}
.datebar .nav{background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:1.1rem;padding:5px 13px}
.datebar .dctr{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.dstat{font:800 .66rem 'Assistant';letter-spacing:.03em;border-radius:999px;padding:2px 9px}
.dstat.now{background:#163a66;color:#cfe4ff;border:1px solid #2a5a93}
.dstat.past{background:#0f2e24;color:#7fd8ba;border:1px solid #1f6e4e}
.dstat.future{background:#2a2113;color:#f3c98a;border:1px solid #5a4620}
.todayrow{display:flex;justify-content:center;margin:-4px 0 12px}
.todaybtn{background:var(--chip);border:1px solid var(--line);border-radius:999px;color:var(--navy);font:700 .8rem 'Assistant';padding:6px 15px}
.asin{background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:600 .95rem 'Assistant';padding:11px 12px;width:100%}
.asin::placeholder{color:var(--muted)}
.rem.tap{cursor:pointer}
.gsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.gsel button{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:600 .82rem 'Assistant';color:var(--muted)}
.gsel button.on{background:#214a7d;border-color:#3e6fa8;color:#fff}
.gsel .gbr{flex-basis:100%;font:800 .72rem 'Assistant';letter-spacing:.04em;color:var(--flag);margin:8px 2px 0}
.gsel .gbr:first-child{margin-top:0}
.ghostbtn{background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:700 .86rem 'Assistant';padding:9px 14px;display:inline-flex;align-items:center;gap:6px}
.ssearch{width:100%;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:600 .92rem 'Assistant'}
.sres .sr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.sres .sr:first-child{border-top:0}
.sres .sr b{font-weight:700}.sres .sr span{font-size:.75rem;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid var(--line);font-size:.9rem}
.sumrow:first-of-type{border-top:0}
.sumrow .c{font:700 .82rem 'IBM Plex Mono'}
.sumh{font:800 .74rem 'Assistant';letter-spacing:.03em;color:var(--muted);margin:12px 2px 4px}
.sumh:first-child{margin-top:0}
.badge-x{background:#311416;color:var(--stop);border-radius:7px;padding:2px 8px;font:700 .8rem 'IBM Plex Mono'}
.gttl{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}
.gttl .t{font-weight:800}
.pill{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font:600 .8rem 'Assistant'}
.pill b{color:var(--ok)}
.st{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .nm{flex:1;font-weight:700;font-size:.95rem;min-width:0;text-align:right;background:none;border:0;color:var(--ink);padding:0}
.st .nm small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);flex:none}
.seg button{background:none;border:0;color:var(--muted);font:700 .82rem 'Assistant';padding:7px 11px}
.seg button+button{border-inline-start:1.5px solid var(--line)}
.seg .ok{background:var(--ok);color:#06231a}
.seg .no{background:var(--stop);color:#2a0b07}
.msg{text-align:center;color:var(--muted);padding:30px 10px;font-size:.92rem}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* name gate */
.gate{position:fixed;inset:0;background:rgba(5,10,20,.75);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.gate .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%}
.gate h2{font:800 1.15rem 'Assistant';margin-bottom:6px}
.gate p{font-size:.85rem;color:var(--muted);margin-bottom:14px}
.gate input{width:100%;font:600 1.05rem 'Assistant';background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:6px}
.gate .err{color:var(--stop);font-size:.8rem;font-weight:700;min-height:1.1em;margin-bottom:8px}
.gate button.go{width:100%;background:var(--flag);color:#2b1400;border:0;border-radius:10px;padding:12px;font:800 1rem 'Assistant'}
/* student card overlay */
.ov{position:fixed;inset:0;background:rgba(5,10,20,.72);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.ov .box{background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px}
.ov .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ov .av{width:50px;height:50px;border-radius:13px;background:#214a7d;color:#fff;display:grid;place-items:center;font:800 1.2rem 'Assistant';flex:none}
.ov .av.f{background:#7a3a63}
.ov .top .nm{font:800 1.2rem 'Assistant';line-height:1.15}
.ov .top .sub{font-size:.8rem;color:var(--muted)}
.ov .x{margin-inline-start:auto;background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:700;padding:6px 11px}
.call{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#14402e,#0f3326);border:1px solid #1f6e4e;border-radius:16px;padding:13px 15px;margin-bottom:12px;text-decoration:none}
.call .ic{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#06231a;display:grid;place-items:center;font-size:21px;flex:none}
.call .lab{font-size:.74rem;color:#8fd9bf}
.call .ph{font:600 1.3rem 'IBM Plex Mono';color:#eafff5}
.addcontact{display:block;width:100%;background:var(--chip);border:1px solid var(--line);border-radius:12px;color:var(--navy);font:700 .9rem 'Assistant';padding:11px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cell .k{font-size:.72rem;color:var(--muted)}
.cell .v{font:800 1.1rem 'Assistant';margin-top:2px}
.cell .v.big{color:var(--flag)}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.notes .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.notes .h .k{font-size:.72rem;color:var(--muted)}
.note{display:flex;gap:8px;font-size:.9rem;padding:9px 0;border-top:1px solid var(--line);line-height:1.4}
.note:first-of-type{border-top:0}
.note .meta{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.naddrow{display:flex;gap:8px;margin-top:10px}
.naddrow input{flex:1;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:600 .9rem 'Assistant'}
.naddrow button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:0 15px;font:700 .9rem 'Assistant'}
[hidden]{display:none!important}
.embed header{display:none}
.embed .bd{padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="lg">⛵</div><div><h1>נוכחות חניכים</h1><div class="s" id="hsub">מרכז דניאל</div></div></header>
  <div class="bd" id="main"><div class="msg"><span class="spin"></span><div style="margin-top:10px">טוען…</div></div></div>
</div>

<div class="gate" id="gate" hidden>
  <div class="box">
    <h2>מה השם המלא שלך?</h2>
    <p>כדי שנראה לך את החניכים של הקבוצה שלך. צריך שם פרטי ושם משפחה.</p>
    <input id="gfirst" placeholder="שם פרטי" autocomplete="given-name">
    <input id="glast" placeholder="שם משפחה" autocomplete="family-name">
    <div class="err" id="gerr"></div>
    <button class="go" id="gsave">המשך</button>
  </div>
</div>

<div class="ov" id="ov" hidden><div class="box" id="ovbox"></div></div>

<script>
// כתובת המחבר אינה בקוד — היא מגיעה פעם אחת דרך הקישור הפרטי (#api=...) ונשמרת במכשיר.
var API = "";
try{ API = localStorage.getItem("att_api") || ""; }catch(e){}
(function(){
  var m = /[#&?]api=([^&]+)/.exec(location.hash + "&" + location.search);
  if(m){ API = decodeURIComponent(m[1]); try{ localStorage.setItem("att_api", API); }catch(e){} try{ history.replaceState(null,"",location.pathname); }catch(e){} }
})();
try{ if(/[?&]embed=/.test(location.search)) document.documentElement.classList.add("embed"); }catch(e){}
var BRANCH = "jaffa";
try{ var mb=/[#&?]branch=([^&]+)/.exec(location.search); if(mb) BRANCH=decodeURIComponent(mb[1]); }catch(e){}
var COORDS = ["טל הררי","ירדן סדן"];   // רכזים (שם מלא)
function nameWords(s){ return norm(s).split(/\s+/).filter(Boolean); }
// התאמה מחמירה: כל מילות השם המוקלד נמצאות אצל המדריך, או להפך. דורש שם מלא.
function matchName(instructor, who){
  var iw = nameWords(instructor), ww = nameWords(who);
  if(!iw.length || ww.length < 2) return false;
  var allWin = ww.every(function(w){ return iw.indexOf(w) > -1; });
  var allIin = iw.every(function(w){ return ww.indexOf(w) > -1; });
  return allWin || allIin;
}
function isCoordName(who){
  var ww = nameWords(who); if(ww.length < 2) return false;
  return COORDS.some(function(c){ return nameWords(c).every(function(w){ return ww.indexOf(w) > -1; }); });
}
// שם קבוצה לתצוגה — בלי עוזרי מדריך ובלי "הקבוצה של"
function cleanInst(s){
  var t = norm(String(s||""))
    .replace(/עוזר[ת]?\s*מדריכ[ה]?/g,"")
    .replace(/^\s*עוזר[ת]?\s*/,"")
    .replace(/^הקבוצ[הת]\s*(של\s*)?/,"")
    .replace(/^קבוצה\s*של\s*/,"");
  if(t.indexOf("+")>-1){ var p=t.split("+"); t = norm(p[0]) || norm(p.slice(1).join("+")); }   // עוזר אחרי + — שומר את המדריך הראשי
  var vi=norm(t).search(/\sו/); if(vi>0) t=norm(t).slice(0,vi);   // "רון כפרי וטים" → מוריד עוזר שמחובר ב-ו׳
  return norm(t) || "קבוצה";
}
var DAYS = {0:"ראשון",1:"שני",2:"שלישי",3:"רביעי",4:"חמישי",5:"שישי",6:"שבת"};
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); };
var norm = function(s){ return String(s==null?"":s).trim().replace(/\s+/g," "); };

var state = { who:"", data:null, day:"", dates:[], di:0, groups:[], gi:0, isCoord:false };

try{ state.who = localStorage.getItem("who") || localStorage.getItem("att_who") || ""; }catch(e){}

function fmtToday(d){ return d.getDate()+"/"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2); }

function boot(){
  if(!API){ $("main").innerHTML = '<div class="msg">כדי להשתמש במסך הנוכחות צריך לפתוח אותו דרך הקישור שקיבלת מהרכז.</div>'; return; }
  if(!state.who || nameWords(state.who).length < 2){ openGate(); return; }   // שם מלא חובה
  load();
}
function openGate(){ $("gate").hidden=false; var p=nameWords(state.who||""); $("gfirst").value=p[0]||""; $("glast").value=p.slice(1).join(" "); setTimeout(function(){$("gfirst").focus();},100); }
$("gsave").addEventListener("click", saveName);
["gfirst","glast"].forEach(function(id){ $(id).addEventListener("keydown", function(e){ if(e.key==="Enter") saveName(); }); });
function saveName(){
  var f = norm($("gfirst").value), l = norm($("glast").value);
  if(!f || !l){ $("gerr").textContent = "צריך שם פרטי וגם שם משפחה"; return; }
  var v = f + " " + l;
  state.who = v; try{ localStorage.setItem("who", v); localStorage.setItem("att_who", v); }catch(e){}
  $("gate").hidden = true; load();
}

function api(params){
  var u = API + "?" + Object.keys(params).map(function(k){ return k+"="+encodeURIComponent(params[k]); }).join("&");
  return fetch(u).then(function(r){ return r.json(); });
}
function post(body){ return fetch(API, {method:"POST", body:JSON.stringify(body)}).then(function(r){ return r.json(); }); }

function load(){
  // מציג מיד את הנתונים האחרונים מהמטמון (טעינה מיידית), ומרענן ברקע מול הגיליון
  var cached=null;
  try{ var c=JSON.parse(localStorage.getItem("att_cache")||"null"); if(c&&c.groups&&c.groups.length) cached=c.groups; }catch(e){}
  state.touched = false;
  if(cached){ state.all=cached; render(); }
  else $("main").innerHTML = '<div class="msg"><span class="spin"></span><div style="margin-top:10px">טוען נוכחות…</div></div>';
  api({action:"rosterAll"}).then(function(j){
    if(!j.ok){ if(!cached) $("main").innerHTML = '<div class="msg">שגיאה: '+esc(j.error||"")+'</div>'; return; }
    try{ localStorage.setItem("att_cache", JSON.stringify({t:Date.now(), groups:j.groups||[]})); }catch(e){}
    if(cached && state.touched) return;   // המשתמש כבר סימן — לא לדרוס את המסך הפעיל
    state.all = j.groups || [];
    render();
  }).catch(function(){ if(!cached) $("main").innerHTML = '<div class="msg">אין חיבור. נסו שוב.</div>'; });
}

function myGroups(){
  // כל הקבוצות משני הסניפים, מסוננות למדריך לפי שם מלא (אלא אם רכז רואה הכול)
  state.isCoord = isCoordName(state.who);
  var all = state.all || [];
  if(state.isCoord) return all.slice();
  return all.filter(function(g){ return matchName(g.instructor, state.who); });
}

function render(){
  var groups = myGroups();
  state.groups = groups;
  // דגל "מדריך מוכר" — לפיו האפליקציה הראשית מחליטה אם להציג את תאב הנוכחות
  try{ if(state.isCoord || groups.length) localStorage.setItem("att_ok", norm(state.who)); else localStorage.removeItem("att_ok"); }catch(e){}
  $("hsub").textContent = "מרכז דניאל · יפו" + (state.isCoord ? " · כל הקבוצות" : "");
  if(!groups.length){
    $("main").innerHTML = '<div class="who">שלום <b>'+esc(state.who)+'</b></div>'+
      '<div class="msg">לא מצאנו קבוצה למדריך הזה.<br>בדקו שהשם זהה למה שכתוב בטבלה (אפשר לשנות שם בלחצן ✎ למעלה).</div>';
    return;
  }
  if(state.gi >= groups.length) state.gi = 0;
  var cur = groups[state.gi];
  // תאריכים של הקבוצה הנוכחית + בחירת ברירת מחדל (הקרוב להיום)
  state.dates = cur.dateCols.map(function(d){ return d.date; });
  state.di = nearestDate(state.dates);

  var h = '<div class="who">שלום <b>'+esc(state.who)+'</b></div>';
  // חיפוש חניך — רכז בכל הקבוצות, מדריך בקבוצות שלו
  h += '<div class="card" style="padding:10px 12px;margin-bottom:12px"><input id="ssearch" class="ssearch" placeholder="'+(state.isCoord?'חיפוש חניך בכל הקבוצות…':'חיפוש חניך בקבוצות שלי…')+'"><div class="sres" id="sres"></div></div>';
  // תזכורת: פעילויות שהתקיימו בשבועיים האחרונים ולא מולאו כלל
  var unfilled = unfilledRecent(cur);
  if(unfilled.length){
    h += '<div class="rem tap" id="rembanner">⏰ '+(unfilled.length===1
      ? 'פעילות '+esc(unfilled[0])+' התקיימה ועדיין לא מולאה'
      : unfilled.length+' פעילויות מהשבועיים האחרונים לא מולאו')+' — לחצו למעבר</div>';
  }
  // בוחר קבוצה (לרכזים / כמה קבוצות)
  if(groups.length > 1){
    var DORDER = ["ראשון","שני","שלישי","רביעי","חמישי","שישי"];
    var BR = { jaffa:"יפו", ta:"תל אביב" };
    var order = groups.map(function(g,i){ return i; }).sort(function(a,b){
      var ga=groups[a], gb=groups[b];
      if(ga.branch!==gb.branch) return (ga.branch==="jaffa"?0:1)-(gb.branch==="jaffa"?0:1);
      var d=DORDER.indexOf(ga.day)-DORDER.indexOf(gb.day); if(d) return d;
      return norm(ga.instructor).localeCompare(norm(gb.instructor),"he");
    });
    var lastBr="", gh='<div class="gsel">';
    order.forEach(function(i){ var g=groups[i];
      if(state.isCoord && g.branch!==lastBr){ lastBr=g.branch; gh += '<div class="gbr">'+esc(BR[g.branch]||g.branch)+'</div>'; }
      gh += '<button data-gi="'+i+'" class="'+(i===state.gi?"on":"")+'">'+esc(cleanInst(g.instructor))+' · '+esc(g.day)+'</button>';
    });
    h += gh + '</div>';
  }
  h += '<div class="card">';
  h += '<div class="datebar"><button class="nav" data-dd="-1">‹</button><div class="dctr"><b id="dlabel"></b><span id="dstat" class="dstat"></span></div><button class="nav" data-dd="1">›</button></div>';
  h += '<div class="todayrow"><button id="todaybtn" class="todaybtn">📍 לפעילות הקרובה</button></div>';
  h += '<div class="gttl"><span class="t">'+esc(cleanInst(cur.instructor))+' · '+esc(cur.day)+'</span><span class="pill" id="cnt"></span></div>';
  h += '<div style="margin:0 2px 10px"><button id="allp" class="ghostbtn">✓ סמן את כולם נוכחים</button></div>';
  h += '<div id="stlist"></div>';
  if(state.isCoord){   // הוספת חניך — רכזים בלבד
    h += '<div style="margin:12px 2px 0"><button id="addst" class="ghostbtn">➕ הוסף חניך</button></div>'+
      '<div id="addform" hidden style="margin-top:10px;display:flex;flex-direction:column;gap:8px">'+
        '<input id="as_name" class="asin" placeholder="שם החניך (חובה)">'+
        '<input id="as_parent" class="asin" placeholder="שם הורה">'+
        '<input id="as_phone" class="asin" type="tel" placeholder="טלפון הורה">'+
        '<div style="display:flex;gap:8px"><input id="as_shirt" class="asin" placeholder="מידת חולצה"><input id="as_age" class="asin" placeholder="גיל"></div>'+
        '<div id="as_err" style="color:var(--stop);font-size:.8rem;font-weight:700;min-height:1em"></div>'+
        '<div style="display:flex;gap:8px"><button id="as_save" class="asin" style="background:var(--flag);color:#2b1400;border:0;font-weight:800">שמור חניך</button><button id="as_cancel" class="asin" style="flex:0 0 90px">ביטול</button></div>'+
      '</div>';
  }
  h += '</div>';
  if(state.isCoord) h += '<div class="card" id="sumcard" style="margin-top:14px"></div>';   // הסיכום בסוף הגלילה
  $("main").innerHTML = h;
  if($("allp")) $("allp").onclick = markAllPresent;
  if($("addst")) $("addst").onclick = function(){ var f=$("addform"); f.hidden=!f.hidden; if(!f.hidden) $("as_name").focus(); };
  if($("as_cancel")) $("as_cancel").onclick = function(){ $("addform").hidden=true; };
  if($("as_save")) $("as_save").onclick = addStudent;
  if($("ssearch")) $("ssearch").oninput = function(){ doSearch(this.value); };
  if($("sumcard")) renderSummary();
  document.querySelectorAll("[data-gi]").forEach(function(b){ b.onclick=function(){ state.gi=+b.dataset.gi; render(); }; });
  document.querySelectorAll("[data-dd]").forEach(function(b){ b.onclick=function(){ changeDate(+b.dataset.dd); }; });
  if($("todaybtn")) $("todaybtn").onclick = function(){ jumpTo(nearestDate(state.dates)); };
  if($("rembanner")) $("rembanner").onclick = function(){ var di=state.dates.indexOf(unfilled[0]); if(di>-1) jumpTo(di); };
  updateDateUI();
  renderStudents();
}
function jumpTo(di){ state.di=di; updateDateUI(); renderStudents(); }
// עבר / היום / עתיד ביחס לתאריך (ללא שעות)
function daysAgo_(ds){ var t=new Date(); t.setHours(0,0,0,0); return Math.round((t - toDate_(ds))/864e5); }
function dateStatus(ds){ var d=daysAgo_(ds); return d===0?{t:"היום",c:"now"}:d>0?{t:"✓ התקיימה",c:"past"}:{t:"עתידית",c:"future"}; }
function updateDateUI(){
  var ds=state.dates[state.di]||"";
  if($("dlabel")) $("dlabel").textContent=ds;
  var st=$("dstat"); if(st){ var s=dateStatus(ds); st.textContent=s.t; st.className="dstat "+s.c; }
}
// פעילויות שהתקיימו בשבועיים האחרונים (0–14 יום) ואף חניך לא סומן בהן
function unfilledRecent(g){
  var out=[];
  g.dateCols.forEach(function(d){ var a=daysAgo_(d.date);
    if(a>=0 && a<=14 && !g.students.some(function(s){ return s.attendance[d.date]; })) out.push(d.date);
  });
  return out;
}

function nearestDate(dates){
  var today = new Date(); var best=0, bestdiff=1e15;
  dates.forEach(function(ds,i){ var p=ds.split("/"); var dt=new Date(2000+ +p[2], p[1]-1, +p[0]); var diff=Math.abs(dt-today); if(diff<bestdiff){bestdiff=diff;best=i;} });
  return best;
}
function changeDate(dd){ state.di=Math.max(0,Math.min(state.dates.length-1,state.di+dd)); updateDateUI(); renderStudents(); }

function renderStudents(){
  var cur = state.groups[state.gi]; var date = state.dates[state.di];
  var present = 0;
  var html = cur.students.map(function(s, idx){
    var v = s.attendance[date]||"";
    if(v==="v") present++;
    return '<div class="st">'+
      '<button class="nm" data-card="'+idx+'">'+esc(s.name)+(s.notes&&s.notes.length?' ⚠️':'')+'<small>'+esc(s.parent||"")+(s.shirt?' · חולצה '+esc(s.shirt):'')+'</small></button>'+
      '<div class="seg">'+
        '<button data-mark="v" data-row="'+s.row+'" class="'+(v==="v"?"ok":"")+'">✓</button>'+
        '<button data-mark="x" data-row="'+s.row+'" class="'+(v==="x"?"no":"")+'">✗</button>'+
      '</div></div>';
  }).join("");
  $("stlist").innerHTML = html;
  $("cnt").innerHTML = '<b>'+present+'</b> / '+cur.students.length+' נוכחים';
  document.querySelectorAll("#stlist [data-mark]").forEach(function(b){ b.onclick=function(){ mark(cur, date, b); }; });
  document.querySelectorAll("#stlist [data-card]").forEach(function(b){ b.onclick=function(){ openCard(cur.students[+b.dataset.card], cur); }; });
}

function mark(cur, date, btn){
  var row = +btn.dataset.row, val = btn.dataset.mark;
  var s = cur.students.filter(function(x){ return x.row===row; })[0];
  var nv = (s.attendance[date]===val) ? "" : val;   // לחיצה שנייה מבטלת
  s.attendance[date] = nv;                            // אופטימי
  state.touched = true;                               // שהרענון ברקע לא ידרוס סימון טרי
  renderStudents();
  post({action:"mark", branch:cur.branch, day:cur.day, row:row, date:date, value:nv}).then(function(j){
    if(!j||!j.ok){ s.attendance[date] = ""; renderStudents(); alert("לא נשמר, נסו שוב"); }
  }).catch(function(){ s.attendance[date]=""; renderStudents(); alert("אין חיבור"); });
}

function markAllPresent(){
  var cur=state.groups[state.gi], date=state.dates[state.di], rows=[];
  cur.students.forEach(function(s){ if(s.attendance[date]!=="v"){ s.attendance[date]="v"; rows.push(s.row); } });
  state.touched = true;
  renderStudents();
  rows.forEach(function(row){ post({action:"mark",branch:cur.branch,day:cur.day,row:row,date:date,value:"v"}).catch(function(){}); });
}
function addStudent(){
  var cur=state.groups[state.gi];
  var name=norm($("as_name").value);
  if(!name){ $("as_err").textContent="צריך שם חניך"; return; }
  var btn=$("as_save"), old=btn.textContent; btn.disabled=true; btn.textContent="שומר…"; $("as_err").textContent="";
  post({action:"addStudent", branch:cur.branch, day:cur.day, group:cur.instructor, name:name,
    parent:norm($("as_parent").value), phone:norm($("as_phone").value), shirt:norm($("as_shirt").value), age:norm($("as_age").value)
  }).then(function(j){
    if(j&&j.ok){ try{localStorage.removeItem("att_cache");}catch(e){} state.touched=false; load(); }
    else { btn.disabled=false; btn.textContent=old; $("as_err").textContent="לא נשמר: "+((j&&j.error)||"נסו שוב"); }
  }).catch(function(){ btn.disabled=false; btn.textContent=old; $("as_err").textContent="אין חיבור"; });
}
function doSearch(q){
  var box=$("sres"); if(!box) return; q=norm(q);
  if(q.length<2){ box.innerHTML=""; return; }
  var pool = state.isCoord ? (state.all||[]) : (state.groups||[]);   // רכז: כל הקבוצות · מדריך: שלו בלבד
  var res=[]; pool.forEach(function(g){ g.students.forEach(function(s){ if(norm(s.name).indexOf(q)>-1) res.push({s:s,g:g}); }); });
  box.innerHTML = res.length ? res.slice(0,15).map(function(r,i){ return '<div class="sr" data-si="'+i+'"><b>'+esc(r.s.name)+'</b><span>'+esc(cleanInst(r.g.instructor))+' · '+esc(r.g.day)+'</span></div>'; }).join("") : '<div style="color:var(--muted);font-size:.85rem;padding:8px 2px">לא נמצא חניך</div>';
  box.querySelectorAll("[data-si]").forEach(function(el){ el.onclick=function(){ var r=res[+el.dataset.si]; openCard(r.s,r.g); }; });
}
function toDate_(ds){ var p=ds.split("/"); return new Date(2000+ +p[2], p[1]-1, +p[0]); }
function latestPastDate_(g){ var best=null; g.dateCols.forEach(function(d){ if(daysAgo_(d.date) >= 0){ var dt=toDate_(d.date); if(!best||dt>best.dt) best={date:d.date,dt:dt}; } }); return best; }   // רק תאריך שכבר קרה (היום או קודם)
function renderSummary(){
  var all=state.all||[], missing=[], abs=[];
  all.forEach(function(g){ var lp=latestPastDate_(g); if(lp && !g.students.some(function(s){return s.attendance[lp.date];})) missing.push({g:g,date:lp.date}); });
  all.forEach(function(g){ g.students.forEach(function(s){ var n=Object.keys(s.attendance).filter(function(k){return s.attendance[k]==="x";}).length; if(n>0) abs.push({s:s,g:g,n:n}); }); });
  abs.sort(function(a,b){ return b.n-a.n; });
  var h='<div class="sumh">קבוצות שלא מולאו (תאריך אחרון)</div>';
  h += '<div class="sumrow"><span>סה״כ לא מולאו</span><span class="c" style="color:'+(missing.length?'var(--stop)':'var(--ok)')+'">'+missing.length+'</span></div>';
  missing.slice(0,8).forEach(function(m){ h += '<div class="sumrow" style="font-size:.82rem;color:var(--muted)"><span>'+esc(cleanInst(m.g.instructor))+' · '+esc(m.g.day)+'</span><span>'+esc(m.date)+'</span></div>'; });
  h += '<div class="sumh">חניכים עם הכי הרבה חיסורים</div>';
  if(!abs.length) h += '<div class="sumrow" style="color:var(--muted);font-size:.85rem"><span>אין חיסורים עדיין</span></div>';
  abs.slice(0,8).forEach(function(a,i){ h += '<div class="sumrow" data-abs="'+i+'" style="cursor:pointer"><span><b>'+esc(a.s.name)+'</b> · '+esc(cleanInst(a.g.instructor))+'</span><span class="badge-x">'+a.n+'</span></div>'; });
  $("sumcard").innerHTML=h;
  $("sumcard").querySelectorAll("[data-abs]").forEach(function(el){ el.onclick=function(){ var a=abs[+el.dataset.abs]; openCard(a.s,a.g); }; });
}
function openCard(s, cur){
  var fem = norm(s.gender)==="בת";
  var init = norm(s.name).split(" ").slice(0,2).map(function(w){return w[0];}).join("");
  var ph = (s.phone||"").replace(/\D/g,"");
  var h = '<div class="top"><div class="av '+(fem?"f":"")+'">'+esc(init)+'</div>'+
    '<div><div class="nm">'+esc(s.name)+'</div><div class="sub">'+esc(cleanInst(cur.instructor))+' · '+esc(cur.day)+'</div></div>'+
    '<button class="x" id="ovx">סגור</button></div>';
  if(ph){
    h += '<a class="call" href="tel:'+esc(ph)+'"><div class="ic">📞</div><div><div class="lab">התקשר להורה'+(s.parent?' — '+esc(s.parent):'')+'</div><div class="ph">'+esc(s.phone)+'</div></div></a>';
    h += '<button class="addcontact" id="addcontact">➕ הוסף לאנשי קשר</button>';
  }
  var _att=s.attendance||{}, _vals=Object.keys(_att).map(function(k){return _att[k];});
  var _absent=_vals.filter(function(m){return m==="x";}).length, _present=_vals.filter(function(m){return m==="v";}).length, _total=_absent+_present;
  h += '<div class="grid" style="margin-bottom:12px">'+
    '<div class="cell"><div class="k">נעדר</div><div class="v" style="color:var(--stop)">'+_absent+' <span style="font-size:.78rem;color:var(--muted);font-weight:600">פעמים</span></div></div>'+
    '<div class="cell"><div class="k">נוכח</div><div class="v" style="color:var(--ok)">'+_present+' <span style="font-size:.78rem;color:var(--muted);font-weight:600">מתוך '+_total+'</span></div></div>'+
  '</div>';
  h += '<div class="grid">'+
    cell("מידת חולצה", s.shirt||"—", true)+ cell("גיל", s.age||"—")+
    cell("תאריך לידה", s.dob||"—")+ cell("מין", s.gender||"—")+'</div>';
  h += '<div class="notes"><div class="h"><span class="k">הערות</span></div><div id="nlist">'+notesHtml(s)+'</div>'+
    '<div class="naddrow"><input id="nin" placeholder="הוסף הערה…"><button id="nadd">הוסף</button></div></div>';
  $("ovbox").innerHTML = h;
  $("ov").hidden = false;
  $("ovx").onclick = closeCard;
  if($("addcontact")) $("addcontact").onclick = function(){ saveContact(s, cur); };
  $("nadd").onclick = function(){ addNote(s, cur); };
}
// יוצר קובץ vCard (איש קשר) ומוריד אותו — בטלפון זה נפתח כ"הוסף איש קשר"
function saveContact(s, cur){
  function vesc(x){ return String(x||"").replace(/([\\,;])/g,"\\$1").replace(/\r?\n/g," "); }
  var br = cur.branch==="jaffa" ? "יפו" : "תל אביב";
  var fn = (s.parent? s.parent+" · " : "") + "הורה של "+s.name+" · "+br+" · "+cur.day;
  var vcard = "BEGIN:VCARD\r\nVERSION:3.0\r\n"+
    "FN:"+vesc(fn)+"\r\n"+
    (s.phone? "TEL;TYPE=CELL:"+vesc(s.phone)+"\r\n" : "")+
    "NOTE:"+vesc(s.name+" · "+cleanInst(cur.instructor)+" · "+br+" · "+cur.day)+"\r\n"+
    "END:VCARD";
  var blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = ((s.parent||s.name)+".vcf").replace(/\s+/g,"_");
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
}
function cell(k,v,big){ return '<div class="cell"><div class="k">'+esc(k)+'</div><div class="v'+(big?" big":"")+'">'+esc(v)+'</div></div>'; }
function notesHtml(s){
  if(!s.notes||!s.notes.length) return '<div style="color:var(--muted);font-size:.85rem;padding:6px 0">אין הערות עדיין</div>';
  return s.notes.slice().reverse().map(function(n){
    var when = n.at? new Date(n.at).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"}) : "";
    return '<div class="note"><span>📝</span><span>'+esc(n.note)+'<span class="meta">'+esc(n.by||"")+(when?' · '+when:'')+'</span></span></div>';
  }).join("");
}
function addNote(s, cur){
  var t = norm($("nin").value); if(!t) return;
  s.notes = s.notes||[]; s.notes.push({note:t, by:state.who, at:Date.now()});
  $("nlist").innerHTML = notesHtml(s); $("nin").value="";
  post({action:"addNote", branch:cur.branch, day:cur.day, student:s.name, note:t, by:state.who}).catch(function(){ alert("ההערה לא נשמרה"); });
}
function closeCard(){ $("ov").hidden = true; }
$("ov").addEventListener("click", function(e){ if(e.target.id==="ov") closeCard(); });

boot();
</script>
</body>
</html>
