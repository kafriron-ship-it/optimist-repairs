<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>נוכחות חניכים · מרכז דניאל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
:root{ --bg:#0b1422; --surface:#132134; --ink:#e7eef8; --muted:#94a6bd; --line:#24374f;
  --navy:#6ea6e8; --flag:#f19a45; --ok:#4cc39a; --stop:#ff6b55; --chip:#1b2c44; --head:#163a66; }
@media (prefers-color-scheme: light){ :root{ --bg:#f4f7fb; --surface:#fff; --ink:#132640; --muted:#56677d; --line:#d8e1ec; --navy:#2161ad; --flag:#ec8f33; --ok:#1d7f62; --stop:#c63a28; --chip:#e7eef8; --head:#2161ad; } }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Assistant',sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;border-bottom:4px solid var(--flag);padding:13px 16px 10px;display:flex;align-items:center;gap:10px}
header .lg{width:32px;height:32px;border-radius:8px;background:rgba(0,0,0,.2);display:grid;place-items:center;font-size:17px;flex:none}
header h1{font:400 1.18rem 'Secular One'}
header .s{font-size:.72rem;opacity:.85}
.bd{padding:14px}
button{font-family:inherit;cursor:pointer}
.rem{display:flex;align-items:center;gap:9px;background:#2a2113;border:1px solid #5a4620;color:#f3c98a;border-radius:12px;padding:10px 12px;font-size:.86rem;font-weight:700;margin-bottom:14px}
.who{font-size:.85rem;color:var(--muted);margin:2px 2px 12px}
.who b{color:var(--ink)}
.who a{color:var(--navy);cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:14px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.datebar b{font:800 1.05rem 'Assistant'}
.datebar .nav{background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:1.1rem;padding:5px 13px}
.gsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.gsel button{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:600 .82rem 'Assistant';color:var(--muted)}
.gsel button.on{background:#214a7d;border-color:#3e6fa8;color:#fff}
.gttl{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}
.gttl .t{font-weight:800}
.pill{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font:600 .8rem 'Assistant'}
.pill b{color:var(--ok)}
.st{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .nm{flex:1;font-weight:700;font-size:.95rem;min-width:0;text-align:right;background:none;border:0;color:var(--ink);padding:0}
.st .nm small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);flex:none}
.seg button{background:none;border:0;color:var(--muted);font:700 .82rem 'Assistant';padding:7px 11px}
.seg button+button{border-inline-start:1.5px solid var(--line)}
.seg .ok{background:var(--ok);color:#06231a}
.seg .no{background:var(--stop);color:#2a0b07}
.msg{text-align:center;color:var(--muted);padding:30px 10px;font-size:.92rem}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* name gate */
.gate{position:fixed;inset:0;background:rgba(5,10,20,.75);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.gate .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%}
.gate h2{font:800 1.15rem 'Assistant';margin-bottom:6px}
.gate p{font-size:.85rem;color:var(--muted);margin-bottom:14px}
.gate input{width:100%;font:600 1.05rem 'Assistant';background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:6px}
.gate .err{color:var(--stop);font-size:.8rem;font-weight:700;min-height:1.1em;margin-bottom:8px}
.gate button.go{width:100%;background:var(--flag);color:#2b1400;border:0;border-radius:10px;padding:12px;font:800 1rem 'Assistant'}
/* student card overlay */
.ov{position:fixed;inset:0;background:rgba(5,10,20,.72);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.ov .box{background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px}
.ov .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ov .av{width:50px;height:50px;border-radius:13px;background:#214a7d;color:#fff;display:grid;place-items:center;font:800 1.2rem 'Assistant';flex:none}
.ov .av.f{background:#7a3a63}
.ov .top .nm{font:800 1.2rem 'Assistant';line-height:1.15}
.ov .top .sub{font-size:.8rem;color:var(--muted)}
.ov .x{margin-inline-start:auto;background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:700;padding:6px 11px}
.call{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#14402e,#0f3326);border:1px solid #1f6e4e;border-radius:16px;padding:13px 15px;margin-bottom:12px;text-decoration:none}
.call .ic{width:44px;height:44px;border-radius:50%;background:var(--ok);color:#06231a;display:grid;place-items:center;font-size:21px;flex:none}
.call .lab{font-size:.74rem;color:#8fd9bf}
.call .ph{font:600 1.3rem 'IBM Plex Mono';color:#eafff5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cell .k{font-size:.72rem;color:var(--muted)}
.cell .v{font:800 1.1rem 'Assistant';margin-top:2px}
.cell .v.big{color:var(--flag)}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.notes .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.notes .h .k{font-size:.72rem;color:var(--muted)}
.note{display:flex;gap:8px;font-size:.9rem;padding:9px 0;border-top:1px solid var(--line);line-height:1.4}
.note:first-of-type{border-top:0}
.note .meta{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.naddrow{display:flex;gap:8px;margin-top:10px}
.naddrow input{flex:1;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:600 .9rem 'Assistant'}
.naddrow button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:0 15px;font:700 .9rem 'Assistant'}
[hidden]{display:none!important}
.embed header{display:none}
.embed .bd{padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="lg">⛵</div><div><h1>נוכחות חניכים</h1><div class="s" id="hsub">מרכז דניאל</div></div></header>
  <div class="bd" id="main"><div class="msg"><span class="spin"></span><div style="margin-top:10px">טוען…</div></div></div>
</div>

<div class="gate" id="gate" hidden>
  <div class="box">
    <h2>מה השם המלא שלך?</h2>
    <p>כדי שנראה לך את החניכים של הקבוצה שלך. צריך שם פרטי ושם משפחה.</p>
    <input id="gname" placeholder="שם פרטי ושם משפחה" autocomplete="name">
    <div class="err" id="gerr"></div>
    <button class="go" id="gsave">המשך</button>
  </div>
</div>

<div class="ov" id="ov" hidden><div class="box" id="ovbox"></div></div>

<script>
// כתובת המחבר אינה בקוד — היא מגיעה פעם אחת דרך הקישור הפרטי (#api=...) ונשמרת במכשיר.
var API = "";
try{ API = localStorage.getItem("att_api") || ""; }catch(e){}
(function(){
  var m = /[#&?]api=([^&]+)/.exec(location.hash + "&" + location.search);
  if(m){ API = decodeURIComponent(m[1]); try{ localStorage.setItem("att_api", API); }catch(e){} try{ history.replaceState(null,"",location.pathname); }catch(e){} }
})();
try{ if(/[?&]embed=/.test(location.search)) document.documentElement.classList.add("embed"); }catch(e){}
var BRANCH = "jaffa";
try{ var mb=/[#&?]branch=([^&]+)/.exec(location.search); if(mb) BRANCH=decodeURIComponent(mb[1]); }catch(e){}
var COORDS = ["טל","ירדן"];   // רואים את כל הקבוצות
var DAYS = {0:"ראשון",1:"שני",2:"שלישי",3:"רביעי",4:"חמישי",5:"שישי",6:"שבת"};
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); };
var norm = function(s){ return String(s==null?"":s).trim().replace(/\s+/g," "); };

var state = { who:"", data:null, day:"", dates:[], di:0, groups:[], gi:0, isCoord:false };

try{ state.who = localStorage.getItem("att_who") || ""; }catch(e){}

function fmtToday(d){ return d.getDate()+"/"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2); }

function boot(){
  if(!API){ $("main").innerHTML = '<div class="msg">כדי להשתמש במסך הנוכחות צריך לפתוח אותו דרך הקישור שקיבלת מהרכז.</div>'; return; }
  if(!state.who){ openGate(); return; }
  load();
}
function openGate(){ $("gate").hidden=false; $("gname").value=state.who||""; setTimeout(function(){$("gname").focus();},100); }
$("gsave").addEventListener("click", saveName);
$("gname").addEventListener("keydown", function(e){ if(e.key==="Enter") saveName(); });
function saveName(){
  var v = norm($("gname").value);
  if(v.split(" ").length < 2){ $("gerr").textContent = "צריך שם פרטי ושם משפחה"; return; }
  state.who = v; try{ localStorage.setItem("att_who", v); }catch(e){}
  $("gate").hidden = true; load();
}

function api(params){
  var u = API + "?" + Object.keys(params).map(function(k){ return k+"="+encodeURIComponent(params[k]); }).join("&");
  return fetch(u).then(function(r){ return r.json(); });
}
function post(body){ return fetch(API, {method:"POST", body:JSON.stringify(body)}).then(function(r){ return r.json(); }); }

function load(){
  $("main").innerHTML = '<div class="msg"><span class="spin"></span><div style="margin-top:10px">טוען נוכחות…</div></div>';
  api({action:"rosterAll"}).then(function(j){
    if(!j.ok){ $("main").innerHTML = '<div class="msg">שגיאה: '+esc(j.error||"")+'</div>'; return; }
    state.all = j.groups || [];
    render();
  }).catch(function(){ $("main").innerHTML = '<div class="msg">אין חיבור. נסו שוב.</div>'; });
}

function myGroups(){
  // כל הקבוצות משני הסניפים, מסוננות למדריך לפי השם הפרטי (אלא אם רכז רואה הכול)
  var first = norm(state.who).split(" ")[0];
  state.isCoord = COORDS.indexOf(first) > -1;
  var all = state.all || [];
  if(state.isCoord) return all.slice();
  return all.filter(function(g){ return norm(g.instructor).indexOf(first) > -1; });
}

function render(){
  var groups = myGroups();
  state.groups = groups;
  $("hsub").textContent = "מרכז דניאל · יפו" + (state.isCoord ? " · כל הקבוצות" : "");
  if(!groups.length){
    $("main").innerHTML = '<div class="who">שלום <b>'+esc(state.who)+'</b> · <a id="chname">שנה שם</a></div>'+
      '<div class="msg">לא מצאנו קבוצה למדריך הזה.<br>בדקו שהשם זהה למה שכתוב בטבלה, או שנו שם.</div>';
    $("chname").onclick = openGate; return;
  }
  if(state.gi >= groups.length) state.gi = 0;
  var cur = groups[state.gi];
  // תאריכים של הקבוצה הנוכחית + בחירת ברירת מחדל (הקרוב להיום)
  state.dates = cur.dateCols.map(function(d){ return d.date; });
  state.di = nearestDate(state.dates);

  var h = '<div class="who">שלום <b>'+esc(state.who)+'</b> · <a id="chname">שנה שם</a></div>';
  // תזכורת אם הנוכחות של היום ריקה
  if(needsReminder(cur, state.dates[state.di])) h += '<div class="rem">⏰ אל תשכחו למלא נוכחות לתאריך הזה</div>';
  // בוחר קבוצה (לרכזים / כמה קבוצות)
  if(groups.length > 1){
    h += '<div class="gsel">'+groups.map(function(x,i){
      return '<button data-gi="'+i+'" class="'+(i===state.gi?"on":"")+'">'+esc(x.instructor)+' · '+esc(x.day)+'</button>';
    }).join("")+'</div>';
  }
  h += '<div class="card">';
  h += '<div class="datebar"><button class="nav" data-dd="-1">‹</button><b id="dlabel">'+esc(state.dates[state.di]||"")+'</b><button class="nav" data-dd="1">›</button></div>';
  h += '<div class="gttl"><span class="t">'+esc(cur.instructor)+' · '+esc(cur.day)+'</span><span class="pill" id="cnt"></span></div>';
  h += '<div id="stlist"></div></div>';
  $("main").innerHTML = h;
  $("chname").onclick = openGate;
  document.querySelectorAll("[data-gi]").forEach(function(b){ b.onclick=function(){ state.gi=+b.dataset.gi; render(); }; });
  document.querySelectorAll("[data-dd]").forEach(function(b){ b.onclick=function(){ changeDate(+b.dataset.dd); }; });
  renderStudents();
}

function nearestDate(dates){
  var today = new Date(); var best=0, bestdiff=1e15;
  dates.forEach(function(ds,i){ var p=ds.split("/"); var dt=new Date(2000+ +p[2], p[1]-1, +p[0]); var diff=Math.abs(dt-today); if(diff<bestdiff){bestdiff=diff;best=i;} });
  return best;
}
function changeDate(dd){ state.di=Math.max(0,Math.min(state.dates.length-1,state.di+dd)); $("dlabel").textContent=state.dates[state.di]; renderStudents(); }
function needsReminder(g, date){ return g.students.some(function(s){ return !s.attendance[date]; }); }

function renderStudents(){
  var cur = state.groups[state.gi]; var date = state.dates[state.di];
  var present = 0;
  var html = cur.students.map(function(s, idx){
    var v = s.attendance[date]||"";
    if(v==="v") present++;
    return '<div class="st">'+
      '<button class="nm" data-card="'+idx+'">'+esc(s.name)+(s.notes&&s.notes.length?' ⚠️':'')+'<small>'+esc(s.parent||"")+(s.shirt?' · חולצה '+esc(s.shirt):'')+'</small></button>'+
      '<div class="seg">'+
        '<button data-mark="v" data-row="'+s.row+'" class="'+(v==="v"?"ok":"")+'">✓</button>'+
        '<button data-mark="x" data-row="'+s.row+'" class="'+(v==="x"?"no":"")+'">✗</button>'+
      '</div></div>';
  }).join("");
  $("stlist").innerHTML = html;
  $("cnt").innerHTML = '<b>'+present+'</b> / '+cur.students.length+' נוכחים';
  document.querySelectorAll("#stlist [data-mark]").forEach(function(b){ b.onclick=function(){ mark(cur, date, b); }; });
  document.querySelectorAll("#stlist [data-card]").forEach(function(b){ b.onclick=function(){ openCard(cur.students[+b.dataset.card], cur); }; });
}

function mark(cur, date, btn){
  var row = +btn.dataset.row, val = btn.dataset.mark;
  var s = cur.students.filter(function(x){ return x.row===row; })[0];
  var nv = (s.attendance[date]===val) ? "" : val;   // לחיצה שנייה מבטלת
  s.attendance[date] = nv;                            // אופטימי
  renderStudents();
  post({action:"mark", branch:cur.branch, day:cur.day, row:row, date:date, value:nv}).then(function(j){
    if(!j||!j.ok){ s.attendance[date] = ""; renderStudents(); alert("לא נשמר, נסו שוב"); }
  }).catch(function(){ s.attendance[date]=""; renderStudents(); alert("אין חיבור"); });
}

function openCard(s, cur){
  var fem = norm(s.gender)==="בת";
  var init = norm(s.name).split(" ").slice(0,2).map(function(w){return w[0];}).join("");
  var ph = (s.phone||"").replace(/\D/g,"");
  var h = '<div class="top"><div class="av '+(fem?"f":"")+'">'+esc(init)+'</div>'+
    '<div><div class="nm">'+esc(s.name)+'</div><div class="sub">'+esc(cur.instructor)+' · '+esc(cur.day)+'</div></div>'+
    '<button class="x" id="ovx">סגור</button></div>';
  if(ph) h += '<a class="call" href="tel:'+esc(ph)+'"><div class="ic">📞</div><div><div class="lab">התקשר להורה'+(s.parent?' — '+esc(s.parent):'')+'</div><div class="ph">'+esc(s.phone)+'</div></div></a>';
  h += '<div class="grid">'+
    cell("מידת חולצה", s.shirt||"—", true)+ cell("גיל", s.age||"—")+
    cell("תאריך לידה", s.dob||"—")+ cell("מין", s.gender||"—")+'</div>';
  h += '<div class="notes"><div class="h"><span class="k">הערות</span></div><div id="nlist">'+notesHtml(s)+'</div>'+
    '<div class="naddrow"><input id="nin" placeholder="הוסף הערה…"><button id="nadd">הוסף</button></div></div>';
  $("ovbox").innerHTML = h;
  $("ov").hidden = false;
  $("ovx").onclick = closeCard;
  $("nadd").onclick = function(){ addNote(s, cur); };
}
function cell(k,v,big){ return '<div class="cell"><div class="k">'+esc(k)+'</div><div class="v'+(big?" big":"")+'">'+esc(v)+'</div></div>'; }
function notesHtml(s){
  if(!s.notes||!s.notes.length) return '<div style="color:var(--muted);font-size:.85rem;padding:6px 0">אין הערות עדיין</div>';
  return s.notes.slice().reverse().map(function(n){
    var when = n.at? new Date(n.at).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"}) : "";
    return '<div class="note"><span>📝</span><span>'+esc(n.note)+'<span class="meta">'+esc(n.by||"")+(when?' · '+when:'')+'</span></span></div>';
  }).join("");
}
function addNote(s, cur){
  var t = norm($("nin").value); if(!t) return;
  s.notes = s.notes||[]; s.notes.push({note:t, by:state.who, at:Date.now()});
  $("nlist").innerHTML = notesHtml(s); $("nin").value="";
  post({action:"addNote", branch:cur.branch, day:cur.day, student:s.name, note:t, by:state.who}).catch(function(){ alert("ההערה לא נשמרה"); });
}
function closeCard(){ $("ov").hidden = true; }
$("ov").addEventListener("click", function(e){ if(e.target.id==="ov") closeCard(); });

boot();
</script>
</body>
</html>
